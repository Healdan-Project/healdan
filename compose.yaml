# LogicalDOC Community: production baseline (home lab behind your own reverse proxy).
# Overlays: compose.dev.yaml (development), compose.proxy.yaml (Nginx Proxy Manager), docker/demo/compose.demo.yaml
# (a throwaway demo stack for the docs' screenshots). See docker/README.md.
name: logicaldoc

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # The image's superuser. The role script leaves it without a password, so it's reachable only from inside
      # this container (docker compose exec db psql -U postgres). The app connects as HEALDAN_DB_USER.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
      # The built-in provider's C.UTF-8: code-point order, Unicode lower(), LIKE prefixes on their index, and no
      # change with the image's operating system. --locale=C goes with it, or datcollate reads en_US.utf8.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C --auth-host=scram-sha-256 --auth-local=trust"
      HEALDAN_DB_NAME: ${DB_NAME:-logicaldoc}
      HEALDAN_DB_USER: ${DB_USER:-logicaldoc}
      HEALDAN_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      TZ: ${TZ:-UTC}
    healthcheck:
      # Over TCP first: the image's first start runs a temporary server on its socket only, which a check on the
      # socket would take for the real one. Then the app's role must be able to use its database (over the socket,
      # which needs no password), as a refused first start leaves a data folder the image never initialises again.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$HEALDAN_DB_USER\" -d \"$$HEALDAN_DB_NAME\" && psql -U \"$$HEALDAN_DB_USER\" -d \"$$HEALDAN_DB_NAME\" -Atc 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/10-healdan-role.sh:/docker-entrypoint-initdb.d/10-healdan-role.sh:ro

  app:
    build:
      context: .
    # Set LOGICALDOC_IMAGE to a published image (ghcr.io/healdan-project/healdan:<tag>) to pull it instead
    # of building. Publishing is off for now; see the Developer Guide's Continuous Integration page
    # (https://docs.healdan.com/developer/continuous-integration/).
    image: ${LOGICALDOC_IMAGE:-logicaldoc-community:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-logicaldoc}
      DB_USER: ${DB_USER:-logicaldoc}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      LOGICALDOC_PUBLIC_URL: ${LOGICALDOC_PUBLIC_URL:-}
      LOGICALDOC_TRUSTED_PROXIES: ${LOGICALDOC_TRUSTED_PROXIES:-}
      CATALINA_OPTS: ${CATALINA_OPTS:--Xmx2g}
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-60}
      TZ: ${TZ:-UTC}
    ports:
      - "${LOGICALDOC_BIND:-127.0.0.1}:${LOGICALDOC_PORT:-8080}:8080"
    volumes:
      - logicaldoc-conf:/opt/logicaldoc/conf
      - logicaldoc-repository:/opt/logicaldoc/repository
      # Storage backends' read cache: copies only, so backups leave it out.
      - logicaldoc-cache:/opt/logicaldoc/cache
    stop_grace_period: 60s

volumes:
  pg-data:
  logicaldoc-conf:
  logicaldoc-repository:
  logicaldoc-cache:
