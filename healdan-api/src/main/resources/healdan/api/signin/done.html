<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Healdan</title>
<style>
	:root {
		color-scheme: light dark;
		--background: #f6f7f9;
		--text: #1f2933;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--background: #16191d;
			--text: #e4e7eb;
		}
	}
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		background: var(--background);
		color: var(--text);
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		line-height: 1.5;
	}
	main {
		max-width: 28rem;
		padding: 2rem 1rem;
		text-align: center;
	}
	h1 {
		font-size: 1.5rem;
		font-weight: 600;
		margin: 0 0 1rem;
	}
	p {
		margin: 0;
		font-size: 1.0625rem;
	}
</style>
</head>
<body>
<main>
<h1>Healdan</h1>
