openapi: 3.1.0
info:
  title: Healdan API
  version: v1
  summary: The JSON API Healdan's Office add-ins and other clients use.
  description: |
    This file is the API's source of truth: the server implements it, and the
    tests check every response against it.

    - Paths are under `/api`, so `/v1/server` is `/api/v1/server`.
    - Sign in with `POST /v1/auth/tokens`, then send the token as
      `Authorization: Bearer <token>`. Operations that need no token say so.
    - Field names are camelCase. A field with no value is `null`, never left
      out. Timestamps are ISO 8601 in UTC, such as `2026-10-23T14:05:00Z`.
    - Errors are RFC 9457 problems (`application/problem+json`). Clients
      switch on their `code`, and can show their `detail` as it is.
    - Lists take `offset` (default 0) and `limit` (default 50, at most 200),
      and return a `Page`.
    - No compatibility promises yet: the API changes when Healdan's own
      clients need it to.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /v1/server:
    get:
      operationId: getServer
      summary: What this server is, and how to sign in to it
      description: A client calls this first, to check that it's talking to Healdan.
      tags: [Server]
      security: []
      responses:
        '200':
          description: The server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        default:
          $ref: '#/components/responses/Problem'
  /v1/openapi.yaml:
    get:
      operationId: getOpenApi
      summary: This description file
      tags: [Server]
      security: []
      responses:
        '200':
          description: The file
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/tokens:
    post:
      operationId: signIn
      summary: Sign in with a password, and get a device token
      description: |
        Runs Healdan's whole sign-in, with the same rules as its web page.
        The token is shown only in this answer; send it as
        `Authorization: Bearer <token>`. It stops working when it goes
        unused (30 days by default), a year after sign-in (by default), when
        it's revoked, or when the user's password changes.

        Refusals: `401 sign-in-failed` never says whether the username or
        the password was wrong, or that the account can't sign in.
        `401 password-expired` means the password must be changed in the
        web page first. `429 too-many-attempts` means too many failed
        sign-ins; the detail says when to try again.
      tags: [Sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listTokens
      summary: Your devices that are signed in
      description: Every usable token of the caller, newest first. Never the tokens themselves.
      tags: [Sign-in]
      responses:
        '200':
          description: The tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/tokens/current:
    delete:
      operationId: signOut
      summary: Sign out
      description: Revokes the token making the request.
      tags: [Sign-in]
      responses:
        '204':
          description: Signed out
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Sign one of your devices out
      description: Revokes one of the caller's tokens. Another user's token is `404`.
      tags: [Sign-in]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Revoked
        default:
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      operationId: getMe
      summary: Who you're signed in as
      tags: [Users]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/checkouts:
    get:
      operationId: listCheckouts
      summary: Documents you've checked out
      description: |
        The documents the caller has checked out and can still read, the
        latest check-out first (`hold.since`). In one page.
      tags: [Users]
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/users:
    get:
      operationId: findUsers
      summary: Find people, for a user field such as Author
      description: |
        Active people whose username, first name, last name or "first last"
        contains `q`, in any case. Sorted by name, at most 20.
      tags: [Users]
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for. A blank `q` is `400`.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The people found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHitPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents:
    get:
      operationId: findDocumentsByLegacyDocNumber
      summary: Documents by legacy doc #
      description: |
        The documents whose Legacy doc # equals `legacyDocNumber` exactly
        (same case, no wildcards), that the caller can read and that are
        published to the caller, lowest doc # first. In one page. The number
        is never read as a doc #. A missing or blank `legacyDocNumber` is
        `400`.
      tags: [Documents]
      parameters:
        - name: legacyDocNumber
          in: query
          required: true
          description: The legacy doc # to find.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The documents, none if none match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/search:
    get:
      operationId: search
      summary: Search, as the search box does
      description: |
        Runs the old web page's searches. The hits are only what the caller
        can read and what is published to the caller. `total` is always
        `null`: a page with fewer than `limit` items is the last one.

        - `documents`: documents, without emails. A `q` like `#1234`, `#1234.2`
          or `#1234v2` returns just that document, as the old web page does.
        - `emails`: emails only.
        - `all`: full text, documents and emails.
        - `folders`: folders inside Stores whose name contains `q`, in any case.
        - `matters`: matters by `998.1`-style number, a number, or name text.
        - `clients`: the matters of every client matching by number or name.

        A search that fails is `500 server-error`, not an empty page.
      tags: [Search]
      parameters:
        - name: scope
          in: query
          required: false
          description: Where to search. `documents` by default; any other value is `400`.
          schema:
            type: string
            enum: [documents, emails, all, folders, matters, clients]
            default: documents
        - name: q
          in: query
          required: true
          description: What to look for. A blank `q` is `400`. Encode a `#` as `%23`.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/lookup:
    get:
      operationId: lookupDocNumber
      summary: Resolve a typed doc #
      description: |
        Resolves `#1234`, `#1234.2`, `#1234v2` and `#1234.2.1` to the document
        and version. Input that isn't a doc # is `400`. A document that
        doesn't exist, can't be read by the caller, isn't published to the
        caller, or has no such version is `404` with the old web page's
        message, such as "No document #1234".
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          description: What was typed, starting with `#`. Encode the `#` as `%23`.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The document and version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/recent:
    get:
      operationId: listRecentDocuments
      summary: Recent documents
      description: |
        The documents the caller filed, changed, checked in or out, or
        downloaded in the last 30 days and can still read, newest first. At
        most 50, in one page.
      tags: [Documents]
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}:
    get:
      operationId: getDocument
      summary: A document
      description: |
        Addressed by its doc #. A document the caller can't read, one that
        isn't published to them, and one that doesn't exist are all `404`
        with the same answer.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}/content:
    get:
      operationId: getDocumentContent
      summary: A document's file
      description: |
        The current file, or with `version` the file of that version, as
        saved. Needs the Download permission on top of reading: without it
        the answer is `403 forbidden`. A version the document doesn't have
        is `404`. The download is recorded in the document's history, as the
        old web page records it, once per 30 seconds.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
        - name: version
          in: query
          required: false
          description: A version from the document's timeline, such as `1.0`. The current file by default.
          schema:
            type: string
            examples: ['1.0']
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: |
                `attachment` with the file name, as an ASCII `filename` and
                RFC 5987's `filename*` with the real name.
              required: true
              schema:
                type: string
            Content-Length:
              description: The file's size in bytes
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            '*/*':
              schema:
                type: string
                contentMediaType: application/octet-stream
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}/versions:
    get:
      operationId: listVersions
      summary: A document's timeline
      description: |
        Every version, newest first. A version is a whole number (`2.0`);
        the numbers between are snapshots (`1.1`).
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/recent:
    get:
      operationId: listRecentFolders
      summary: Recent folders
      description: |
        The folders inside matters where the caller created or changed a
        document in the last 30 days, that the caller can still read, newest
        first. At most 20, in one page.
      tags: [Folders]
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/{id}:
    get:
      operationId: getFolder
      summary: A folder inside a Store
      description: |
        A Store, a matter's workspace, a folder or a search folder. Folders
        outside the Stores (the root, the Default workspace, the Templates
        Store and what is in them), folders the caller can't read, and
        folders that don't exist are all `404` with the same answer.
      tags: [Folders]
      parameters:
        - $ref: '#/components/parameters/FolderId'
      responses:
        '200':
          description: The folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/{id}/children:
    get:
      operationId: listFolderChildren
      summary: What is in a folder
      description: |
        A matter's workspace or a folder gives the subfolders the caller can
        read (by name, ignoring case), then the documents the caller can read
        (by name). Hidden folders and aliases are left out. A search folder
        gives its documents, newest change first, at most 1000. `total` is
        the full count.

        A Store gives `409 not-browsable` and lists nothing: find a matter by
        search, My Matters or Recent Matters.
      tags: [Folders]
      parameters:
        - $ref: '#/components/parameters/FolderId'
        - name: type
          in: query
          required: false
          description: '`folder` for the subfolders alone. Anything else is `400`.'
          schema:
            type: string
            const: folder
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderChildPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/matters/{id}:
    get:
      operationId: getMatter
      summary: A matter
      description: |
        A matter whose workspace the caller can't read and one that doesn't
        exist are both `404` with the same answer. `lastChange` is null here.
      tags: [Matters]
      parameters:
        - name: id
          in: path
          required: true
          description: The matter's id
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: The matter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/matters/mine:
    get:
      operationId: listMyMatters
      summary: My Matters
      description: |
        The matters the caller added, that the caller can still read, by
        client number then matter number. All of them, in one page.
        `lastChange` is null.
      tags: [Matters]
      responses:
        '200':
          description: The matters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/matters/recent:
    get:
      operationId: listRecentMatters
      summary: Recent Matters
      description: |
        The matters the caller changed documents in lately, that the caller
        can still read, newest first, with `lastChange`. At most 20, in one
        page.
      tags: [Matters]
      responses:
        '200':
          description: The matters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/stores:
    get:
      operationId: listStores
      summary: The Stores
      description: |
        Every Store by name, not LogicalDOC's Default workspace or the
        Templates Store. Administrators only: anyone else gets
        `403 forbidden` and learns nothing about the Stores.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreRefPage'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/stores/{id}/matters:
    get:
      operationId: listStoreMatters
      summary: The matters in a Store
      description: |
        The Store's live matters by client number, then matter number, with
        the total. Administrators only: anyone else gets `403 forbidden`. An
        id that isn't a Store is `404`.
      tags: [Stores]
      parameters:
        - name: id
          in: path
          required: true
          description: The Store's id
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The matters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterPage'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    FolderId:
      name: id
      in: path
      required: true
      description: The folder's id
      schema:
        type: integer
        format: int64
        minimum: 0
    DocNumber:
      name: docNumber
      in: path
      required: true
      description: The document's doc #
      schema:
        type: integer
        format: int64
        minimum: 0
    Offset:
      name: offset
      in: query
      required: false
      description: How many items to skip. Default 0.
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      description: The most items to return, 1 to 200. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A device token from `POST /v1/auth/tokens`.
  responses:
    Problem:
      description: A refusal or an error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        An RFC 9457 problem. Some codes add members: `validation` adds
        `fields`, and `checked-out` and `locked` add `hold`.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: '`https://healdan.org/problems/<code>`; it needn''t resolve.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: An English sentence a client can show as it is.
        code:
          type: string
          description: What clients switch on.
          examples: [bad-request, unauthenticated, sign-in-failed, password-expired, forbidden, not-found, refused, validation, too-many-attempts, server-error]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, detail]
      properties:
        field:
          type: string
          examples: [docclass]
        code:
          type: string
          examples: [required]
        detail:
          type: string
          examples: [Class is required.]
    Page:
      type: object
      description: |
        The shape of every list. A list of things is
        `allOf: [{$ref: Page}, {properties: {items: {type: array, items: {$ref: Thing}}}}]`
        with `unevaluatedProperties: false`, as `TokenPage` is.
      required: [items, offset, limit, total]
      properties:
        items:
          type: array
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        total:
          type: [integer, 'null']
          minimum: 0
          description: Null where counting would be expensive, such as a full-text search.
    ServerInfo:
      type: object
      additionalProperties: false
      required: [product, version, apiVersion, labels, signIn]
      properties:
        product:
          type: string
          const: Healdan
        version:
          type: string
          description: The server's release
          examples: [9.3.1]
        apiVersion:
          type: string
          const: v1
        labels:
          type: object
          description: What this server calls a matter, for display only. The API always says matter.
          additionalProperties: false
          required: [matter, matters]
          properties:
            matter:
              type: string
              examples: [Matter]
            matters:
              type: string
              examples: [Matters]
        signIn:
          type: array
          description: The ways to sign in
          items:
            type: string
            enum: [password]
    SignIn:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        name:
          type: [string, 'null']
          maxLength: 100
          description: What the device is called, so you can tell your devices apart. Blank is "Unnamed device".
          examples: [Word on MacBook]
    SignedIn:
      type: object
      additionalProperties: false
      required: [token, id, name, expiresAt, user]
      properties:
        token:
          type: string
          pattern: '^hd_[A-Za-z0-9_-]{43}$'
          description: The device token. Shown only here.
        id:
          type: integer
          format: int64
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working at the latest
        user:
          $ref: '#/components/schemas/UserView'
    TokenView:
      type: object
      additionalProperties: false
      required: [id, name, created, lastUsed, expiresAt, current]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
          description: To within a few minutes
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the token making the request
    TokenPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TokenView'
      unevaluatedProperties: false
    UserView:
      type: object
      additionalProperties: false
      required: [id, username, name, email, language, admin]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
          description: The full name
        email:
          type: [string, 'null']
        language:
          type: [string, 'null']
          examples: [en]
        admin:
          type: boolean
    UserRef:
      type: object
      description: A user named in another object, such as a document's creator
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: [string, 'null']
    UserHit:
      type: object
      additionalProperties: false
      required: [id, username, name]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
    UserHitPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserHit'
      unevaluatedProperties: false
    FolderRef:
      type: object
      description: A folder named in another object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [store, matter, folder, searchFolder]
          description: '`matter` is a matter''s own top folder.'
    MatterRef:
      type: object
      description: A matter named in another object
      additionalProperties: false
      required: [id, display]
      properties:
        id:
          type: integer
          format: int64
        display:
          type: string
          description: The matter as people read it, such as `998.1 - Healdan Demo`, with an en dash
    HoldView:
      type: object
      description: Who has a document checked out or locked
      additionalProperties: false
      required: [kind, by, since]
      properties:
        kind:
          type: string
          enum: [checkout, lock]
        by:
          $ref: '#/components/schemas/UserRef'
        since:
          type: [string, 'null']
          format: date-time
    DocumentView:
      type: object
      additionalProperties: false
      required: [type, docNumber, name, size, version, fileVersion, reference, folder, matter, dateFiled, lastModified, hold, canEdit]
      properties:
        type:
          type: string
          const: document
        docNumber:
          type: integer
          format: int64
        name:
          type: string
          description: The file name
        size:
          type: integer
          format: int64
          description: The current file's size in bytes
        version:
          type: string
          description: CE's version, which moves on property edits, moves and renames too
          examples: ['2.1']
        fileVersion:
          type: string
          description: The version the file's content was last saved as
          examples: ['2.1']
        reference:
          type: string
          description: The doc # and the file version, such as `1234.2.1`
        folder:
          $ref: '#/components/schemas/FolderRef'
        matter:
          oneOf:
            - $ref: '#/components/schemas/MatterRef'
            - type: 'null'
        dateFiled:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        hold:
          oneOf:
            - $ref: '#/components/schemas/HoldView'
            - type: 'null'
          description: Null when the document is free
        canEdit:
          type: boolean
          description: Whether the caller may check the document out and save to it
    VersionView:
      type: object
      additionalProperties: false
      required: [version, fileVersion, kind, date, by, comment, event]
      properties:
        version:
          type: string
          examples: ['1.1']
        fileVersion:
          type: string
        kind:
          type: string
          enum: [version, snapshot]
        date:
          type: string
          format: date-time
        by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        comment:
          type: [string, 'null']
        event:
          type: [string, 'null']
          description: What produced the version, as CE keys it
          examples: [event.checkedin]
    VersionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VersionView'
      unevaluatedProperties: false
    StoreRef:
      type: object
      description: A Store named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ClientRef:
      type: object
      description: A client named in another object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
    FolderView:
      type: object
      additionalProperties: false
      required: [type, id, name, kind, matter, store, path, canFile]
      properties:
        type:
          type: string
          const: folder
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [store, matter, folder, searchFolder]
          description: '`matter` is a matter''s own top folder.'
        matter:
          oneOf:
            - $ref: '#/components/schemas/MatterRef'
            - type: 'null'
          description: Null for a Store
        store:
          $ref: '#/components/schemas/StoreRef'
        path:
          type: array
          description: From the Store down to the folder itself
          items:
            $ref: '#/components/schemas/FolderRef'
        canFile:
          type: boolean
          description: Whether the caller may file documents into the folder. Only a folder inside a matter can be filed into.
    MatterView:
      type: object
      additionalProperties: false
      required: [type, id, number, display, name, description, client, store, folderId, lastChange]
      properties:
        type:
          type: string
          const: matter
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
          description: The number within its client
        display:
          type: string
          description: The matter as people read it, such as `998.1 - Healdan Demo`, with an en dash
        name:
          type: string
        description:
          type: [string, 'null']
        client:
          $ref: '#/components/schemas/ClientRef'
        store:
          $ref: '#/components/schemas/StoreRef'
        folderId:
          type: integer
          format: int64
          description: The matter's workspace folder, to open with `/v1/folders/{id}`
        lastChange:
          type: [string, 'null']
          format: date-time
          description: The caller's latest change in the matter. Only Recent Matters knows it.
    MatterPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MatterView'
      unevaluatedProperties: false
    FolderPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FolderView'
      unevaluatedProperties: false
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DocumentView'
      unevaluatedProperties: false
    StoreRefPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StoreRef'
      unevaluatedProperties: false
    LookupView:
      type: object
      additionalProperties: false
      required: [docNumber, version]
      properties:
        docNumber:
          type: integer
          format: int64
        version:
          type: string
          description: The version the input names, or the current version when it names none
          examples: ['2.1']
    SearchPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/DocumentView'
                  - $ref: '#/components/schemas/FolderView'
                  - $ref: '#/components/schemas/MatterView'
                discriminator:
                  propertyName: type
                  mapping:
                    document: '#/components/schemas/DocumentView'
                    folder: '#/components/schemas/FolderView'
                    matter: '#/components/schemas/MatterView'
      unevaluatedProperties: false
    FolderChildPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/FolderView'
                  - $ref: '#/components/schemas/DocumentView'
                discriminator:
                  propertyName: type
                  mapping:
                    folder: '#/components/schemas/FolderView'
                    document: '#/components/schemas/DocumentView'
      unevaluatedProperties: false
