openapi: 3.1.0
info:
  title: Healdan API
  version: v1
  summary: The JSON API Healdan's Office add-ins and other clients use.
  description: |
    This file is the API's source of truth: the server implements it, and the
    tests check every response against it.

    - Paths are under `/api`, so `/v1/server` is `/api/v1/server`.
    - Sign in with `POST /v1/auth/tokens`, then send the token as
      `Authorization: Bearer <token>`. Operations that need no token say so.
    - Field names are camelCase. A field with no value is `null`, never left
      out. Timestamps are ISO 8601 in UTC, such as `2026-10-23T14:05:00Z`.
    - Errors are RFC 9457 problems (`application/problem+json`). Clients
      switch on their `code`, and can show their `detail` as it is.
    - Lists take `offset` (default 0) and `limit` (default 50, at most 200),
      and return a `Page`.
    - No compatibility promises yet: the API changes when Healdan's own
      clients need it to.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /v1/server:
    get:
      operationId: getServer
      summary: What this server is, and how to sign in to it
      description: A client calls this first, to check that it's talking to Healdan.
      tags: [Server]
      security: []
      responses:
        '200':
          description: The server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        default:
          $ref: '#/components/responses/Problem'
  /v1/openapi.yaml:
    get:
      operationId: getOpenApi
      summary: This description file
      tags: [Server]
      security: []
      responses:
        '200':
          description: The file
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/tokens:
    post:
      operationId: signIn
      summary: Sign in with a password, and get a device token
      description: |
        Runs Healdan's whole sign-in, with the same rules as its web page.
        The token is shown only in this answer; send it as
        `Authorization: Bearer <token>`. It stops working when it goes
        unused (30 days by default), a year after sign-in (by default), when
        it's revoked, or when the user's password changes.

        Refusals: `401 sign-in-failed` never says whether the username or
        the password was wrong, or that the account can't sign in.
        `401 password-expired` means the password must be changed in the
        web page first. `429 too-many-attempts` means too many failed
        sign-ins; the detail says when to try again.
      tags: [Sign-in]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listTokens
      summary: Your devices that are signed in
      description: Every usable token of the caller, newest first. Never the tokens themselves.
      tags: [Sign-in]
      responses:
        '200':
          description: The tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/tokens/current:
    delete:
      operationId: signOut
      summary: Sign out
      description: Revokes the token making the request.
      tags: [Sign-in]
      responses:
        '204':
          description: Signed out
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Sign one of your devices out
      description: Revokes one of the caller's tokens. Another user's token is `404`.
      tags: [Sign-in]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Revoked
        default:
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      operationId: getMe
      summary: Who you're signed in as
      tags: [Users]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me/checkouts:
    get:
      operationId: listCheckouts
      summary: Documents you've checked out
      description: |
        The documents the caller has checked out and can still read, the
        latest check-out first (`hold.since`). In one page.
      tags: [Users]
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/users:
    get:
      operationId: findUsers
      summary: Find people, for a user field such as Author
      description: |
        Active people whose username, first name, last name or "first last"
        contains `q`, in any case. Sorted by name, at most 20.
      tags: [Users]
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for. A blank `q` is `400`.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The people found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHitPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents:
    get:
      operationId: findDocumentsByLegacyDocNumber
      summary: Documents by legacy doc #
      description: |
        The documents whose Legacy doc # equals `legacyDocNumber` exactly
        (same case, no wildcards), that the caller can read and that are
        published to the caller, lowest doc # first. In one page. The number
        is never read as a doc #. A missing or blank `legacyDocNumber` is
        `400`.
      tags: [Documents]
      parameters:
        - name: legacyDocNumber
          in: query
          required: true
          description: The legacy doc # to find.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The documents, none if none match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: fileDocument
      summary: File a new document
      description: |
        Files a file in a folder as a new document, as an upload in the web
        page does. It gets the next doc #, its Date filed is now, and its
        properties are inherited from the folder, with any `properties` sent
        as the document's own. Author and Typist are the caller unless sent.
        An email (`.eml` or `.msg`) gets its From, To, CC, Subject, Sent and
        Received from the message, and is named after its subject. With
        `checkOut: true` the document is checked out to the caller too. The
        answer is `201` with the document, and its address as `Location`.

        Nothing is stored unless every check passes. They run in this order,
        and the first that fails gives the answer:

        1. `400 bad-request` for a `document` part that is missing, isn't
           the JSON expected (a field the server doesn't know included) or
           has no `folderId`, and for a missing `file` part.
        2. `404 not-found` for a folder the caller can't read, as for one
           that doesn't exist.
        3. `409 filing-rule` for a folder that can't hold documents: a
           Store, a matter's top folder or a search folder.
        4. `403 forbidden` without the Write permission on the folder.
        5. The name: `name`, or the file part's name when that's blank
           (RFC 5987's `filename*` first).
        6. The file: `413 too-large` over the upload limit, the
           `upload.maxsize` setting in MB; `422` when it's empty. A file
           more than 1 MB over the limit is refused while it's sent, before
           anything else.
        7. The properties.

        One `422 validation` lists every field that is wrong: the name, the
        file, then the properties. The codes are:

        - for `name`: `required` when there's no name at all, `invalid` for
          a name with `/`, `\` or a control character, `extension` for one
          that doesn't end with an extension, and `disallowed` for an
          extension the `upload.disallow` setting lists, in any case;
        - for `file`: `empty`;
        - for a property: those of `setProperties`, and `required` for every
          required property that has no value once inheritance has run.
          A value sent as the folder's form shows it
          (`GET /v1/folders/{folderId}/form`) is ignored, so a client can send
          the whole form back.
      tags: [Documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document, file]
              properties:
                document:
                  $ref: '#/components/schemas/NewDocument'
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: |
                    The file. The part's `Content-Disposition` names it, with
                    `filename` or RFC 5987's `filename*`.
            encoding:
              document:
                contentType: application/json
      responses:
        '201':
          description: The document, as filed
          headers:
            Location:
              description: The document's address, such as `/api/v1/documents/1234`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/search:
    get:
      operationId: search
      summary: Search, as the search box does
      description: |
        Runs the old web page's searches. The hits are only what the caller
        can read and what is published to the caller. `total` is always
        `null`: a page with fewer than `limit` items is the last one.

        - `documents`: documents, without emails. A `q` like `#1234`, `#1234.2`
          or `#1234v2` returns just that document, as the old web page does.
        - `emails`: emails only.
        - `all`: full text, documents and emails.
        - `folders`: folders inside Stores whose name contains `q`, in any case.
        - `matters`: matters by `998.1`-style number, a number, or name text.
        - `clients`: the matters of every client matching by number or name.

        The full-text scopes (`documents`, `emails`, `all`) take Lucene
        syntax. A `q` that can't be parsed, such as an unbalanced `"` or `)`,
        is `400 bad-request`. A search that fails in the database is
        `500 server-error`; a failure inside the full-text engine itself can
        show as no results.

        A leading wildcard, such as `*report` or `?ar`, is accepted.

        The full-text scopes (`documents`, `emails`, `all`) get at most about
        1000 hits from the search engine, which is its own limit; hits the
        caller can't see are dropped from those, so a page can come up short
        of the full count. The other scopes look at the first 10,000 hits.
        Pages are filled from the hits that follow the ones skipped.
      tags: [Search]
      parameters:
        - name: scope
          in: query
          required: false
          description: Where to search. `documents` by default; any other value is `400`.
          schema:
            type: string
            enum: [documents, emails, all, folders, matters, clients]
            default: documents
        - name: q
          in: query
          required: true
          description: What to look for. A blank `q` is `400`. Encode a `#` as `%23`.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/lookup:
    get:
      operationId: lookupDocNumber
      summary: Resolve a typed doc #
      description: |
        Resolves `#1234`, `#1234.2`, `#1234v2` and `#1234.2.1` to the document
        and version. Input that isn't a doc # is `400`. A document that
        doesn't exist, can't be read by the caller, isn't published to the
        caller, or has no such version is `404` with the old web page's
        message, such as "No document #1234".
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          description: What was typed, starting with `#`. Encode the `#` as `%23`.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The document and version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/recent:
    get:
      operationId: listRecentDocuments
      summary: Recent documents
      description: |
        The documents the caller filed, changed, checked in or out, or
        downloaded lately and can still read, newest first. "Lately" is the
        `recentmatters.days` setting, 30 days by default. At most 50, in one
        page.
      tags: [Documents]
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}:
    get:
      operationId: getDocument
      summary: A document
      description: |
        Addressed by its doc #. A document the caller can't read, one that
        isn't published to them, and one that doesn't exist are all `404`
        with the same answer.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}/content:
    get:
      operationId: getDocumentContent
      summary: A document's file
      description: |
        The current file, or with `version` the file of that version, as
        saved. Needs the Download permission on top of reading: without it
        the answer is `403 forbidden`. A version the document doesn't have
        is `404`. The download is recorded in the document's history, as the
        old web page records it, once per 30 seconds.

        A document protected by a password is `403 forbidden` too, unless
        the signed-in session has unlocked it in the web page. A document whose file is missing from storage
        is `500 server-error`.

        `HEAD` answers with the headers alone, and records nothing.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
        - name: version
          in: query
          required: false
          description: A version from the document's timeline, such as `1.0`. The current file by default.
          schema:
            type: string
            examples: ['1.0']
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: |
                `attachment` with the file name, as an ASCII `filename` and
                RFC 5987's `filename*` with the real name.
              required: true
              schema:
                type: string
            Content-Length:
              description: The file's size in bytes
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            '*/*':
              schema:
                type: string
                contentMediaType: application/octet-stream
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}/checkout:
    post:
      operationId: checkOutDocument
      summary: Check a document out
      description: |
        Checks the document out to the caller, so nobody else can save to it
        until it's checked in or released, and returns it. A document the
        caller has checked out already is returned as it is. The checks run
        in this order:

        1. `404 not-found` for a document the caller can't read.
        2. `403 forbidden` without the Write permission, and for a document
           protected by a password that the signed-in session hasn't given in
           the web page.
        3. `409 checked-out` when someone else has it checked out, and
           `409 locked` when it's locked with the web page's Lock action, by
           anyone, the caller included. Both add the `hold`.
        4. `409 refused` for an immutable document.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
      responses:
        '200':
          description: The document, checked out to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentView'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: releaseDocument
      summary: Release a check-out or a lock
      description: |
        Releases the document's check-out or lock without saving anything,
        and returns the document. The user who holds it can, and so can an
        administrator; the release is recorded in the history. An
        administrator's release also makes an immutable document mutable
        again, as the web page's does. Anyone else gets `409 checked-out` or
        `409 locked`, with the `hold`. A free document is returned as it is,
        and one the caller can't read is `404`.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
      responses:
        '200':
          description: The document, free
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}/versions:
    get:
      operationId: listVersions
      summary: A document's timeline
      description: |
        Every version, newest first. A version is a whole number (`2.0`);
        the numbers between are snapshots (`1.1`).
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: saveVersion
      summary: Save new content
      description: |
        Saves the file as the document's new content and returns the
        document. `kind: snapshot` is an ordinary save (2.1 becomes 2.2);
        `kind: version` is "Save as new version" (2.2 becomes 3.0). A free
        document is checked out to the caller, saved and checked in again;
        with `keepCheckedOut: true`, the save while editing, it's checked out
        to the caller again afterwards, and the history shows a check-in
        followed by a check-out. The web page can take the document in the
        moment between them: the save stands, and the answer's `hold` shows
        who has it. Two saves of one document are applied one after the
        other.

        Nothing is saved unless every check passes. They run in this order,
        and the first that fails gives the answer:

        1. `400 bad-request` for a `version` part that is missing or isn't
           the JSON expected (a missing or unknown `kind` included), and for
           a missing `file` part.
        2. `404 not-found` for a document the caller can't read.
        3. `403 forbidden` without the Write permission, and for a document
           protected by a password that the signed-in session hasn't given in
           the web page.
        4. `409 checked-out` when someone else has it checked out,
           administrators included: nobody saves over another person's open
           edit. An administrator releases the hold first
           (`DELETE /v1/documents/{docNumber}/checkout`). `409 locked` when
           it's locked with the web page's Lock action, by anyone, the caller
           included. Both add the `hold`.
        5. `409 refused` for an immutable document.
        6. The name: the file part's name (RFC 5987's `filename*` first), or
           the document's when the part has none. It may change, but its
           extension may not: compared in any case, it must be the
           document's, and it keeps the document's spelling (`Lease.DOCX`
           saved over `Lease.docx` keeps `Lease.docx`).
        7. The file: `413 too-large` over the upload limit; `422` when it's
           empty. A file more than 1 MB over the limit is refused while it's
           sent, before anything else.

        One `422 validation` lists what is wrong with `file`: `extension` for
        another extension, `invalid` for a name with `/`, `\` or a control
        character, `disallowed` for an extension the `upload.disallow`
        setting lists, and `empty`.

        A rule that refuses the check-in itself is `409 refused`. A check-in
        that is refused or fails leaves the document checked out to the
        caller, even if it was free before, with its content as it was: send
        the save again, or release it.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, file]
              properties:
                version:
                  $ref: '#/components/schemas/NewVersion'
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: |
                    The new content. The part's `Content-Disposition` names
                    it, with `filename` or RFC 5987's `filename*`.
            encoding:
              version:
                contentType: application/json
      responses:
        '201':
          description: The document, as saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{docNumber}/properties:
    get:
      operationId: getProperties
      summary: A document's properties
      description: |
        Every property of the document, in the profile's order, with where
        its value comes from: `local` for a value set on the document itself
        (an override of what it would inherit, or a value only a document
        has, such as Author), `inherited` with the folder it comes from, or
        `default` for the install's default Class. Client and Matter are
        inherited from the matter's top folder.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
      responses:
        '200':
          description: The properties, in one page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFieldPage'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: setProperties
      summary: Change a document's properties
      description: |
        Sets the properties named in `values` and leaves the others alone.
        A value that differs from what the property would inherit becomes
        the document's own (`local`). Sending the inherited value, or
        `null`, makes it inherit again. `null` clears a property that doesn't
        inherit, such as Legacy doc #. The change is saved as the web page's
        Save saves it, as a new version in the document's timeline, and the
        answer is the document's properties after it.

        A value sent as the property has it now is ignored, so a client can
        send back the whole form: unchanged Client, Matter and email fields
        aren't refused, nor is a value that is no longer in its list, and a
        form sent back unchanged saves nothing. (An override that equals
        what the property would inherit stays an override when sent back;
        send `null` to make it inherit.) Dates are compared to the second, as
        the API writes them.

        Needs the Write permission: without it the answer is
        `403 forbidden`, as it is for an immutable document unless the
        caller is an administrator. A document someone else has checked out is
        `409 checked-out`, and one someone else has locked is `409 locked`;
        both include the `hold`.

        Every value is checked before anything is saved, and a refusal
        changes nothing. `422 validation` lists every field that is wrong,
        in the order sent, with these codes:

        - `unknown`: there's no such property; or the user the value names
          doesn't exist; or the folder or document it names doesn't exist or
          the caller can't read it (the same answer).
        - `read-only`: the property can't be changed (Client, Matter, the
          email fields, read-only properties).
        - `type`: the value has the wrong JSON type or format for the
          property's `type`.
        - `not-an-option`: the property is picked from a list (it has
          `options`) and the value isn't one of them.
        - `required`: a required property in `values` would be left with no
          value. A cleared property that inherits takes what it inherits, so
          `null` for Class is never refused.
        - `class-mismatch`: the document's own Subclass wouldn't belong to its
          Class.

        A body with any other field than `values` is `400 bad-request`.
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/DocNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyPatch'
      responses:
        '200':
          description: The properties after the change, in one page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFieldPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/recent:
    get:
      operationId: listRecentFolders
      summary: Recent folders
      description: |
        The folders inside matters where the caller created or changed a
        document lately, that the caller can still read, newest first.
        "Lately" is the `recentmatters.days` setting, 30 days by default. At
        most 20, in one page.
      tags: [Folders]
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/{id}:
    get:
      operationId: getFolder
      summary: A folder inside a Store
      description: |
        A Store, a matter's workspace, a folder or a search folder. Folders
        outside the Stores (the root, the Default workspace, the Templates
        Store and what is in them), aliases, folders the caller can't read,
        and folders that don't exist are all `404` with the same answer.
      tags: [Folders]
      parameters:
        - $ref: '#/components/parameters/FolderId'
      responses:
        '200':
          description: The folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/{id}/children:
    get:
      operationId: listFolderChildren
      summary: What is in a folder
      description: |
        A matter's workspace or a folder gives the subfolders the caller can
        read (by name, ignoring case), then the documents the caller can read
        (by name). Hidden folders and aliases are left out, and an alias
        asked for by its own id is `404`. A search folder
        gives its documents, newest change first, at most 1000. `total` is
        the full count.

        A Store gives `409 not-browsable` and lists nothing: find a matter by
        search, My Matters or Recent Matters.
      tags: [Folders]
      parameters:
        - $ref: '#/components/parameters/FolderId'
        - name: type
          in: query
          required: false
          description: '`folder` for the subfolders alone. Anything else is `400`.'
          schema:
            type: string
            const: folder
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderChildPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/{folderId}/form:
    get:
      operationId: getForm
      summary: The properties form for filing a new document
      description: |
        The properties a new document filed into the folder would have, in
        the same shape as a document's properties: the values it would
        inherit and where they come from, with the caller as Author and
        Typist (`default`). A client renders any form from these fields,
        including properties an administrator added to the profile.

        A folder that can't hold documents is `409 filing-rule`, with the
        rule's words: a Store, a matter's top folder, a search folder.
        Folders outside the Stores, aliases, folders the caller can't read,
        and folders that don't exist are all `404` with the same answer.
      tags: [Folders]
      parameters:
        - name: folderId
          in: path
          required: true
          description: The folder's id
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: The form's fields, in one page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFieldPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/matters/{id}:
    get:
      operationId: getMatter
      summary: A matter
      description: |
        A matter whose workspace the caller can't read and one that doesn't
        exist are both `404` with the same answer. `lastChange` is null here.
      tags: [Matters]
      parameters:
        - name: id
          in: path
          required: true
          description: The matter's id
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: The matter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterView'
        default:
          $ref: '#/components/responses/Problem'
  /v1/matters/mine:
    get:
      operationId: listMyMatters
      summary: My Matters
      description: |
        The matters the caller added, that the caller can still read, by
        client number then matter number. All of them, in one page.
        `lastChange` is null.
      tags: [Matters]
      responses:
        '200':
          description: The matters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/matters/recent:
    get:
      operationId: listRecentMatters
      summary: Recent Matters
      description: |
        The matters the caller changed documents in lately, that the caller
        can still read, newest first, with `lastChange`. At most 20, in one
        page.
      tags: [Matters]
      responses:
        '200':
          description: The matters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/stores:
    get:
      operationId: listStores
      summary: The Stores
      description: |
        Every Store by name, not LogicalDOC's Default workspace or the
        Templates Store. Administrators only: anyone else gets
        `403 forbidden` and learns nothing about the Stores.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreRefPage'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/stores/{id}/matters:
    get:
      operationId: listStoreMatters
      summary: The matters in a Store
      description: |
        The Store's live matters by client number, then matter number, with
        the total. Administrators only: anyone else gets `403 forbidden`. An
        id that isn't a Store is `404`.
      tags: [Stores]
      parameters:
        - name: id
          in: path
          required: true
          description: The Store's id
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The matters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterPage'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    FolderId:
      name: id
      in: path
      required: true
      description: The folder's id
      schema:
        type: integer
        format: int64
        minimum: 0
    DocNumber:
      name: docNumber
      in: path
      required: true
      description: The document's doc #
      schema:
        type: integer
        format: int64
        minimum: 0
    Offset:
      name: offset
      in: query
      required: false
      description: How many items to skip. Default 0.
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      description: The most items to return, 1 to 200. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A device token from `POST /v1/auth/tokens`.
  responses:
    Problem:
      description: A refusal or an error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        An RFC 9457 problem. Some codes add members: `validation` adds
        `fields`, and `checked-out` and `locked` add `hold`.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: '`https://healdan.org/problems/<code>`; it needn''t resolve.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: An English sentence a client can show as it is.
        code:
          type: string
          description: What clients switch on.
          examples: [bad-request, unauthenticated, sign-in-failed, password-expired, forbidden, not-found, not-browsable, checked-out, locked, filing-rule, refused, too-large, validation, too-many-attempts, server-error]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        hold:
          $ref: '#/components/schemas/HoldView'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, detail]
      properties:
        field:
          type: string
          examples: [docclass]
        code:
          type: string
          examples: [required]
        detail:
          type: string
          examples: [Class is required.]
    Page:
      type: object
      description: |
        The shape of every list. A list of things is
        `allOf: [{$ref: Page}, {properties: {items: {type: array, items: {$ref: Thing}}}}]`
        with `unevaluatedProperties: false`, as `TokenPage` is.
      required: [items, offset, limit, total]
      properties:
        items:
          type: array
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        total:
          type: [integer, 'null']
          minimum: 0
          description: Null where counting would be expensive, such as a full-text search.
    ServerInfo:
      type: object
      additionalProperties: false
      required: [product, version, apiVersion, labels, signIn]
      properties:
        product:
          type: string
          const: Healdan
        version:
          type: string
          description: The server's release
          examples: [9.3.1]
        apiVersion:
          type: string
          const: v1
        labels:
          type: object
          description: What this server calls a matter, for display only. The API always says matter.
          additionalProperties: false
          required: [matter, matters]
          properties:
            matter:
              type: string
              examples: [Matter]
            matters:
              type: string
              examples: [Matters]
        signIn:
          type: array
          description: The ways to sign in
          items:
            type: string
            enum: [password]
    SignIn:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        name:
          type: [string, 'null']
          maxLength: 100
          description: What the device is called, so you can tell your devices apart. Blank is "Unnamed device".
          examples: [Word on MacBook]
    SignedIn:
      type: object
      additionalProperties: false
      required: [token, id, name, expiresAt, user]
      properties:
        token:
          type: string
          pattern: '^hd_[A-Za-z0-9_-]{43}$'
          description: The device token. Shown only here.
        id:
          type: integer
          format: int64
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working at the latest
        user:
          $ref: '#/components/schemas/UserView'
    TokenView:
      type: object
      additionalProperties: false
      required: [id, name, created, lastUsed, expiresAt, current]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
          description: To within a few minutes
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the token making the request
    TokenPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TokenView'
      unevaluatedProperties: false
    UserView:
      type: object
      additionalProperties: false
      required: [id, username, name, email, language, admin]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
          description: The full name
        email:
          type: [string, 'null']
        language:
          type: [string, 'null']
          examples: [en]
        admin:
          type: boolean
    UserRef:
      type: object
      description: A user named in another object, such as a document's creator
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: [string, 'null']
    UserHit:
      type: object
      additionalProperties: false
      required: [id, username, name]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
    UserHitPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserHit'
      unevaluatedProperties: false
    FolderRef:
      type: object
      description: A folder named in another object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [store, matter, folder, searchFolder]
          description: '`matter` is a matter''s own top folder.'
    MatterRef:
      type: object
      description: A matter named in another object
      additionalProperties: false
      required: [id, display]
      properties:
        id:
          type: integer
          format: int64
        display:
          type: string
          description: The matter as people read it, such as `998.1 - Healdan Demo`, with an en dash
    HoldView:
      type: object
      description: Who has a document checked out or locked
      additionalProperties: false
      required: [kind, by, since]
      properties:
        kind:
          type: string
          enum: [checkout, lock]
        by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          description: Who holds it; null when the server's data doesn't say
        since:
          type: [string, 'null']
          format: date-time
    DocumentView:
      type: object
      additionalProperties: false
      required: [type, docNumber, name, size, version, fileVersion, reference, folder, matter, dateFiled, lastModified, hold, canEdit]
      properties:
        type:
          type: string
          const: document
        docNumber:
          type: integer
          format: int64
        name:
          type: string
          description: The file name
        size:
          type: integer
          format: int64
          description: The current file's size in bytes
        version:
          type: string
          description: CE's version, which moves on property edits, moves and renames too
          examples: ['2.1']
        fileVersion:
          type: string
          description: The version the file's content was last saved as
          examples: ['2.1']
        reference:
          type: string
          description: The doc # and the file version, such as `1234.2.1`
        folder:
          $ref: '#/components/schemas/FolderRef'
        matter:
          oneOf:
            - $ref: '#/components/schemas/MatterRef'
            - type: 'null'
        dateFiled:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        hold:
          oneOf:
            - $ref: '#/components/schemas/HoldView'
            - type: 'null'
          description: Null when the document is free
        canEdit:
          type: boolean
          description: |
            Whether the caller may check the document out and save to it: the
            Write permission, not immutable, not protected by a password the
            session hasn't given, and no hold but the caller's own check-out
            (a lock is a hold even for the user who took it).
    VersionView:
      type: object
      additionalProperties: false
      required: [version, fileVersion, kind, date, by, comment, event]
      properties:
        version:
          type: string
          examples: ['1.1']
        fileVersion:
          type: string
        kind:
          type: string
          enum: [version, snapshot]
        date:
          type: [string, 'null']
          format: date-time
          description: When the version was saved; null when the server's data doesn't say
        by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        comment:
          type: [string, 'null']
        event:
          type: [string, 'null']
          description: What produced the version, as CE keys it
          examples: [event.checkedin]
    VersionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VersionView'
      unevaluatedProperties: false
    StoreRef:
      type: object
      description: A Store named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ClientRef:
      type: object
      description: A client named in another object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
    FolderView:
      type: object
      additionalProperties: false
      required: [type, id, name, kind, matter, store, path, canFile]
      properties:
        type:
          type: string
          const: folder
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [store, matter, folder, searchFolder]
          description: '`matter` is a matter''s own top folder.'
        matter:
          oneOf:
            - $ref: '#/components/schemas/MatterRef'
            - type: 'null'
          description: Null for a Store
        store:
          $ref: '#/components/schemas/StoreRef'
        path:
          type: array
          description: From the Store down to the folder itself
          items:
            $ref: '#/components/schemas/FolderRef'
        canFile:
          type: boolean
          description: Whether the caller may file documents into the folder. Only a folder inside a matter can be filed into.
    MatterView:
      type: object
      additionalProperties: false
      required: [type, id, number, display, name, description, client, store, folderId, lastChange]
      properties:
        type:
          type: string
          const: matter
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
          description: The number within its client
        display:
          type: string
          description: The matter as people read it, such as `998.1 - Healdan Demo`, with an en dash
        name:
          type: string
        description:
          type: [string, 'null']
        client:
          $ref: '#/components/schemas/ClientRef'
        store:
          $ref: '#/components/schemas/StoreRef'
        folderId:
          type: integer
          format: int64
          description: The matter's workspace folder, to open with `/v1/folders/{id}`
        lastChange:
          type: [string, 'null']
          format: date-time
          description: The caller's latest change in the matter. Only Recent Matters knows it.
    MatterPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MatterView'
      unevaluatedProperties: false
    FolderPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FolderView'
      unevaluatedProperties: false
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DocumentView'
      unevaluatedProperties: false
    StoreRefPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StoreRef'
      unevaluatedProperties: false
    LookupView:
      type: object
      additionalProperties: false
      required: [docNumber, version]
      properties:
        docNumber:
          type: integer
          format: int64
        version:
          type: string
          description: The version the input names, or the current version when it names none
          examples: ['2.1']
    SearchPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/DocumentView'
                  - $ref: '#/components/schemas/FolderView'
                  - $ref: '#/components/schemas/MatterView'
                discriminator:
                  propertyName: type
                  mapping:
                    document: '#/components/schemas/DocumentView'
                    folder: '#/components/schemas/FolderView'
                    matter: '#/components/schemas/MatterView'
      unevaluatedProperties: false
    FolderChildPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/FolderView'
                  - $ref: '#/components/schemas/DocumentView'
                discriminator:
                  propertyName: type
                  mapping:
                    folder: '#/components/schemas/FolderView'
                    document: '#/components/schemas/DocumentView'
      unevaluatedProperties: false
    ProfileField:
      type: object
      description: |
        One property of a document, or of the form for filing a new one. A
        client renders any form from these, without knowing the properties
        in advance.
      additionalProperties: false
      required: [name, label, type, required, editable, value, source, inheritedFrom, options]
      properties:
        name:
          type: string
          description: The property's name, as `PATCH` names it
          examples: [docclass]
        label:
          type: string
          examples: [Class]
        type:
          type: string
          enum: [string, integer, decimal, date, boolean, user, folder, document]
          description: The type of the value
        required:
          type: boolean
        editable:
          type: boolean
          description: |
            False for Client and Matter, which come from the matter, for the
            email fields, which come from the message, and for read-only
            properties
        value:
          description: |
            Null when there is none. Text for a `string`, a number for an
            `integer` or a `decimal`, true or false for a `boolean`, an ISO
            8601 timestamp for a `date`, a `UserRef` for a `user`, the
            folder's id for a `folder` and the doc # for a `document`.
            `PATCH` takes the same; a `user` also takes just the user's id.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        source:
          type: [string, 'null']
          enum: [inherited, local, default, null]
          description: |
            `local`: set on the document itself. `inherited`: from the folder
            `inheritedFrom` names, or from the matter's top folder for Client
            and Matter. `default`: the install's default Class, or the caller
            as Author and Typist of a new document. Null when there's no
            value.
        inheritedFrom:
          oneOf:
            - $ref: '#/components/schemas/FolderRef'
            - type: 'null'
          description: The folder an inherited value comes from, or null
        options:
          type: [array, 'null']
          description: The values to pick from, in order; null when the property isn't picked from a list
          items:
            $ref: '#/components/schemas/Option'
    Option:
      type: object
      description: One value of a property picked from a list
      additionalProperties: false
      required: [value, label, class]
      properties:
        value:
          type: string
        label:
          type: string
        class:
          type: [string, 'null']
          description: |
            For a Subclass, the Class it belongs to, so a client can narrow
            the list to the chosen Class; null otherwise
    ProfileFieldPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProfileField'
      unevaluatedProperties: false
    PropertyPatch:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: object
          description: |
            The new value of each property to change, by name, in the same
            form as `ProfileField.value`: a `user` takes the user's id, or the
            `{id, name}` the API shows. `null`, or empty text, clears a
            property: it inherits again if it can.
          additionalProperties:
            $ref: '#/components/schemas/PropertyValue'
          examples:
            - docclass: Letters
              legacydocnum: null
    PropertyValue:
      description: |
        A property's value as a request sends it, in the same form as
        `ProfileField.value`.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: object
          description: A user, by its `id`
          required: [id]
          properties:
            id:
              type: integer
              format: int64
        - type: 'null'
    NewDocument:
      type: object
      additionalProperties: false
      description: The `document` part of `fileDocument`.
      required: [folderId]
      properties:
        folderId:
          type: integer
          format: int64
          minimum: 0
          description: The folder to file the document into.
        name:
          type: [string, 'null']
          description: |
            The name to file it under, with its extension. The file part's
            name when it's left out or blank.
          examples: [Lease draft.docx]
        properties:
          type: [object, 'null']
          description: |
            Values for the new document's properties, by name, in the form
            `PropertyPatch.values` takes them. A property left out, sent as
            `null`, or sent as it would inherit, inherits from the folder; a
            different value becomes the document's own (`local`).
          additionalProperties:
            $ref: '#/components/schemas/PropertyValue'
          examples:
            - docclass: Letters
        checkOut:
          type: [boolean, 'null']
          description: |
            `true` to check the document out to the caller once it's filed,
            when it stays open in Word after "Save to Healdan". `false` by
            default.
    NewVersion:
      type: object
      additionalProperties: false
      description: The `version` part of `saveVersion`.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [snapshot, version]
          description: |
            `snapshot` for an ordinary save (2.1 becomes 2.2), `version` for
            "Save as new version" (2.2 becomes 3.0).
        comment:
          type: [string, 'null']
          description: The comment saved with the version.
          examples: [Sent to the client]
        keepCheckedOut:
          type: [boolean, 'null']
          description: |
            `true` for a save while editing, which leaves the document
            checked out to the caller; `false` by default, the save on
            closing, which checks it in.
