<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Healdan API</title>
<link rel="stylesheet" href="swagger-ui.css">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<style>
body { margin: 0; }
</style>
</head>
<body>
<div id="swagger-ui"></div>
<!-- Everything comes from this server: it may have no access to the internet -->
<script src="swagger-ui-bundle.js"></script>
<script>
window.ui = SwaggerUIBundle({
	url: '../v1/openapi.yaml',
	dom_id: '#swagger-ui',
	persistAuthorization: true,
	// The default sends the description to an online validator
	validatorUrl: null
});
</script>
</body>
</html>
