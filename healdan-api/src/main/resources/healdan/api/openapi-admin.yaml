        - `404 not-found` for a folder outside a workspace, the Templates
          Store among them.
        - `422 validation` for the name, as `FolderName` says, and for
          `rule`, or a member of it, missing (`required`).
        - `409 refused` for a search folder, which holds no folders; for a
          name another folder or search folder there has, compared without
          regard to case; for `rule.days` below 1; for a `docSubclass`
