openapi: 3.1.0
info:
  title: Healdan Admin API
  version: v1
  summary: The JSON API of Healdan's Admin app, for administrators only.
  description: |
    The routes under `/api/v1/admin`, which the Admin app calls. This file is
    their source of truth, as `openapi.yaml` is for the rest of the API, which
    doesn't list them: the server implements it, and the tests check every
    response under `/api/v1/admin/` against it.

    - Only the browser's web session signs in here (`cookieAuth`). A device
      token is `403 web-session-only`, so a stolen token can't administer
      anything. No session is `401 unauthenticated`.
    - Only members of the `admin` group get in. Anyone else is
      `403 admins-only`, asked again at every request, so someone taken out of
      `admin` is refused at their next one.
    - Field names, timestamps, problems and lists are as `openapi.yaml`
      describes them. `$ref` doesn't reach across the two files, so this one
      repeats `Page`, `FieldError` and the `Problem` response unchanged, and
      `Problem` with only the members the admin API answers with.
    - A change is checked in this order, and a refusal changes nothing:
      1. `400 bad-request` for a body that isn't the JSON expected, holds a
         member the route doesn't take (but for those a route names as
         `not-editable`), or holds a character Healdan can't keep (NUL, or a
         lone surrogate).
      2. `404 not-found` for what the path names, when it doesn't exist or
         isn't what the route acts on. Two query parameters are read the
         same way: `clientId` of `GET /v1/admin/matters/next-number`, which
         reads that client, and `backendId` of
         `GET /v1/admin/stores/{id}/backend`, which reads that backend. A
         list's filters keep nothing for an id that names nothing.
      3. `422 validation` for members that are missing, blank once the
         whitespace at either end is taken off, can't be changed, or are
         wrong in another way the route names, each in `fields` with its
         code, such as `required` or `not-editable`.
      4. `409 refused` for what Healdan's rules refuse, with a sentence in
         `detail` that says why, which the app can show as it is. Something
         the request names by its id that no longer exists, such as a client
         or a group, is refused this way too.

      The Storage routes have two codes of their own, which the Storage tag
      describes: `503 storage-unavailable`, on a server without Healdan's
      storage module, and `409 secret-key-missing`, with `sealed`, when
      Healdan's secret key file is missing as an S3 secret is typed.
    - Every change is recorded in the administration record: when, who and
      from where, its area, its action (such as `matter.moved`), what it
      acted on, and the fields it changed with their old and new values. A
      change that's one transaction is recorded inside it, so the two stand
      or fall together; one that isn't, such as a delete, is recorded
      straight after it succeeds. A change that changes nothing isn't
      recorded.
servers:
  - url: /api
security:
  - cookieAuth: []
tags:
  - name: Dashboard
    description: |
      The Dashboard area (`AdminArea.DASHBOARD`): the Dashboard and the top
      bar's find (Admin app spec sections 7.1 and 8.1).
  - name: Matters
    description: |
      The Matters area (`AdminArea.MATTERS`): clients, matters, their
      workspaces and the workspace templates (Admin app spec sections 8.2 to
      8.5). Only members of `admin`, on the web session, reach these routes:
      no session is `401 unauthenticated`, a device token
      `403 web-session-only`, and anyone else `403 admins-only`.

      A workspace is a matter's own folder and everything in it, or a
      workspace template's: a folder directly in the Templates Store, and
      everything in it. The routes under `/v1/admin/workspaces`,
      `/v1/admin/folders` and `/v1/admin/search-folders` act only on a
      workspace's folders and search folders, its top folder included: any
      other id, such as a Store's, the Templates Store's, the root's or
      LogicalDOC's Default workspace's, an alias, a folder in the Trash or one
      that doesn't exist, is `404 not-found`.
  - name: Stores
    description: |
      The Stores area (`AdminArea.STORES`): the Stores, who can see each,
      and a Store's page, rename, delete and restore (Admin app spec section
      8.6). A Store is a workspace directly under the root that holds
      matters; LogicalDOC's Default workspace and the Templates Store aren't
      Stores. Only members of `admin`, on the web session, reach these
      routes: no session is `401 unauthenticated`, a device token
      `403 web-session-only`, and anyone else `403 admins-only`.

      Which storage backend a Store keeps its files on, and its files that
      haven't moved, are the Storage tag's routes under the same address.
  - name: Storage
    description: |
      The Storage area (`AdminArea.STORAGE`): the storage backends, the
      backend each Store keeps its files on, the files the mover gave up on,
      and the storage settings, everything the Classic Interface's Storage
      tab does (Admin app spec sections 8.6 and 9.7). Only members of
      `admin`, on the web session, reach these routes: no session is
      `401 unauthenticated`, a device token `403 web-session-only`, and
      anyone else `403 admins-only`.

      - A server without Healdan's storage module answers every route here
        `503 storage-unavailable`, after a body that isn't the JSON expected
        (`400`) and before anything else.
      - Storage backends are off on a server that keeps its files in
        LogicalDOC's own store, not through Healdan's storage. Then
        `GET /v1/admin/backends`, `GET /v1/admin/storage/settings` and
        `GET /v1/admin/stores/{id}/backend` answer `on: false`, with no
        backends; a backend named in the path is `404 not-found`, as none is
        listed; the two lists of stuck files answer what's recorded; and
        every other route, Test before saving included, is `409 refused`,
        with a sentence that says storage backends are off, in the check
        order's step 4.
      - The refusals are the Storage tab's, each `409 refused` with its
        sentence in `detail`, which the app shows as it is, and two of the
        Admin app's own, each with a sentence of its own: storage backends
        off, and a Store in the Trash that keeps its files on a backend
        being removed, or whose bucket, prefix or path would change, which it
        names, saying it's in the Trash and how to free the backend.
      - When Healdan's secret key file is missing while values are sealed
        with it, a change that types an S3 secret is `409 secret-key-missing`,
        with the sentence in `detail` and `sealed`, how many stored values
        are sealed with the missing key, and nothing is written. Sent again
        with `newKey: true`, it makes a new key, which leaves those values to
        be entered again: the app asks first, as the tab does.
      - Nothing here answers an S3 secret, only whether one is stored. An
        encrypted backend's recovery key is answered only by the add of that
        backend and by `POST /v1/admin/backends/{id}/recovery-key/show`, each
        recorded as a showing. Neither a problem nor a Test's `problems`
        holds what a request typed as a secret, a recovery key or its last
        group.
      - Each change is recorded in the Storage area, straight after it
        succeeds, as a storage change isn't one transaction with its record.
        A secret's and an access key's changes are recorded as changed, with
        no value. A change that changes nothing isn't recorded.
  - name: People
    description: |
      The People area (`AdminArea.PEOPLE`): the people who sign in to
      Healdan, the groups that give them access, and the groups for the
      forms that name one (Admin app spec section 8.7). Only members of
      `admin`, on the web session, reach these routes: no session is
      `401 unauthenticated`, a device token `403 web-session-only`, and
      anyone else `403 admins-only`.

      - A person is an account of the caller's tenant that isn't deleted and
        isn't a system account. A system account, such as `_system`, which
        runs Healdan's own jobs, isn't a person: it isn't listed or counted,
        and it's `404 not-found` on every `/v1/admin/users/{id}` path and as
        a group's member, so nothing here changes it.
      - New User makes a password account. An account linked to a sign-in
        provider (`signsInWith`) signs in there and has no password, so
        Reset Password is refused for it. It's made, or a password account
        with the same email linked to it when the provider links by email,
        at the person's first sign-in there, with the groups the provider's
        group map gives them. Its names and email, and its membership of
        each group the provider's map names (`Group.mappedBy`), may be set
        again from the provider at its next sign-in there.
      - A read-only account (`readOnly`) is always in its own group and
        `guest`, and in no other: a list of its groups keeps `guest` whether
        or not it names it, taking it out of `guest` is refused, and so is
        adding it to any other group. This app makes no read-only account,
        and changes no account's kind.
      - Every account but a read-only one is always in Everyone: a list of
        its groups keeps Everyone whether or not it names it, and taking it
        out of Everyone is refused.
      - A change that would change nothing, such as disabling an account
        that's disabled, is answered as it is, before any refusal below but
        that of a caller whose own account was disabled meanwhile, and isn't
        recorded; `refusals` agree, refusing no action that would change
        nothing.
      - So that someone can always administer Healdan, each of these is
        `409 refused` with a sentence that says why: disabling the `admin`
        account, or taking it out of the `admin` group; disabling yourself,
        or taking yourself out of `admin` (another administrator does, as
        you'd lose this app mid-change); and any change that would leave no
        enabled administrator, an enabled account in `admin`. Two such
        changes at the same moment are made one after the other, the second
        counting the administrators the first left and refusing a caller
        whose own account the first disabled, so two administrators can't
        take each other out. Disable and the changes to someone's groups or
        a group's members refuse such a caller first, before a change that
        would change nothing is answered, as `403 admins-only` comes before
        it too: a caller who is no longer an enabled administrator is told
        so, whatever the change would have done. A person's `refusals` say
        beforehand which of their page's actions would be refused, and why.
      - Disable, Reset Password and Sign Out Everywhere sign the person out
        everywhere: their device tokens are revoked, and once the change has
        committed every open session on this server that they opened, as
        themselves or as another account, closes, so every app and device
        signed in as them is signed out at its next request.
      - A temporary password, which New User and Reset Password make, is in
        that route's answer only, and only when it wasn't emailed: never in
        another answer, a problem, the administration record or a log line.
      - A person's own group, which every account has, named `_user_` and
        its id, isn't listed, and is `404 not-found` on every
        `/v1/admin/groups/{id}` path, as is a deleted group and another
        tenant's. `admin`, `guest`, `publisher` and Everyone are fixed
        (`Group.fixed`): they're never renamed or deleted, though their
        descriptions change.
      - Each change is recorded in the People area, aimed at the person
        (`user`) or the group (`group`).
  - name: Monitoring
    description: |
      The Monitoring area (`AdminArea.MONITORING`): the errors the server
      logged, its log files, the Audit Trail and the background jobs (Admin
      app spec sections 8.8 and 9.3 to 9.5). Only members of `admin`, on the
      web session, reach these routes: no session is `401 unauthenticated`,
      a device token `403 web-session-only`, and anyone else
      `403 admins-only`.

      - A fault's message and stack, each log line, and a job's error are
        answered as the server logged them, but for the user name and
        password of each URL written plainly in them, which are taken out:
        `scheme://user:secret@host` reads `scheme://host`, and so does a
        URL that follows another's host directly, as in a list of hosts
        joined by commas. What isn't recognised stays as it was logged: a
        password that itself holds a raw `/`, `?`, `#`, a space, a quote or
        an angle bracket; a URL that is JSON-escaped or percent-encoded;
        and a URL cut short by a length limit before its `@`. So treat these
        answers as holding what the server logged. A log's download is its
        files as they are.
      - A log is named by its appender's name, as `GET /v1/admin/logs` lists
        it, and only those names are taken: nothing a request sends is read
        as a file's name or path.
      - Marking a fault resolved or unresolved is recorded inside its
        transaction, aimed at the fault (`error`). A job's action is
        recorded straight after it, aimed at the job (`job`) by its name, as
        a job's runs and schedule aren't kept in the database. A change
        that changes nothing isn't recorded, and nothing that reads is: a
        log's download and the Audit Trail's export included.
  - name: Search Index
    description: |
      The Search Index area (`AdminArea.SEARCH_INDEX`): the index's counts
      and health, LogicalDOC's Indexer, the documents that couldn't be
      indexed or wait to be, what the index was given, and reindexing
      (Admin app spec sections 8.9, 9.6 and 13). Only members of `admin`,
      on the web session, reach these routes: no session is
      `401 unauthenticated`, a device token `403 web-session-only`, and
      anyone else `403 admins-only`.

      - The documents counted are the live ones, not shortcuts and not in
        the Trash. A document is indexed once its entry has been written to
        the index, until it's marked to be indexed again. It waits when it's
        marked to be indexed, its file or its properties alone, and isn't
        archived, which LogicalDOC's Indexer leaves alone; the Indexer takes
        those waiting a batch at a time, on its schedule. It couldn't be
        indexed when it's marked to have its file indexed, isn't archived,
        and the last time it was tried it couldn't be: those are counted and
        listed apart from those waiting, and the Indexer goes on trying each
        on its schedule until it's indexed or set to Skip. One set to Skip is
        counted in none of the three.
      - A document is named by its doc #, as in the public API, and by
        LogicalDOC's internal id, which only tells documents apart here.
      - **Try Again** on a document whose file's storage can't be reached
        right now is `503 storage-unreachable`, as in the public API: the
        one admin route that answers it.
      - A reindex runs on the server, straight through, one at a time,
        replacing each document's entry as it's done, so search keeps
        finding its documents while it runs (spec section 9.6). It's
        started, watched and cancelled here; Background Jobs lists the
        worker that runs it, `reindex`, which is never run there.
      - A reindex's start is recorded inside its transaction, and its
        cancel, **Try Again** and **Skip** straight after each, all in the
        Search Index area: `reindex.started` and `reindex.cancelled`, aimed
        at what the reindex covers, and `index.retried` and
        `index.skipped`, aimed at the document. **Run Indexer Now** is
        recorded as Background Jobs records Run Now. A change that changes
        nothing isn't recorded, and nothing that reads is, a preview
        included.
paths:
  /v1/admin/dashboard:
    get:
      operationId: adminDashboard
      summary: What needs attention, and the server's health
      description: |
        The Dashboard's first two parts (Admin app spec section 8.1),
        assembled at each request from what the server keeps of each source,
        so a request stays cheap. Each source's answer, or its failure, is
        kept for a minute (the database's for five, and each sign-in
        provider is asked whether it answers at most every five minutes),
        then worked out again on a thread of its own while the last answer
        is given, until it's two of those periods old. A request waits only
        for a source with no answer it can give, at most 5 seconds; one
        still being worked out then is unchecked, and its tile's `problem`
        says so, until a later request. The memory and the time up are read
        at each request.

        - `attention`, what an administrator should act on, each with a link
          to where it's fixed: each code at most once, in the order
          `AttentionCode` lists them. Empty when all is well, or when nothing
          could be checked.
        - `unchecked`, the codes whose source couldn't be read, so they may
          need attention that `attention` can't show. Empty when everything
          was checked.
        - `health`, the ten Server Health tiles: always all ten, in the order
          `HealthTile.name` lists them. A tile whose part couldn't be read
          has `problem`, and the other tiles are whole.
        - `readAt`, when the oldest answer given was read. Each source is
          kept for a while, so the figures are as of then, not as of the
          request, and asking again sooner gives the same ones.

        A part that couldn't be read never carries the error's own text.

        No web session is `401 unauthenticated`, a device token
        `403 web-session-only`, and anyone not in `admin`
        `403 admins-only`.
      tags: [Dashboard]
      responses:
        '200':
          description: The attention list and the tiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/dashboard/usage:
    get:
      operationId: adminDashboardUsage
      summary: The Dashboard's Usage
      description: |
        The Dashboard's third part (Admin app spec section 8.1), from one
        summary the server keeps in memory and works out on a thread of its
        own: at the start, then 15 minutes after the last one ended. A
        request never works it out: it gets the last one, with
        `computedAt`. Until the first has been worked out after a start,
        `computedAt` and the totals are null and the lists empty. When the
        last try failed, `failedAt` says when, beside the last summary that
        didn't (or the empty one), until a try works again.

        The last 7 and 30 days, and each day of `filedPerDay`, start at
        midnight in `zone`, as the User app's days do. The server keeps a
        summary for its own zone and for the four asked for most recently: a
        zone asked for the first time gets the empty one, `computedAt` null,
        and its own is worked out at once, for a later request.

        A `zone` the server doesn't know is `400 bad-request`. No web session
        is `401 unauthenticated`, a device token `403 web-session-only`, and
        anyone not in `admin` `403 admins-only`.
      tags: [Dashboard]
      parameters:
        - name: zone
          in: query
          required: false
          description: |
            The time zone the days are in, as an IANA id such as
            `Europe/London`: the browser's own, so the days are the ones its
            person sees; the server's time zone without it.
          schema:
            type: string
            examples: [Europe/London]
      responses:
        '200':
          description: The usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/find:
    get:
      operationId: adminFind
      summary: Find a client, matter or person
      description: |
        The top bar's find (Admin app spec section 7.1): at most five each of
        clients, matters and people, `q` read with the whitespace at either
        end taken off, in any case, its `%` and `_` taken as they are.

        - Clients whose name contains `q`, or whose number is `q`. By
          number.
        - Matters whose name contains `q`; the matter `q` names as
          `1001.1`; and, for a bare number such as `1001`, that client's
          matters. Live ones only: not deleted, and not in the Trash. By
          client number, then matter number.
        - People whose username, first name, last name or "first last"
          contains `q`, disabled ones too. Not system accounts such as
          `_system`. By first name, then last name.

        A missing or blank `q` is `422 validation`. No web session is
        `401 unauthenticated`, a device token `403 web-session-only`, and
        anyone not in `admin` `403 admins-only`.
      tags: [Dashboard]
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: What was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Found'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/clients:
    get:
      operationId: adminListClients
      summary: The clients
      description: |
        The Clients list (Admin app spec section 8.2): every client, with its
        live matters and its documents' figures. A page of `limit` from
        `offset`, with the total once `q` has filtered them.

        - `q`, read with the whitespace at either end taken off, in any case,
          its `%` and `_` taken as they are, keeps the clients whose number
          starts with it or whose name contains it. Without it, or blank,
          every client.
        - `matters` counts its live matters, not deleted or in the Trash, as
          they are at the request.
        - `documents` and `lastActivity` are its matters' figures, from the
          summary the server keeps in memory for the Dashboard's Usage,
          worked out at most every 15 minutes and never by a request:
          `figuresAt` says when. Until the first summary since the server
          started, they and `figuresAt` are null; a matter made since the
          last summary adds no documents and no activity to its client's
          until the next.
        - `sort` is `number` (the default), `name` (ignoring case),
          `matters`, `documents` or `lastActivity`, and `order` `asc` (the
          default) or `desc`. Ties go by number, and a client with nothing
          to sort by, such as a null `lastActivity`, comes last whichever
          the order.

        A `sort` or `order` that isn't one of these, a negative `offset` or
        a `limit` outside 1 to 200 is `400 bad-request`.
      tags: [Matters]
      parameters:
        - name: q
          in: query
          required: false
          description: A client's number, or part of its name
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: The column to sort by; `number` by default
          schema:
            type: string
            enum: [number, name, matters, documents, lastActivity]
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminCreateClient
      summary: Create a client
      description: |
        Creates a client with the number and name given, through
        `ClientService.create`, and answers `201` with it, its address as
        `Location` (Admin app spec section 8.2). The name has the whitespace
        at either end taken off. The number never changes afterwards, and
        nothing deletes a client. `GET /v1/admin/clients/next-number` gives
        the number to suggest.

        - `422 validation` for `number` or `name` missing, or a name that's
          blank (`required`).
        - `409 refused` for a number below 1 or already used, and a name
          over 255 characters. Of two creates of one number at the same
          moment, the second is refused as a used number, with the same
          sentence.

        Recorded as `client.created`, with its number and name.
      tags: [Matters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClient'
      responses:
        '201':
          description: The new client
          headers:
            Location:
              description: The client's address, such as `/api/v1/admin/clients/12`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/clients/next-number:
    get:
      operationId: adminNextClientNumber
      summary: The number to suggest for a new client
      description: |
        The highest client number in use plus 1, or 1 with no client yet
        (`ClientService.suggestNumber`), for New Client to fill in. It
        reserves nothing: of two administrators given the same number, the
        second to create is refused.
      tags: [Matters]
      responses:
        '200':
          description: The number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextNumber'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/clients/{id}:
    get:
      operationId: adminGetClient
      summary: A client
      description: |
        The client, as the list gives it, for its page (Admin app spec
        section 8.2), which lists its matters with
        `GET /v1/admin/matters?clientId=`. A client that doesn't exist is
        `404 not-found`.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/ClientPath'
      responses:
        '200':
          description: The client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminRenameClient
      summary: Rename a client
      description: |
        Changes the client's name, through `ClientService.rename`, and
        answers the client. Only the name can change (Admin app spec section
        8.2), and no matter's folder is renamed with it: a matter's folder
        is named by its number and its own name.

        - `404 not-found` for a client that doesn't exist.
        - `422 validation` for a body with `number` (`not-editable`), and for
          a name missing or blank (`required`).
        - `409 refused` for a name over 255 characters.

        Recorded as `client.renamed`, with the name before and after. A
        rename to the name it has changes nothing and isn't recorded.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/ClientPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameChange'
      responses:
        '200':
          description: The client, renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/matters:
    get:
      operationId: adminListMatters
      summary: The matters
      description: |
        The Matters list (Admin app spec section 8.3), the one place that
        lists every matter: the live ones, not deleted or in the Trash. A
        page of `limit` from `offset`, with the total once the filters have
        applied, which all apply together.

        - `q`, read with the whitespace at either end taken off, in any case,
          its `%` and `_` taken as they are, keeps the matters whose number
          with their client's, such as `1001.1`, starts with it, or whose
          name or client's name contains it. Without it, or blank, every
          matter.
        - `clientId`, `storeId` and `ownerId` keep the matters of that
          client, in that Store, or owned by that person. An id that names
          nothing keeps none.
        - `documents`, `bytes` and `lastActivity` come from the summary the
          server keeps in memory for the Dashboard's Usage, worked out at
          most every 15 minutes and never by a request: `figuresAt` says
          when. Until the first summary since the server started, they and
          `figuresAt` are null; a matter made since the last summary has
          `documents` and `bytes` 0 and `lastActivity` null until the next.
        - `sort` is `number` (the default: by client number, then matter
          number), `name`, `client` (its name, then its number), `store`,
          `owner`, `template` (each by name), `documents`, `bytes` or
          `lastActivity`, names ignoring case, and `order` `asc` (the
          default) or `desc`. Ties go by number, and a matter with nothing
          to sort by, such as no template or a null `lastActivity`, comes
          last whichever the order.

        A `sort` or `order` that isn't one of these, a negative `offset` or
        a `limit` outside 1 to 200 is `400 bad-request`.
      tags: [Matters]
      parameters:
        - name: q
          in: query
          required: false
          description: A matter's number, such as `1001.1`, or part of its name or its client's name
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          description: Only this client's matters
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: storeId
          in: query
          required: false
          description: Only the matters in this Store
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: ownerId
          in: query
          required: false
          description: Only the matters this person owns, by the user's id
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: sort
          in: query
          required: false
          description: The column to sort by; `number` by default
          schema:
            type: string
            enum: [number, name, client, store, owner, template, documents, bytes, lastActivity]
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of matters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminCreateMatter
      summary: Create a matter
      description: |
        Creates a matter and its workspace from a workspace template, all or
        nothing, through `MatterService.create` (Admin app spec section
        8.3), and answers `201` with it, its address as `Location`. The
        template's folders, with their permissions, their properties and
        its search folders, are copied into the Store as the matter's own
        folder, named as `1001.2 – Name`; every folder gets the matter's
        client and matter; and the owner's own group gets Full Access to
        the matter's folder. `POST /v1/admin/matters/check` says beforehand
        what this would refuse.

        - `422 validation` for `clientId`, `number`, `name`, `storeId`,
          `ownerId` or `templateId` missing, or a name that's blank
          (`required`).
        - `409 refused` for what `MatterService` refuses: a client, Store,
          template or owner that no longer exists; an owner whose account is
          disabled; a number below 1 or already used, by a deleted matter
          too, as a matter's number is never used again (by any client's
          matter when numbers are system-wide); a name with `/`, `\` or
          markup, or too long for the folder's name; a description over
          4,000 characters; and the permission rules: a folder of the
          template that grants more than its parent (P1), or a group that
          could read the matter but can't read its Store (P2; the owner's
          own group passes when the owner can read the Store). Of two
          creates of one number at the same moment, the second is refused
          as a used number, with the same sentence.

        Recorded as `matter.created`, with every field it set: the client,
        number, name, description, Store, template and owner, by name and
        username, as `Ann Lee (alee)`.
      tags: [Matters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMatter'
      responses:
        '201':
          description: The new matter
          headers:
            Location:
              description: The matter's address, such as `/api/v1/admin/matters/34`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/matters/check:
    post:
      operationId: adminCheckMatter
      summary: What creating a matter would refuse
      description: |
        New Matter's check, run as the form changes (Admin app spec section
        8.3): the problems `createMatter` would refuse in the draft, found
        with the same rules, so they're said before **Create Matter**. It
        creates and writes nothing, and records nothing.

        The draft is the form as it stands: any member may be left out or
        null, and a problem is looked for only once every member it needs
        is given, as `MatterProblemCode` says. A blank name is no problem
        here: the form asks for one itself. `problems` is empty when nothing
        is found, and is in the order `MatterProblemCode` lists the codes.

        A draft never answers `422`: a member that's missing is left
        unchecked.
      tags: [Matters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterDraft'
      responses:
        '200':
          description: The problems found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterCheck'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/matters/next-number:
    get:
      operationId: adminNextMatterNumber
      summary: The number to suggest for a client's next matter
      description: |
        The highest matter number in use plus 1, the client's or, when
        numbers are system-wide (Healdan Settings), the whole install's,
        deleted matters included, as a number is never used again
        (`MatterNumbering.suggest`); 1 with none. New Matter fills it in as
        the next free number. It reserves nothing: of two administrators
        given the same number, the second to create is refused.

        A missing `clientId` is `422 validation` (`required`), and a client
        that doesn't exist `404 not-found`.
      tags: [Matters]
      parameters:
        - name: clientId
          in: query
          required: true
          description: The client the matter is for
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: The number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextNumber'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/matters/{id}:
    get:
      operationId: adminGetMatter
      summary: A matter
      description: |
        The matter, for its page (Admin app spec section 8.3): its facts,
        its figures from the summary as the list gives them, its own
        folder's id for the Workspace tab and **Open in Healdan**, and, for
        the Overview tab, how many of its documents couldn't be indexed and
        how many previews were given up on, both counted at the request
        from the documents stamped with its client and matter.

        A matter that doesn't exist, or whose folder is in the Trash, is
        `404 not-found`.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/MatterPath'
      responses:
        '200':
          description: The matter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminEditMatter
      summary: Edit a matter
      description: |
        Changes the matter's name, description and owner, the only things
        **Edit** changes, through `MatterService.update` (Admin app spec
        section 8.3), and answers the matter. A member left out stays as it
        is; a `description` of null, or blank, takes it away. A new name
        renames the matter's folder (`1001.2 – New Name`). A new owner's own
        group gets Full Access to the matter's folder and the old owner's
        row is taken off it, and off the folders below that narrow with it.

        - `404 not-found` for a matter that doesn't exist or whose folder is
          in the Trash.
        - `422 validation` for `clientId`, `number`, `storeId` or
          `templateId` (`not-editable`): a matter's client, number and
          template never change, and **Move to Another Store** changes its
          Store. Also for a name that's null or blank, or an owner that's
          null (`required`).
        - `409 refused` for what `MatterService` refuses: a name with `/`,
          `\` or markup, or too long for the folder's name; a description
          over 4,000 characters; an owner that doesn't exist or whose
          account is disabled; and a new owner who can't read the matter's
          Store (P2).

        Recorded as `matter.updated`, with the fields whose values changed,
        an owner by name and username, as `Ann Lee (alee)`. An edit that
        changes nothing isn't recorded.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/MatterPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterChange'
      responses:
        '200':
          description: The matter, changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminDeleteMatter
      summary: Move a matter to the Trash
      description: |
        Moves the matter's folder, and everything live in it, to the
        caller's Trash, through LogicalDOC's folder delete, as the User
        app's delete of a folder does, and answers the Trash item it made
        (Admin app spec section 8.3). The matter's row stays, so its number
        stays taken; the matter is then `404` here and gone from the lists.
        An administrator restores it from the User app's Trash
        (`POST /v1/trash/{id}/restore` with `trashItemId`), which brings it
        back as it was.

        - `404 not-found` for a matter that doesn't exist or whose folder is
          already in the Trash.
        - `409 refused` while a document in it is checked out, by anyone,
          the caller too; while it holds an immutable document; and for what
          Healdan's rules refuse.

        Recorded as `matter.deleted`, after the delete.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/MatterPath'
      responses:
        '200':
          description: The Trash item the delete made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedMatter'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/matters/{id}/move:
    post:
      operationId: adminMoveMatter
      summary: Move a matter to another Store
      description: |
        Moves the matter's folder, with everything in it, into another
        Store, through LogicalDOC's folder move, and answers the matter in
        its new Store (Admin app spec section 8.3). The matter keeps its
        client, number and name, and its documents their properties; a
        folder in it that followed the old Store's permissions is fitted to
        the new Store's, as on every route. The documents' files follow to
        the new Store's storage backend in the background, so until they
        have, a file may still be read from the old one. A move into the
        Store it's in changes nothing.

        - `404 not-found` for a matter that doesn't exist or whose folder is
          in the Trash.
        - `422 validation` for a missing `storeId` (`required`).
        - `409 refused` when `storeId` isn't a live Store (Default, Templates
          and the root aren't Stores); while a document in it is checked out,
          by anyone; when a folder in the Store already has the matter's
          folder's name, compared without regard to case, as the matter's
          folder is never renamed to fit; and for what Healdan's rules
          refuse, such as a group that can read the matter but can't read
          the new Store (P2).

        Recorded as `matter.moved`, with the Store before and after, inside
        the move's transaction.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/MatterPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterMove'
      responses:
        '200':
          description: The matter, in its new Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/workspaces/{folderId}/tree:
    get:
      operationId: adminWorkspaceTree
      summary: A workspace's folders
      description: |
        The Workspace Editor's folder tree (Admin app spec section 8.4), of a
        matter's workspace or a workspace template's: `folderId` is the
        matter's own folder (`folderId` in its `Matter`) or the template's
        (its `id`). Every live folder and search folder in it, at every
        level, hidden ones too, with `ownPermissions` on each folder that
        has permissions of its own, which the editor shows with a lock. Each
        folder's `children` are its folders, then its search folders, each
        by name, ignoring case; a search folder has none. A folder alias,
        which LogicalDOC can keep from before Healdan, is left out, as New
        Matter's copy leaves it out.

        Any other id is `404 not-found`: a folder inside a workspace (ask
        for its workspace's tree), a Store, and the others the Matters tag
        names.
      tags: [Matters]
      parameters:
        - name: folderId
          in: path
          required: true
          description: The matter's own folder, or the template's
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: The workspace's top folder, with everything in it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceNode'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/folders/{id}:
    patch:
      operationId: adminRenameFolder
      summary: Rename a workspace's folder
      description: |
        Renames a folder or search folder of a workspace (Admin app spec
        section 8.4), at any level below its top folder, a matter's top
        level included. It's the only route that renames a search folder, so
        a folder's name and a search folder's follow one rule. The name has
        the whitespace at either end taken off; the folder's own name
        changes nothing, after the checks up to `404`. Answers `204`.

        - `404 not-found` for a folder outside a workspace.
        - `422 validation` for the name, as `FolderName` says.
        - `409 refused` for the workspace's top folder (a matter's takes its
          name from the matter, through `PATCH /v1/admin/matters/{id}`, and
          a template's through `PATCH /v1/admin/templates/{id}`); for a name
          another folder or search folder in the same folder has, compared
          without regard to case (changing only the case of its own name
          works); and for what Healdan's rules refuse.

        Recorded as `folder.renamed`, with the name before and after.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderRename'
      responses:
        '204':
          description: Renamed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminDeleteFolder
      summary: Move a workspace's folder to the Trash
      description: |
        Moves a folder or search folder of a workspace, below its top
        folder, and everything live in it, to the caller's Trash, through
        LogicalDOC's folder delete, as the User app's delete does (Admin app
        spec section 8.4), and answers the Trash item the delete made, as
        a matter's delete does, so the app can say what went. A matter's
        folder comes back with `POST /v1/trash/{id}/restore`; a template's
        doesn't, as the User app's Trash restores into a Store only
        (`409 place-gone`). A matter made from a template keeps its own copy
        of a folder deleted from the template.

        - `404 not-found` for a folder outside a workspace.
        - `409 refused` for the workspace's top folder (a matter's is
          deleted with `DELETE /v1/admin/matters/{id}`, a template's with
          `DELETE /v1/admin/templates/{id}`); while a document in it is
          checked out, by anyone, the caller too; while it holds an
          immutable document; and for what Healdan's rules refuse.

        Recorded as `folder.deleted`, after the delete.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      responses:
        '200':
          description: In the Trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedFolder'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/folders/{id}/children:
    post:
      operationId: adminCreateFolder
      summary: Create a folder in a workspace
      description: |
        Creates a folder in the folder `id` names, in a workspace, at any
        level, its top folder included, so a matter's top level too (Admin
        app spec section 8.4). The name has the whitespace at either end
        taken off. The new folder follows its parent's permissions, takes
        the properties its parent passes down and, in a matter, the matter's
        client and matter, as a folder made in the User app does. Answers
        `201` with it, as a node of the tree with no children.

        - `404 not-found` for a folder outside a workspace.
        - `422 validation` for the name, as `FolderName` says.
        - `409 refused` for a search folder, which holds no folders; for a
          name another folder or search folder there has, compared without
          regard to case; and for what Healdan's rules refuse.

        Recorded as `folder.created`, with its name and the folder it's in.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkspaceFolder'
      responses:
        '201':
          description: The new folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceNode'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/folders/{id}/move:
    post:
      operationId: adminMoveFolder
      summary: Move a folder within its workspace
      description: |
        Moves a folder or search folder of a workspace, below its top
        folder, with everything in it, into another folder of the same
        workspace, its top folder included, through LogicalDOC's folder
        move (Admin app spec section 8.4). A folder that would then grant
        more than its new parent is narrowed to fit, as on every route
        (P1). A move into the folder it's in changes nothing. Answers `204`.

        - `404 not-found` for a folder outside a workspace.
        - `422 validation` for a missing `folderId` (`required`).
        - `409 refused` for the workspace's top folder; for a `folderId`
          that isn't a live folder of a workspace, as the body names it (the
          check order's step 4); into another workspace (a matter's folder
          moves to another matter in the User app, and a template's stays in
          its template); into a search folder, the folder
          itself or a folder inside it; while a document in it is checked
          out, by anyone; for a name another folder or search folder there
          has, compared without regard to case; and for what Healdan's rules
          refuse.

        Recorded as `folder.moved`, with the folder it was in before and
        after.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderMove'
      responses:
        '204':
          description: Moved
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/folders/{id}/access:
    get:
      operationId: adminGetFolderAccess
      summary: Who can use a folder
      description: |
        The Workspace Editor's **Who Can Use This Folder** (Admin app spec
        section 8.4), for a folder or search folder of a workspace, its top
        folder included: what it grants each group and person, its own
        permissions or, when it follows, those of the folder it follows
        (`followsFolderId`), each row with its access level. Whether
        **Apply to Subfolders** is offered is `canApplyToSubfolders`.

        A group or person the folder grants nothing isn't listed, though
        LogicalDOC can keep a row for one, so every row can be sent back to
        `PUT` as it is.

        A folder outside a workspace is `404 not-found`.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      responses:
        '200':
          description: The folder's access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderAccess'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetFolderAccess
      summary: Set who can use a folder
      description: |
        Sets a workspace's folder's permissions, through
        `FolderAccessService`, and answers its access after (Admin app spec
        section 8.4). Either `rows`, the folder's own permissions from then
        on (**Set Own Permissions**, and **Save**): each group or person
        gets exactly the permissions its row gives, every row the folder had
        goes, and one left out gets none here; an empty list leaves the
        folder to administrators. Or `followParent: true`, which gives them
        up for its parent's (**Follow Parent**), and the folders that
        followed it then follow what it follows, as LogicalDOC's
        `updateSecurityRef` does. Inside a matter, the folders below it that
        would grant more than it then narrow with it, as on every route.

        - `400 bad-request`, besides the body's own rules, for a permission
          that isn't one of `Permission`'s names, or is named twice in a row.
        - `404 not-found` for a folder outside a workspace.
        - `422 validation`: `rows` (`required`) when neither `rows` nor
          `followParent: true` is sent, and (`invalid`) when both are; a row
          (`rows[2]`) with neither `groupId` nor `userId` (`required`), with
          both (`invalid`), or naming a group or person an earlier row named
          (`duplicate`), a person named by `userId` and by their own group's
          `groupId` being the same; and a row's missing or empty
          `permissions` (`rows[2].permissions`, `required`).
        - `409 refused`, with the rule's sentence, for a group or person that
          no longer exists (but for a deleted group the folder already grants
          something, which may stay, so a save needn't take away what's
          there); for `guest`, or a read-only person's own group, given
          anything beyond Read Only's five permissions, but for the owner's
          row on a matter's own folder, which is sent with Full Access
          whoever owns the matter (a read-only owner's row then holds what a
          read-only person's row can); on a matter's own folder, for leaving
          out its owner's row or giving it less than Full Access, or making
          that folder follow its Store; and, inside a matter, for a folder
          that would grant more than its parent (P1) or, on its own folder, a
          group that could read the matter but can't read its Store (P2). In
          a template P1 and P2 aren't checked as it's edited: the save works,
          and `GET /v1/admin/templates/{id}/problems` lists what New Matter
          would refuse. Below a matter's own folder the owner's row may go,
          as a restricted folder may keep anyone out.

        Recorded as `folder.access-changed`, with the folder it followed
        before and follows after (`follows`, by its path from its workspace's
        top folder; null with its own), and each row that changed, named as
        `group Partners` or `user jdoe`, with its permissions before and
        after as stored (null for no row). A save or Follow Parent that would
        change nothing is neither written nor recorded.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderAccessChange'
      responses:
        '200':
          description: The folder's access, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderAccess'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/folders/{id}/apply-access:
    post:
      operationId: adminApplyFolderAccess
      summary: Give the folders below a folder its permissions
      description: |
        **Apply to Subfolders** (Admin app spec section 8.4), through
        LogicalDOC's `applySecurityToTree`, as the Classic Interface's Apply
        to Subfolders does: every folder and search folder below this one, at
        every level, those in the Trash too, loses its own rows and follows
        what this folder follows (this folder, when it has its own; when it
        follows, the folder it follows). Nothing below is skipped and nothing
        is moved or deleted: a restricted folder below stays where it is,
        opened up, granting exactly what this folder grants, so anyone it
        kept out can use it; one in the Trash comes back so if it's restored.
        The folder itself doesn't change. Answers `204`.

        - `404 not-found` for a folder outside a workspace.
        - `409 refused` where `canApplyToSubfolders` is false: a folder with
          no live folder below it, and where Healdan's rules don't allow it
          (`checkApplyToTree`, which needs the security permission on every
          folder below with its own rows, and always allows an
          administrator).

        Recorded as `folder.access-applied`, after it's done, with how many
        folders below, the Trash's included, had their own permissions
        (`foldersWithOwnPermissions`) and followed what this folder follows
        (`foldersFollowing`), before and after. Applied again, it changes
        nothing and isn't recorded.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      responses:
        '204':
          description: Applied
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/folders/{id}/properties:
    get:
      operationId: adminGetFolderProperties
      summary: The values a folder sets
      description: |
        The property values a workspace's folder sets for what's filed below
        it (Admin app spec section 8.4), its top folder included: each
        property of the Healdan profile that passes down from folders, in
        the profile's order. That's Class and Subclass, and any property an
        administrator has added to the profile, but not Client and Matter,
        which come from the matter, nor those a document alone has (Author,
        Typist, Comments, Legacy doc # and the email fields). Each value is
        `local`, set on this folder, which passes it down; `inherited`, from
        the folder `inheritedFrom` names; or `default`, the install's
        default Class.

        - `404 not-found` for a folder outside a workspace.
        - `409 refused` for a search folder, which holds nothing and sets no
          values.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      responses:
        '200':
          description: The folder's values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderProperties'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetFolderProperties
      summary: Set the values a folder sets
      description: |
        Sets the folder's values, stored with LogicalDOC's folder change
        event, so Healdan's profile rules mark them and pass them down, and
        answers its values after (Admin app spec section 8.4). `values`
        holds the whole set: a value that differs from what the folder would
        inherit becomes the folder's own, and passes down to the folders and
        documents below that don't set their own; one equal to it, `null`,
        empty text, or a property left out goes back to inheriting. In a
        matter the folders and documents below take the change at once; in
        a template, the matters made from it afterwards do.

        - `404 not-found` for a folder outside a workspace.
        - `422 validation` for a missing or null `values` (`required`); and
          every value that's wrong before anything is saved, by the
          property's name, with the codes
          `setProperties` in `openapi.yaml` uses: `unknown` for a
          property the list doesn't have, or a user, folder or document that
          doesn't exist; `read-only` for Client and Matter; `type` for a
          value of the wrong JSON type or format; `too-long` for text over
          4,000 characters once cleaned of markup; `not-an-option` for a
          value that isn't one of its `options`; and `class-mismatch` for a
          Subclass that doesn't belong to the folder's Class.
        - `409 refused` for a search folder, and for what Healdan's rules
          refuse.

        Recorded as `folder.properties-changed`, with each value the folder
        sets of its own that changed, by the property's name, before and
        after (null for one it inherits). A change that leaves the folder's
        own values as they were isn't recorded.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderPropertiesChange'
      responses:
        '200':
          description: The folder's values, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderProperties'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/folders/{id}/search-folders:
    post:
      operationId: adminCreateSearchFolder
      summary: Create a search folder in a workspace
      description: |
        Creates a search folder in the folder `id` names, in a workspace, at
        any level, its top folder included, through
        `SearchFolderService.create` (Admin app spec section 8.4), and
        answers `201` with it, its address as `Location`. Its name is
        checked as a folder's is, by the same rules as
        `POST /v1/admin/folders/{id}/children`, before the service runs, so
        it's stored as sent, with the whitespace at either end taken off. It
        follows its parent's permissions, and its rule runs each time
        someone opens it in the User app: in a matter, the documents of that
        matter changed in the rule's window that the person can read, newest
        first; in a template, it's copied with its rule into each matter made
        from it.

        - `404 not-found` for a folder outside a workspace, the Templates
          Store among them.
        - `422 validation` for the name, as `FolderName` says, and for
          `rule`, or a member of it, missing (`required`).
        - `409 refused` for a search folder, which holds no folders; for a
          name another folder or search folder there has, compared without
          regard to case; for `rule.days` below 1; for a `docSubclass`
          without a `docClass`; and for what Healdan's rules refuse.

        Recorded as `search-folder.created`, with its name, the folder it's
        in and its rule.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/FolderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSearchFolder'
      responses:
        '201':
          description: The new search folder
          headers:
            Location:
              description: The search folder's address, such as `/api/v1/admin/search-folders/56`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFolder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-folders/{id}:
    get:
      operationId: adminGetSearchFolder
      summary: A search folder and its rule
      description: |
        A search folder of a workspace, with its rule, for the Workspace
        Editor to edit (Admin app spec section 8.4). Any other folder, a
        plain folder of a workspace among them, is `404 not-found`.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/SearchFolderPath'
      responses:
        '200':
          description: The search folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFolder'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminEditSearchFolder
      summary: Change a search folder's rule
      description: |
        Changes a search folder's rule, through `SearchFolderService.update`
        with the name it has, and answers it (Admin app spec section 8.4).
        The `rule` sent replaces the whole rule, as `GET` gives it. A search
        folder is renamed only as a folder is, through
        `PATCH /v1/admin/folders/{id}`, so a body with `name` is
        `400 bad-request`, as any member the route doesn't take is. A
        template's search folder changes only the matters made from it
        afterwards.

        - `404 not-found` for anything but a search folder of a workspace.
        - `422 validation` for a `rule` that's missing or null, or a member
          of it missing (`required`).
        - `409 refused` for `rule.days` below 1; for a `docSubclass` without
          a `docClass`; and for what Healdan's rules refuse.

        Recorded as `search-folder.rule-changed`, with the rule's values
        that changed, before and after. A change that changes nothing isn't
        recorded.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/SearchFolderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFolderChange'
      responses:
        '200':
          description: The search folder, changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFolder'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/templates:
    get:
      operationId: adminListTemplates
      summary: The workspace templates
      description: |
        Every workspace template (Admin app spec section 8.5): the live
        folders directly in the Templates Store that a matter can be made
        from (`MatterService.templates`: not search folders or aliases), by
        name, ignoring case, each with how many folders it holds and how
        many live matters were made from it. A short list, so not a page.
        Empty on a fresh install, where a template is needed before the
        first matter.
      tags: [Matters]
      responses:
        '200':
          description: The templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminCreateTemplate
      summary: Create a workspace template
      description: |
        Creates a template, a folder directly in the Templates Store (Admin
        app spec section 8.5), and answers `201` with it, its address as
        `Location`: empty, or, with `copyOf`, a copy of that template, with
        its folders, their permissions and values, and its search folders
        with their rules. The name has the whitespace at either end taken
        off.

        - `422 validation` for the name, as `FolderName` says.
        - `409 refused` for a name another template has, compared without
          regard to case; for a `copyOf` that isn't a template; and for what
          Healdan's rules refuse.

        Recorded as `template.created`, with its name and the template it
        copies, if any.
      tags: [Matters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTemplate'
      responses:
        '201':
          description: The new template
          headers:
            Location:
              description: The template's address, such as `/api/v1/admin/templates/78`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInfo'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/templates/{id}:
    get:
      operationId: adminGetTemplate
      summary: A workspace template
      description: |
        The template, as the list gives it, for its page (Admin app spec
        section 8.5), whose folders are
        `GET /v1/admin/workspaces/{folderId}/tree` with its `id`. Anything
        but a template is `404 not-found`.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/TemplatePath'
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminRenameTemplate
      summary: Rename a workspace template
      description: |
        Renames the template's folder, and answers the template. Matters
        already made from it are unchanged, as by any change to a template
        (Admin app spec section 8.5). The name has the whitespace at either
        end taken off; its own name changes nothing.

        - `404 not-found` for anything but a template.
        - `422 validation` for the name, as `FolderName` says.
        - `409 refused` for a name another template has, compared without
          regard to case (changing only the case of its own works), and for
          what Healdan's rules refuse.

        Recorded as `template.renamed`, with the name before and after.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/TemplatePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderRename'
      responses:
        '200':
          description: The template, renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInfo'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminDeleteTemplate
      summary: Move a workspace template to the Trash
      description: |
        Moves the template's folder, with its folders and search folders, to
        the caller's Trash, through LogicalDOC's folder delete, and answers
        the Trash item the delete made, as a folder's delete does (Admin app
        spec section 8.5). The User app's Trash lists the item, but doesn't
        restore it, as it restores into a Store only (`409 place-gone`).
        Matters already made from it are unchanged; their `template` is null
        from then on. New Matter no longer offers it.

        - `404 not-found` for anything but a template.
        - `409 refused` for what Healdan's rules refuse.

        Recorded as `template.deleted`, after the delete.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/TemplatePath'
      responses:
        '200':
          description: In the Trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedFolder'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/templates/{id}/problems:
    get:
      operationId: adminTemplateProblems
      summary: What New Matter would refuse in a template
      description: |
        Nothing checks a template's permissions as they're edited, so the
        template's page lists, as warnings, what New Matter would refuse in
        a matter made from it, with the same rules (`AclMath` and
        `PermissionRules`); saving the template still works (Admin app spec
        section 8.4). Empty for a clean template.

        - `wider-than-parent`, once for each folder or search folder that
          grants a group something the folder it's in doesn't (P1), in the
          tree's order: one with permissions of its own, or one that still
          follows a folder above the folder it's in, as a folder made while
          the folder it's in followed that folder does once the folder it's
          in has permissions of its own (LogicalDOC's way).
        - `store-unreadable`, for each Store, once for each group that could
          read a matter made from the template but can't read that Store
          (P2), by Store name and then group name. The matter's owner, not
          known yet, is left aside: New Matter's check names the owner when
          one is chosen.

        Anything but a template is `404 not-found`.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/TemplatePath'
      responses:
        '200':
          description: The problems found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateProblem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores:
    get:
      operationId: adminListStores
      summary: The Stores
      description: |
        Every live Store, by name, ignoring case (`MatterService.stores`):
        not LogicalDOC's Default workspace, the Templates Store or a Store in
        the Trash. A short list, so not a page: for the Store menus of New
        Matter, Move to Another Store and the Matters list, and for the Stores
        list (Admin app spec section 8.6), each with what that list shows.

        - `matters` counts its live matters, not deleted or in the Trash, as
          they are at the request.
        - `documents` and `bytes` are its matters', from the summary the
          server keeps in memory for the Dashboard's Usage, worked out at
          most every 15 minutes and never by a request: `figuresAt` says
          when. Until the first summary since the server started, they and
          `figuresAt` are null; a Store made or restored since the last
          summary has `documents` and `bytes` 0 until the next.
        - `readers` are the groups and people that can see it, as
          `GET /v1/admin/stores/{id}/access` lists them.
        - `backend` and `pending` are its storage backend and its files that
          haven't reached it, as `GET /v1/admin/stores/{id}/backend` gives
          them: null when storage backends are off, or on a server without
          Healdan's storage module, which this route answers all the same.
      tags: [Stores]
      responses:
        '200':
          description: The Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminCreateStore
      summary: Create a Store
      description: |
        Creates a Store, a workspace under the root, and gives each group in
        `groupIds` Read, the Store's one level, **Can See**, all in one
        transaction (`StoreService.create`), so a matter can be made in it
        at once (Admin app spec section 8.6). Answers `201` with it. The
        name has the whitespace at either end taken off. A group in
        `groupIds` may be a person's own. It answers the Store's id and name
        and the backend it keeps its files on: `GET /v1/admin/stores/{id}`
        gives the rest.

        The new Store keeps its files on the backend `backendId` names,
        Original, the server's own folder, when it's null or left out. The
        backend is checked first; the Store is made, in one transaction, then
        given its backend, as `PUT /v1/admin/stores/{id}/backend` does. Should
        that backend stop being offered to Stores in between, as when another
        administrator removes it, or should giving it fail, the Store stays
        on Original and the answer is still `201`, with Original as its
        `backendId`, so a client can say so; the server logs it.

        - `400 bad-request` for a `groupIds` that names a group twice or
          holds a null.
        - `422 validation` for the name, as `FolderName` says, and for a
          missing `groupIds` (`required`).
        - `409 refused` for a name another live folder directly under the
          root has, compared without regard to case: another Store,
          LogicalDOC's Default workspace or the Templates Store; for a group
          that no longer exists; for a `backendId` that names no backend, or
          one not offered to Stores (an encrypted backend whose recovery key
          isn't confirmed); for any backend but Original while storage
          backends are off, or on a server without Healdan's storage module;
          and for what Healdan's rules refuse. Of two creates, renames or
          restores giving one name at the same moment, the second is refused
          as a name taken, with the same sentence.

        Recorded as `store.created`, with its name and one change for each
        group that can see it, named as `group Partners` or `user jdoe`,
        with `read`; and, for a backend other than Original, as
        `store.backend-changed` too, in the Storage area.
      tags: [Stores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStore'
      responses:
        '201':
          description: The new Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/deleted:
    get:
      operationId: adminListDeletedStores
      summary: The Stores in the Trash
      description: |
        The Stores in the Trash, which the Stores list shows apart, each with
        **Restore** (`POST /v1/admin/stores/{id}/restore`; Admin app spec
        section 8.6): every Store whose delete is in a Trash, whoever deleted
        it, `deleted`, or removed from it and not destroyed yet, `removed`.
        Most recently deleted first. A short list, so not a page.

        The User app's Trash doesn't restore a Store's item
        (`409 refused`): this route's restore does.
      tags: [Stores]
      responses:
        '200':
          description: The Stores in the Trash
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeletedStore'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}:
    get:
      operationId: adminGetStore
      summary: A Store
      description: |
        The Store, as the list gives it, for its page (Admin app spec section
        8.6), which lists its matters with `GET /v1/admin/matters?storeId=`,
        who can see it with `GET /v1/admin/stores/{id}/access`, and its
        storage backend with `GET /v1/admin/stores/{id}/backend`.

        Anything but a live Store is `404 not-found`: LogicalDOC's Default
        workspace, the Templates Store, the root, a Store in the Trash and
        any other folder.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminRenameStore
      summary: Rename a Store
      description: |
        Renames the Store's folder, through `StoreService.rename`, and
        answers the Store (Admin app spec section 8.6). Its matters keep
        their folders and their names. The name has the whitespace at either
        end taken off; its own name changes nothing, after the checks up to
        `422` and the refusal of the three folders below, which comes first:
        they're refused whatever the name, their own included.

        - `404 not-found` for anything but a live Store, but for the three
          folders `409 refused` names.
        - `422 validation` for the name, as `FolderName` says.
        - `409 refused` for LogicalDOC's Default workspace, the Templates
          Store and the root, which aren't renamed here, each with a sentence
          that says so, even when the name sent is the one it has; for a name
          another live folder directly under the root has, compared without
          regard to case, with the sentences of `POST /v1/admin/stores`
          (changing only the case of its own name works); and for what
          Healdan's rules refuse. Of two creates, renames or restores giving
          one name at the same moment, the second is refused as a name taken.

        Recorded as `store.renamed`, with the name before and after.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderRename'
      responses:
        '200':
          description: The Store, renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminDeleteStore
      summary: Move a Store to the Trash
      description: |
        Moves the Store's folder, every matter in it and everything live in
        them, to the caller's Trash as one item, through LogicalDOC's folder
        delete, as a matter's delete does, and answers the Trash item it made
        (Admin app spec section 8.6). The matters' rows stay, so their
        numbers stay taken. The Store and its matters are then `404` here
        and gone from the lists, and `GET /v1/admin/stores/deleted` lists the
        Store, which `POST /v1/admin/stores/{id}/restore` brings back with
        its matters.

        - `404 not-found` for anything but a live Store, but for the three
          folders `409 refused` names.
        - `409 refused` for LogicalDOC's Default workspace, the Templates
          Store and the root, which aren't deleted here, each with a sentence
          that says so; while a document in it is checked out, by anyone, the
          caller too; while it holds an immutable document; and for what
          Healdan's rules refuse.

        Recorded as `store.deleted`, after the delete.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The Trash item the delete made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedFolder'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/restore:
    post:
      operationId: adminRestoreStore
      summary: Restore a Store from the Trash
      description: |
        Restores the Store from the Trash, back directly under the root, with
        the matters and everything else its delete took, through the Trash's
        restore, whether its item is `deleted` or `removed`, and answers the
        Store (Admin app spec section 8.6). `id` is the Store's folder, as
        `GET /v1/admin/stores/deleted` gives it. What was deleted on its own
        before the Store was is a Trash item of its own, and stays there.
        Takes no body.

        - `404 not-found` when `id` names no Store, live or in the Trash.
        - `409 refused` for a live Store, with a sentence that says it isn't
          in the Trash, as after another restore; when another live folder
          directly under the root now has its name, compared without regard
          to case, with the sentences of `POST /v1/admin/stores`, so that
          folder is renamed first; when the nightly destroy, or another
          restore, takes it out of the Trash as this one runs; and for what
          Healdan's rules refuse, such as a group that could read one of its
          matters but can't read the Store (P2).
          Of two creates, renames or restores giving one name at the same
          moment, the second is refused as a name taken.

        Recorded as `store.restored`, after the restore.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The Store, back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/access:
    get:
      operationId: adminGetStoreAccess
      summary: Who can see a Store
      description: |
        Each group and person with permissions on the Store (Admin app spec
        section 8.6). A Store has one level, **Can See** (Read, the only
        permission that matters on a Store), so a row's `level` is `can-see`
        when it grants Read alone, and `custom` when it grants anything
        else, with or without Read. A group or person the Store grants
        nothing isn't listed, though LogicalDOC can keep a row for one.

        LogicalDOC's Default workspace, the Templates Store, the root and any
        other folder that isn't a live Store are `404 not-found`.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: Who can see it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAccess'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetStoreAccess
      summary: Set who can see a Store
      description: |
        Sets who can see the Store, in one transaction
        (`StoreService.setAccess`), and answers who can see it after (Admin
        app spec section 8.6): each group in `groupIds`, a person's own group
        among them, gets Read, keeping any other permission its row has, and
        every other group's row goes. An empty list leaves the Store to
        administrators alone. A Store that followed another folder's
        permissions gets its own.

        New Matter's **Let {group} Read the Store** sends the groups whose
        rows have `read`, with the problem's group added. A `custom` row that
        lacks Read isn't among them, so its group's row goes: harmless on a
        Store, where only Read matters. Healdan's permission rules then
        narrow, as on every route, what in the Store's matters follows the
        Store's permissions.

        - `400 bad-request` for a `groupIds` that names a group twice or
          holds a null.
        - `404 not-found` as `adminGetStoreAccess` answers.
        - `422 validation` for a missing `groupIds` (`required`).
        - `409 refused` for a group that no longer exists (a deleted group
          the Store already grants something may stay, so a change needn't
          take away what's there); for a change that would leave a matter in
          the Store letting in a group the Store wouldn't (P2: whoever can
          read a matter can read its Store), checked before anything is written,
          the matter's owner's own group passing while the owner could read
          the Store, with a sentence that names the first such group and its
          matter, or how many of the Store's matters it can read and the
          first by name; and for what Healdan's rules refuse. A matter that
          already let in a group the Store didn't refuses no other change,
          so the change that puts it right goes through, and a matter in the
          Trash is checked when it's restored.

        Recorded as `store.access-changed`, with `follows` (the folder it
        followed, null after) when it followed another folder's permissions,
        and one change for each row that changed, named as `group Partners`
        or `user jdoe`, valued with its permissions in `Permission`'s order
        (`read, download`), null for no row. A change that changes nothing
        is neither written nor recorded.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAccessChange'
      responses:
        '200':
          description: Who can see it, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAccess'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/backend:
    get:
      operationId: adminGetStoreBackend
      summary: A Store's storage backend
      description: |
        The storage backend the Store keeps its files on, Original when it
        has no other, and its files: how many it has and their size, those
        that haven't reached that backend yet, and those the mover gave up on
        (Admin app spec section 8.6).

        With `backendId`, `switchPreview` also says how many of its files,
        and their bytes, would move were it given that backend, the files not
        on it now, as the Storage tab says before a switch. It changes
        nothing.

        While storage backends are off, `on` is false, `backend` null and the
        counts 0.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store, as
          `GET /v1/admin/stores/{id}` answers it, and for a `backendId` that
          names no backend, any while storage backends are off.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - name: backendId
          in: query
          required: false
          description: A backend to count the move to; without it, nothing is counted
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Its backend and its files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStorage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetStoreBackend
      summary: Give a Store another storage backend
      description: |
        Gives the Store the backend `backendId` names, from then on, as the
        Storage tab's change of a Store's backend does, and answers its
        backend and its files after (Admin app spec section 8.6). Its files
        move there in the background, `pending` falling as they do, and until
        each has moved it's read from where it is. Original brings them back
        to the server's own folder. The Store's own backend changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store.
        - `422 validation` for a missing `backendId` (`required`).
        - `409 refused`, with the Storage tab's sentence: while storage
          backends are off; for a `backendId` that names no backend; for one
          not offered to Stores, an encrypted backend whose recovery key
          isn't confirmed; for one still being added; and for what Healdan's
          rules refuse.

        Recorded as `store.backend-changed`, with the backend before and
        after, by name.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBackendChange'
      responses:
        '200':
          description: Its backend and its files, after
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStorage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/stuck-files:
    get:
      operationId: adminListStoreStuckFiles
      summary: A Store's stuck files
      description: |
        The Store's files the mover gave up on, after ten failed tries in a
        row, which stay where they are, where they still open, until they're
        retried (Admin app spec section 8.6). The newest documents first, at
        most 1,000: `pending.stuck` of `GET /v1/admin/stores/{id}/backend`
        counts them all. A short list, so not a page.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: Its stuck files
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/StuckFile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/stuck-files/retry:
    post:
      operationId: adminRetryStoreStuckFiles
      summary: Retry a Store's stuck files
      description: |
        **Retry** (Admin app spec section 8.6): every stuck file of the Store
        goes back to waiting, its tries counted from nought again, and the
        mover is woken, which moves them with the others. The cause, such as
        the S3 user's permissions or a full disk, is put right first. Takes
        no body; answers `204`. With none stuck, it changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store.
        - `409 refused` while storage backends are off.

        Recorded as `storage.stuck-retried`, naming the Store; with none
        stuck, it changes nothing and isn't recorded.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '204':
          description: Waiting again
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends:
    get:
      operationId: adminListBackends
      summary: The storage backends
      description: |
        Whether this server keeps its files through storage backends (`on`),
        every backend as its page shows it, and the files with no Store that
        haven't reached a backend or that the mover gave up on, such as a
        document's saved before it had a folder, the Storage tab's Other
        Files (Admin app spec section 8.6). Original first, then the others
        in the order they were added. A short list, so not a page.

        While storage backends are off, `on` is false, with no backends and
        `otherFiles` all 0.

        `503 storage-unavailable` on a server without Healdan's storage
        module.
      tags: [Storage]
      responses:
        '200':
          description: The backends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendOverview'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminAddBackend
      summary: Add a storage backend
      description: |
        Adds a backend, a local folder or an S3 bucket, as the Storage tab's
        Add does, and answers `201` with it as its page shows it, its address
        as `Location` (Admin app spec section 8.6). In order: Test on the
        settings as sent, which must pass; the settings saved; its marker
        written in its place, which refuses a place whose marker names
        another backend or another install; for an encrypted backend, its key
        file and check object; and Test once more, in full, its key included.
        A step that fails undoes the ones before it, so its name and place
        are free to try again. It holds nothing until a Store is given it.

        An encrypted backend's answer carries its recovery key in
        `recoveryKey`, often the only time it's shown, so the app shows it at
        once, to be saved away from the server; that showing is recorded.
        Only `POST /v1/admin/backends/{id}/recovery-key/show` answers it
        again. No Store can be given the backend until the key's last group
        is typed back (`POST /v1/admin/backends/{id}/recovery-key/confirm`).
        Whether a backend is encrypted is chosen here, and never changes.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `422 validation` for what the kind needs, missing or blank
          (`required`): `kind` and `name`; a folder's `path`; an S3 bucket's
          `endpoint`, `region`, `bucket`, `accessKey` and `secret`. For a
          `kind` other than `local` and `s3` (`invalid`). And for a member of
          the other kind, sent with a value (`invalid`): S3's for a folder,
          or `path` for S3; null counts as left out.
        - `409 secret-key-missing`, with `sealed`, for an S3 bucket while
          Healdan's secret key file is missing and values are sealed with it,
          unless `newKey` is true; nothing is written.
        - `409 refused`, with the Storage tab's sentence: while storage
          backends are off; for a name another backend has, in any case, or
          over 100 characters; for a setting too long, or that isn't what it
          must be (a path that isn't a folder's whole path from `/`; an
          endpoint that isn't an address, or `http://` but for an S3 server
          whose every address is on a private network, with path style); for
          a place another backend has (the same bucket, at the same S3
          service, with the same prefix or one that holds or sits inside it;
          a folder that is, holds or sits inside another backend's, Original's,
          staging's, the read cache's, the configuration folder or the storage
          key files' folder, links followed); for Test failing, with what it
          found; and for a later step failing, such as another backend's or
          another install's marker in its place.

        Recorded as `backend.added`, with its settings: its name, kind,
        place and `encrypted`, its access key and its secret as changed with
        no value; and, for an encrypted backend, as
        `backend.recovery-key-shown` too, as its answer shows the key.
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBackend'
      responses:
        '201':
          description: The new backend
          headers:
            Location:
              description: The backend's address, such as `/api/v1/admin/backends/3`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedBackend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/test:
    post:
      operationId: adminTestNewBackend
      summary: Test a backend's settings before saving
      description: |
        **Test**, in the windows that add and edit a backend (Admin app spec
        section 8.6): tries the settings as typed, saving nothing, and answers
        the problems it found, none when it passed. A test that fails isn't a
        refusal: it's `200`, each problem a sentence in `problems`, a setting
        Healdan refuses among them, as the add or the save would say it.

        - For S3, it writes a test object in the bucket, reads it back whole
          and in part, lists it and deletes it. For a folder, it checks that
          the folder exists, that Healdan can write in it, and that it holds
          no other backend's marker.
        - With `id`, the backend being edited: a missing or blank `secret`
          uses the stored one, and a place that's still its own is tested
          with its marker. Original's `id` tests Original in full, as
          `POST /v1/admin/backends/{id}/test` does, whatever else is sent.
        - The settings of the other kind, S3's for a folder or `path` for S3,
          are left aside.

        A draft never answers `422`: what's missing or wrong, an unknown
        `kind` included, is among the problems. It records nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `409 refused` while storage backends are off, and for an `id` that
          names no backend.
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackendTrial'
      responses:
        '200':
          description: What the test found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendTestResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}:
    get:
      operationId: adminGetBackend
      summary: A storage backend
      description: |
        The backend, as the list gives it, for its page and its Edit window
        (Admin app spec section 8.6). Its S3 secret is never answered, only
        whether one is stored (`hasSecret`), nor its recovery key.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: The backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminEditBackend
      summary: Change a storage backend
      description: |
        Saves the backend's settings, as the Storage tab's Edit does, and
        answers it as saved (Admin app spec section 8.6). A member left out
        stays as it is, and `secret` only replaces the stored one: null,
        blank or left out keeps it. The app tests the settings first
        (`POST /v1/admin/backends/test` with `id`), as the tab does, and saves
        all the same if the administrator chooses, so a backend can be
        renamed during an outage: one whose settings don't work fails until
        they do.

        - The name changes, and for S3 the endpoint, region, access key,
          secret and path style. The bucket, prefix or path change only while
          no file is recorded or copy held on the backend (`inUse` false) and
          no Store keeps its files there, and the new place is given its
          marker, and an encrypted backend's check object, before the backend
          points there. Original's folder comes from the server's
          configuration, so only its name changes.
        - Its kind never changes, nor whether it's encrypted, which its add
          chose, as its recovery key was shown then.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `422 validation` for `kind` and `encrypted` (`not-editable`); for
          Original, every member but `name` (`not-editable`); for a member of
          the other kind, S3's on a folder or `path` on S3 (`not-editable`),
          each only when sent with a value, as the add refuses them: null
          counts as left out. And for the name, or a setting the backend's
          kind needs, sent as null or blank (`required`).
        - `409 secret-key-missing`, with `sealed`, for a new `secret` while
          Healdan's secret key file is missing and values are sealed with it,
          unless `newKey` is true; nothing is saved.
        - `409 refused`, before the Storage tab's refusals, for a new bucket,
          prefix or path while a Store in the Trash keeps its files there,
          naming each such Store, as `storesInTrash` lists them: its files
          stay there while it's in the Trash, so it's restored, given another
          backend and deleted again.
        - `409 refused`, with the Storage tab's sentence: for a name another
          backend has, in any case, or a setting refused as the add refuses
          it; for a new bucket, prefix or path once a file is recorded or a
          copy held on the backend, or while a Store keeps its files there;
          for a new place that another backend has, or whose marker can't be
          written; for a new place while the stored secret can't be read, as
          after a new secret key, so the secret is typed again; for another
          save that changed the backend meanwhile, so it's opened again; for
          a backend still being added; and for what Healdan's rules refuse.

        Recorded as `backend.changed`, with each changed setting before and
        after, a new access key and a new secret as changed with no value. A
        save that changes nothing isn't recorded.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackendChange'
      responses:
        '200':
          description: The backend, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminRemoveBackend
      summary: Remove a storage backend
      description: |
        Removes an empty backend, as the Storage tab's Remove does (Admin app
        spec section 8.6): one no Store keeps its files on, live or in the
        Trash, with no file recorded on it and no copy held there. Its
        settings leave the database, its sealed S3 secret among them; an
        encrypted backend's key file is deleted; and its marker and check
        object are deleted from its place, so another backend can have it.
        It can't be undone. Answers `204`.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `409 refused`, before the Storage tab's refusals but Original's,
          while a Store in the Trash keeps its files on it, naming each such
          Store, as `storesInTrash` lists them: its files stay there while
          it's in the Trash, so it's restored, given another backend and
          deleted again.
        - `409 refused`, with the Storage tab's sentence: for Original, which
          keeps the files of every Store with no other backend; while a Store
          keeps its files on it, until it's given another; while files are
          recorded on it, until they've moved off; while copies are held on
          it, until the holding period ends and the purge deletes them; and
          for a backend still being added.

        Recorded as `backend.removed`.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/test:
    post:
      operationId: adminTestBackend
      summary: Test a saved backend
      description: |
        **Test** on a backend's page (Admin app spec section 8.6): tests the
        saved backend in full, with its settings and key file as they are
        now, and answers the problems, none when it passed: its marker, a
        test object as `POST /v1/admin/backends/test` writes, and for an
        encrypted backend its key, which must decrypt its check object. Its
        `status` then says what Test found. A test that fails isn't a
        refusal. Takes no body, and records nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `409 refused` for a backend still being added.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: What the test found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendTestResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/recovery-key/show:
    post:
      operationId: adminShowRecoveryKey
      summary: Show an encrypted backend's recovery key
      description: |
        **Show Recovery Key** (Admin app spec section 8.6): answers an
        encrypted backend's recovery key, from its key file as it is now, the
        only answer but the backend's add that holds it. Each showing is
        recorded, with who and when, before the key is answered, and the
        server's log says it was shown, never the key; the backend's
        `keyLastShown` and `keyLastShownBy`, and its key history, then name
        it. Takes no body.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `409 refused`, with the Storage tab's sentence: for a backend that
          isn't encrypted, which has no recovery key; for one whose key file
          is missing or can't be read, whose recovery key is entered to put
          it back; and for one still being added.

        Recorded as `backend.recovery-key-shown`.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: The recovery key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryKey'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/recovery-key/confirm:
    post:
      operationId: adminConfirmRecoveryKey
      summary: Confirm an encrypted backend's recovery key
      description: |
        Confirms that the backend's recovery key was saved, by the last group
        of four characters typed back, and answers the backend, which Stores
        can then be given (Admin app spec section 8.6). The group is read in
        any case, spaces and hyphens ignored. Confirming a key already
        confirmed changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `422 validation` for a missing or blank `lastGroup` (`required`).
        - `409 refused`, with the Storage tab's sentence: for a backend that
          isn't encrypted; for one whose key file is missing, whose recovery
          key is entered to put it back; for a group that isn't its recovery
          key's last; and for a backend still being added.

        Recorded as `backend.recovery-key-confirmed`, but for a key already
        confirmed.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKeyConfirmation'
      responses:
        '200':
          description: The backend, its recovery key confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/recovery-key/enter:
    post:
      operationId: adminEnterRecoveryKey
      summary: Put an encrypted backend's key file back
      description: |
        **Enter Recovery Key** (Admin app spec section 8.6): writes an
        encrypted backend's key file again from its recovery key, as typed or
        pasted, and answers the backend, which is then checked again. The key
        is read in any case, spaces and hyphens ignored, and must decrypt the
        backend's check object, which is read before anything is written, so
        a mistyped key, or another backend's, can't replace the file.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `422 validation` for a missing or blank `recoveryKey`
          (`required`).
        - `409 refused`, with the Storage tab's sentence: for a backend that
          isn't encrypted; for what isn't a recovery key, by its length, its
          last character or a character a recovery key can't hold; for a key
          that isn't the backend's, so nothing was written; for a backend that
          can't be used, or whose check object is missing or can't be read, so
          the key can't be checked; for a key file that couldn't be written;
          and for a backend still being added.

        Recorded as `backend.recovery-key-entered`.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKeyEntry'
      responses:
        '200':
          description: The backend, its key file back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/key-events:
    get:
      operationId: adminListKeyEvents
      summary: A backend's key history
      description: |
        **Key History** (Admin app spec section 8.6): every showing and every
        entering of the backend's recovery key, newest first, with who and
        when, the showing at its add included. Empty for a backend that isn't
        encrypted. A short list, so not a page.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: Its key history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyEvent'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/storage/settings:
    get:
      operationId: adminGetStorageSettings
      summary: The storage settings
      description: |
        The storage settings, with each one's limits, for their form (Admin
        app spec section 8.6): the holding period, how many days a file's old
        copy is held after a move or a delete before the purge deletes it;
        the read cache's size, for copies of S3 backends' files on the
        server; and parallel transfers, how many files move between backends
        at once. While storage backends are off, `on` is false, and the
        values are as saved.

        `503 storage-unavailable` on a server without Healdan's storage
        module.
      tags: [Storage]
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetStorageSettings
      summary: Save the storage settings
      description: |
        Saves all three settings in one transaction, each checked before any
        is written, and answers them as saved (Admin app spec section 8.6). A
        new number of parallel transfers applies at once, and a holding
        period to the copies held from then on.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `422 validation` for a setting that's missing (`required`), or
          outside its limits, from 1 to the maximum `GET` gives
          (`out-of-range`), each by its field; nothing is saved.
        - `409 refused` while storage backends are off.

        Recorded as `storage.settings-changed`, with each changed setting
        before and after. Saving them as they are changes nothing.
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsChange'
      responses:
        '200':
          description: The settings, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/storage/stuck-files:
    get:
      operationId: adminListOtherStuckFiles
      summary: The stuck files with no Store
      description: |
        The files with no Store the mover gave up on, such as a document's
        saved before it had a folder, listed as a Store's are
        (`GET /v1/admin/stores/{id}/stuck-files`): the newest documents
        first, at most 1,000; `otherFiles.stuck` of `GET /v1/admin/backends`
        counts them all.

        `503 storage-unavailable` on a server without Healdan's storage
        module.
      tags: [Storage]
      responses:
        '200':
          description: The stuck files with no Store
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/StuckFile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/storage/stuck-files/retry:
    post:
      operationId: adminRetryOtherStuckFiles
      summary: Retry the stuck files with no Store
      description: |
        **Retry** for the files with no Store, as a Store's
        (`POST /v1/admin/stores/{id}/stuck-files/retry`): each goes back to
        waiting, its tries counted from nought again, and the mover is woken.
        Takes no body; answers `204`. With none stuck, it changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `409 refused` while storage backends are off.

        Recorded as `storage.stuck-retried`, naming no Store; with none
        stuck, it changes nothing and isn't recorded.
      tags: [Storage]
      responses:
        '204':
          description: Waiting again
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users:
    get:
      operationId: adminListUsers
      summary: The people
      description: |
        The Users list (Admin app spec section 8.7): every person of the
        caller's tenant, disabled and read-only accounts included, but not
        deleted or system accounts, as the People tag says. A page of
        `limit` from `offset`, with the total once the filters have applied,
        which all apply together.

        - `q`, read with the whitespace at either end taken off, in any case,
          its `%` and `_` taken as they are, keeps the people whose username,
          email, first name, last name, or first and last name, as
          `Ann Lee`, contains it. Without it, or blank, everyone.
        - `groupId` keeps the members of that group. An id that names no
          group `GET /v1/admin/groups` lists keeps none.
        - `status` keeps the people whose `status` is that one.
        - `sort` is `name` (the default: the name as `name` gives it),
          `username` or `lastSignIn`, names ignoring case, and `order` `asc`
          (the default) or `desc`. Ties go by username, ignoring case; by
          `lastSignIn`, someone who has never signed in comes last whichever
          the order.

        A `sort`, `order` or `status` that isn't one of these, a negative
        `offset` or a `limit` outside 1 to 200 is `400 bad-request`.
      tags: [People]
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a person's name, username or email
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: |
            Only the members of this group, by its id as
            `GET /v1/admin/groups` gives it; `publisher`'s is negative
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: Only the people with this status
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: sort
          in: query
          required: false
          description: The column to sort by; `name` by default
          schema:
            type: string
            enum: ['name', 'username', 'lastSignIn']
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of people
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminCreateUser
      summary: Add a person
      description: |
        Makes a password account, in one transaction
        (`UserAdministration.create`), and answers `201` with it and its
        temporary password, its address as `Location` (Admin app spec
        section 8.7). The account is an ordinary one, never read-only, in
        Everyone and each group `groupIds` names, with a temporary password
        the server's password rules accept, which must be changed at its
        first sign-in (`mustChangePassword`). The username, the names and
        the email have the whitespace at either end taken off.

        With `emailPassword` true, the temporary password is emailed to the
        person, in the credentials email, once the account is made, and the
        answer has `emailed` true and no password. It's shown instead, with
        `emailed` false, when `emailPassword` is false, and when it couldn't
        be emailed: outgoing email isn't set up (`outgoingEmail` in
        `GET /v1/admin/users/options`), the person has no email address, or
        the mail server didn't take it within 15 seconds. The account is
        made either way. The password is in this answer only: never in
        another answer, a problem, the administration record or a log line.

        Adding someone to `admin` lets them use this app and read every
        document: the app asks first.

        While a sign-in provider is on (`providers` in the options), people
        who sign in through it needn't be added here: their account is made,
        or a password account with the same email linked to it when the
        provider links by email, at their first sign-in there, with the
        groups the provider's group map gives them.

        - `400 bad-request` for a `groupIds` that names a group twice or
          holds a null.
        - `422 validation`, each by its field: `username`, `firstName` or
          `lastName` missing, null or blank, or `emailPassword` missing or
          null (`required`); a username, a name or an email over 255
          characters (`too-long`); a username with `>` or a control
          character, a first or last name with a control character or
          markup, an email that isn't an email address, a `language` that
          isn't one of the options' `languages`, or a `timeZone` that isn't
          one of their `timeZones` (`invalid`); and a username another
          account has, in any case, a deleted or a system account's included
          (`taken`). Of two adds of one username at the same moment, in any
          case, the second is refused as taken.
        - `409 refused` for a group in `groupIds` that no longer exists, or
          isn't one `GET /v1/admin/groups` lists; and for what Healdan's
          rules refuse.

        Recorded as `user.created`, with every field it set and its groups,
        by name; never its password.
      tags: [People]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: The new person, and their temporary password unless it was emailed
          headers:
            Location:
              description: The person's address, such as `/api/v1/admin/users/42`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/options:
    get:
      operationId: adminUserOptions
      summary: What New User and Edit offer
      description: |
        What the forms that add and edit a person need (Admin app spec
        section 8.7), read at the request: the languages a person can be
        given and the one New User fills in; the time zones; the sign-in
        providers that are on, for New User's note that people who sign in
        through one needn't be added; and whether outgoing email is set up,
        so New User and Reset Password offer to email the temporary password
        only when it can go.

        `options` is a path of its own: JAX-RS matches it before
        `GET /v1/admin/users/{id}`'s template, as it does
        `/v1/admin/matters/next-number` and `/v1/admin/stores/deleted`.
      tags: [People]
      responses:
        '200':
          description: The options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOptions'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}:
    get:
      operationId: adminGetUser
      summary: A person
      description: |
        The person, as the list gives them, with what their page shows
        (Admin app spec section 8.7): their language and time zone, when the
        account was made and its password last set, whether that password
        must be changed, how many documents they have checked out and live
        matters they own, and `refusals`, the sentence the server would
        refuse each of the page's actions with, read at the request. Their
        devices are `GET /v1/admin/users/{id}/devices`, their check-outs
        `GET /v1/admin/users/{id}/checkouts`, and the matters they own
        `GET /v1/admin/matters?ownerId=`.

        An id that names no account, a deleted account, another tenant's or
        a system account is `404 not-found`.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: The person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminEditUser
      summary: Edit a person
      description: |
        Changes the person's names, email, language and time zone, the only
        things the app's Edit changes, in one transaction
        (`UserAdministration.update`), and answers the person (Admin app
        spec section 8.7). A member left out stays as it is. An `email` or
        `timeZone` of null, or blank, takes it away; a `language` of null,
        or blank, gives the person the options' `defaultLanguage`. The
        person's current `language` and `timeZone` are accepted as they are,
        even when the options don't offer them; so is their current `email`,
        even one set elsewhere that isn't an email address as
        `adminCreateUser` takes one; and so is a first or last name that's
        blank now, as a provider account's can be: sent as null, blank or
        left out, it stays blank. So an Edit that sends back what it was
        given saves. The names and the email have the whitespace at
        either end taken off. For an account linked to a sign-in provider
        (`signsInWith`), the names and the email may be set again from the
        provider at its next sign-in there.

        - `404 not-found` as `adminGetUser` answers.
        - `422 validation`, each by its field: `username` (`not-editable`),
          as a username never changes here; a `firstName` or `lastName` that's
          null or blank where the person's isn't blank now (`required`); and
          `adminCreateUser`'s `too-long` and `invalid`, but for an `email`, a
          `language` or a `timeZone` that's the person's current one.
        - `409 refused` for what Healdan's rules refuse.

        Recorded as `user.changed`, with each field whose value changed,
        before and after. An edit that changes nothing isn't recorded.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChange'
      responses:
        '200':
          description: The person, changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/disable:
    post:
      operationId: adminDisableUser
      summary: Disable a person's account
      description: |
        Disables the account, so the person can't sign in until it's
        enabled, and signs them out everywhere (Admin app spec section 8.7):
        their device tokens are revoked in the same transaction, and once it
        has committed their open sessions on this server close, so every app
        and device signed in as them is signed out at its next request.
        Answers the person. Takes no body. An account already disabled is
        answered as it is, and nothing is recorded, before the refusals
        below but the first.

        - `404 not-found` as `adminGetUser` answers.
        - `409 refused` first, before an account already disabled is
          answered, as `403 admins-only` comes first too, for a caller whose
          own account was disabled while the change waited its turn.
        - `409 refused`, as `refusals.disable` says beforehand: for the
          `admin` account; for the caller's own; for a change that would
          leave no enabled administrator, counted once any other such change
          at the same moment has committed; and for what Healdan's rules
          refuse.

        Recorded as `user.disabled`.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: The person, disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/enable:
    post:
      operationId: adminEnableUser
      summary: Enable a person's account
      description: |
        Enables a disabled account, so the person can sign in again (Admin
        app spec section 8.7). The device tokens its disable revoked stay
        revoked, so each device signs in again. Answers the person. Takes no
        body. An account already enabled is answered as it is, before the
        refusals below, and nothing is recorded.

        - `404 not-found` as `adminGetUser` answers.
        - `409 refused`, as `refusals.enable` says beforehand, for what
          Healdan's rules refuse.

        Recorded as `user.enabled`.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: The person, enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/reset-password:
    post:
      operationId: adminResetUserPassword
      summary: Give a person a temporary password
      description: |
        Gives the person a new temporary password, which the server's
        password rules accept and which must be changed at their next
        sign-in, in one transaction, and answers it, or that it was emailed
        (Admin app spec section 8.7). As any new password does, it revokes
        their device tokens and clears the failed sign-ins counted under
        their username; and once it has committed, their open sessions on
        this server close, so they're signed out everywhere, as a reset is
        often because the account may be in someone else's hands.

        `emailPassword`, and what the answer holds, are as for
        `adminCreateUser`: the temporary password is in this answer only,
        and only when it wasn't emailed.

        - `404 not-found` as `adminGetUser` answers.
        - `422 validation` for `emailPassword` missing or null (`required`).
        - `409 refused`, as `refusals.resetPassword` says beforehand: for an
          account linked to a sign-in provider, which has no password; for
          the caller's own, which they change from their person menu; and
          for what Healdan's rules refuse. Another administrator can reset
          the `admin` account's.

        Recorded as `user.password-reset`, with the password as changed,
        with no value, and whether it was emailed.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: The temporary password, unless it was emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPassword'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/sign-out:
    post:
      operationId: adminSignOutUser
      summary: Sign a person out everywhere
      description: |
        Signs the person out everywhere (Admin app spec section 8.7): their
        device tokens are revoked, and their open sessions on this server
        close, so every app and device signed in as them is signed out at
        its next request. Callers can sign themselves out this way: their
        own session closes too, and the app's next request is
        `401 unauthenticated`. Answers how many sessions closed and device
        tokens were revoked. Takes no body.

        `404 not-found` as `adminGetUser` answers.

        Recorded as `user.signed-out`, with those counts. With nothing to
        close or revoke, nothing changes and nothing is recorded.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: What was signed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedOut'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/clear-block:
    post:
      operationId: adminClearUserBlock
      summary: Clear a person's sign-in block
      description: |
        Clears the failed sign-ins counted under the person's username, so a
        blocked account (`status` `blocked`) can sign in again now rather
        than at `blockedUntil` (Admin app spec section 8.7). The failed
        sign-ins counted against an address stay. Answers the person. Takes
        no body.

        `404 not-found` as `adminGetUser` answers.

        Recorded as `user.block-cleared`. With no failed sign-in to clear,
        nothing changes and nothing is recorded.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: The person, with no block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/groups:
    put:
      operationId: adminSetUserGroups
      summary: Set the groups a person is in
      description: |
        Sets the groups the person is in to those `groupIds` names, in one
        transaction (`UserAdministration.setGroups`), and answers the person
        (Admin app spec section 8.7). Their own group, which isn't listed,
        stays; so does Everyone, for an account that isn't read-only, and
        `guest`, for a read-only one, whether or not the list names it. An
        empty list leaves them in no other group. A list that changes
        nothing is answered as it is, before the refusals below but the
        first `409`. For an
        account linked to a sign-in provider, its membership of each group
        the provider's group map names (`Group.mappedBy`) may be set again
        from the provider at its next sign-in there. Adding someone to
        `admin` lets them use this app and read every document: the app
        asks first.

        - `400 bad-request` for a `groupIds` that names a group twice or
          holds a null.
        - `404 not-found` as `adminGetUser` answers.
        - `422 validation` for a missing or null `groupIds` (`required`).
        - `409 refused` first, before a list that changes nothing is
          answered, as `403 admins-only` comes first too, for a caller whose
          own account was disabled while the change waited its turn.
        - `409 refused` for a group that no longer exists, or isn't one
          `GET /v1/admin/groups` lists; for a read-only account given any
          group but `guest`; for taking the `admin` account, or the caller,
          out of `admin`, as `refusals.leaveAdmin` says beforehand; for a
          change that would leave no enabled administrator, counted once any
          other such change at the same moment has committed; and for what
          Healdan's rules refuse.

        Recorded as `user.groups-changed`, with the groups before and after,
        by name. A change that changes nothing isn't recorded.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroups'
      responses:
        '200':
          description: The person, in their new groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/devices:
    get:
      operationId: adminListUserDevices
      summary: A person's signed-in devices
      description: |
        The person's device tokens that still work, newest first, the whole
        list (Admin app spec section 8.7): one for each sign-in of an app on
        a computer, such as the Healdan Helper, that hasn't been revoked or
        expired. Never a token itself, or anything it could be made again
        from. The browser's web session isn't a device, and isn't listed.

        `404 not-found` as `adminGetUser` answers.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: The devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDevice'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/devices/{tokenId}:
    delete:
      operationId: adminRevokeUserDevice
      summary: Sign one of a person's devices out
      description: |
        Revokes one of the person's device tokens, so that device is signed
        out at its next request, and answers `204` (Admin app spec section
        8.7). The person's other devices stay signed in.

        `404 not-found` as `adminGetUser` answers, and for a `tokenId` that
        isn't one of the person's tokens that still work: another person's,
        one already revoked, or one that has expired.

        Recorded as `user.device-revoked`, with the device's name.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
        - $ref: '#/components/parameters/DeviceTokenPath'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/users/{id}/checkouts:
    get:
      operationId: adminListUserCheckouts
      summary: The documents a person has checked out
      description: |
        The documents the person has checked out, the latest check-out
        first, the whole list, as `GET /v1/me/checkouts` reads the caller's
        own (Admin app spec section 8.7): each with its doc # and file
        version, its title and matter, when it was checked out and, when a
        device holds the check-out, the computer and app it's held on, so an
        administrator can say where to check it in. Documents they've only
        locked aren't listed.

        An administrator releases one with the public API's
        `DELETE /v1/documents/{docNumber}/checkout`, which keeps nothing the
        person hasn't saved to Healdan, and records the release in the
        document's history.

        `404 not-found` as `adminGetUser` answers.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/UserPath'
      responses:
        '200':
          description: The check-outs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCheckout'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/groups:
    get:
      operationId: adminListGroups
      summary: The groups
      description: |
        The groups, for the Groups list and the forms that name one, such as
        New Store's **who can see it** and a person's groups (Admin app spec
        sections 8.6 and 8.7): live groups of the caller's tenant only, not a
        person's own group (`_user_` and its id), by name, ignoring case. A
        page of `limit` from `offset`, with the total once `q` has filtered
        them. Each says how many people are in it, whether it's fixed or the
        `admin` group, and which sign-in providers' group maps name it.

        `q`, read with the whitespace at either end taken off, in any case,
        its `%` and `_` taken as they are, keeps the groups whose name
        contains it. Without it, or blank, every group.

        A negative `offset` or a `limit` outside 1 to 200 is
        `400 bad-request`.
      tags: [People]
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a group's name
          schema:
            type: string
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminCreateGroup
      summary: Create a group
      description: |
        Makes a group with the name and description given, and answers `201`
        with it, its address as `Location` (Admin app spec section 8.7). It
        has no members, and grants nothing until a folder's or a Store's
        access names it. The name and the description have the whitespace
        at either end taken off; a null or blank description is none.

        - `422 validation`, each by its field: a name missing, null or blank
          (`required`); a name over 200 characters, or a description over 255
          (`too-long`); a name that starts with `_user_`, as a person's own
          group's does, or holds a control character, and a description
          that holds one (`invalid`); and a name another group has, in any
          case (`taken`).
        - `409 refused` for what Healdan's rules refuse.

        Recorded as `group.created`, with its name and description.
      tags: [People]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGroup'
      responses:
        '201':
          description: The new group
          headers:
            Location:
              description: The group's address, such as `/api/v1/admin/groups/7`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/groups/{id}:
    get:
      operationId: adminGetGroup
      summary: A group
      description: |
        The group, as the list gives it, with how many folders grant it
        something, for its page (Admin app spec section 8.7), which lists its
        members with `GET /v1/admin/groups/{id}/members`.

        A person's own group, a deleted group, another tenant's and an id
        that names no group are `404 not-found`.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/GroupPath'
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminEditGroup
      summary: Rename a group, or change its description
      description: |
        Changes the group's name or description, and answers the group as
        `adminGetGroup` gives it (Admin app spec section 8.7). A member left
        out stays as it is; a `description` of null, or blank, takes it
        away. The group keeps its members, and every folder, Store and
        sign-in provider's group map that names it, under its new name.

        - `404 not-found` as `adminGetGroup` answers.
        - `422 validation` for a name that's null or blank (`required`), and
          for `adminCreateGroup`'s other codes, each by its field: the
          group's own name, in any case, isn't `taken`.
        - `409 refused` for a new name for a fixed group (`fixed`), with a
          sentence that says it keeps its name: `admin`, `guest`, `publisher`
          and Everyone are never renamed, though their descriptions change,
          and the name a fixed group has, exactly, changes nothing. And for
          what Healdan's rules refuse.

        Recorded as `group.changed`, with the name and the description
        before and after, each that changed. A change that changes nothing
        isn't recorded.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/GroupPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupChange'
      responses:
        '200':
          description: The group, changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminDeleteGroup
      summary: Delete a group
      description: |
        Takes every member out of the group and deletes it, in one
        transaction, and answers `204` (Admin app spec section 8.7). It's
        then in no list, and the folders and Stores whose access names it
        grant it to no one, as it has no members. `folders` in
        `adminGetGroup` says beforehand how many folders grant it something.

        - `404 not-found` as `adminGetGroup` answers.
        - `409 refused` for a fixed group (`fixed`), with a sentence that
          says it's never deleted; for a group a sign-in provider's group map
          names (`mappedBy`), with a sentence that says to take it out of the
          map first; for a group whose name, given elsewhere, is too long to
          keep with its id once deleted, with a sentence that says to shorten
          it first; and for what Healdan's rules refuse.

        Recorded as `group.deleted`, with its name.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/GroupPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/groups/{id}/members:
    get:
      operationId: adminListGroupMembers
      summary: The people in a group
      description: |
        The people in the group, by name, ignoring case, then username, for
        its page (Admin app spec section 8.7): disabled and read-only
        accounts included, but not deleted or system accounts, as the Users
        list lists them. A page of `limit` from `offset`, with the total once
        `q` has filtered them. `q` is read as the Users list's is.

        - A negative `offset` or a `limit` outside 1 to 200 is
          `400 bad-request`.
        - `404 not-found` as `adminGetGroup` answers.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/GroupPath'
        - name: q
          in: query
          required: false
          description: Part of a person's name, username or email
          schema:
            type: string
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of the group's members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/groups/{id}/members/{userId}:
    put:
      operationId: adminAddGroupMember
      summary: Add a person to a group
      description: |
        Adds the person to the group, and answers `204` (Admin app spec
        section 8.7). Someone already in it changes nothing, before the
        refusals below but the first, and nothing is recorded. Adding someone
        to `admin`
        lets them use this app and read every document: the app asks first.
        For an account linked to a sign-in provider, its membership of a
        group the provider's group map names (`mappedBy`) may be set again
        from the provider at its next sign-in there. Takes no body.

        - `404 not-found` as `adminGetGroup` answers for the group, and as
          `adminGetUser` answers for `userId`.
        - `409 refused` first, before someone already in it is answered, as
          `403 admins-only` comes first too, for a caller whose own account
          was disabled while the change waited its turn.
        - `409 refused` for a read-only account and any group but `guest`,
          and for what Healdan's rules refuse.

        Recorded as `group.member-added`, with the person, named as
        `Ann Lee (alee)`.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/GroupPath'
        - $ref: '#/components/parameters/MemberPath'
      responses:
        '204':
          description: In the group
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminRemoveGroupMember
      summary: Take a person out of a group
      description: |
        Takes the person out of the group, and answers `204` (Admin app spec
        section 8.7). Someone not in it changes nothing, before the refusals
        below but the first, and nothing is recorded. For an account linked
        to a sign-in
        provider, its membership of a group the provider's group map names
        (`mappedBy`) may be set again from the provider at its next sign-in
        there.

        - `404 not-found` as `adminGetGroup` answers for the group, and as
          `adminGetUser` answers for `userId`.
        - `409 refused` first, before someone not in it is answered, as
          `403 admins-only` comes first too, for a caller whose own account
          was disabled while the change waited its turn.
        - `409 refused` for Everyone, which every account but a read-only
          one is always in, and for `guest` and a read-only account, which
          is always in it, each with a sentence that says so; for taking the
          `admin` account, or the caller, out of `admin`, as the person's
          `refusals.leaveAdmin` says beforehand; for a change that would
          leave no enabled administrator, counted once any other such change
          at the same moment has committed; and for what Healdan's rules
          refuse.

        Recorded as `group.member-removed`, with the person, named as
        `Ann Lee (alee)`.
      tags: [People]
      parameters:
        - $ref: '#/components/parameters/GroupPath'
        - $ref: '#/components/parameters/MemberPath'
      responses:
        '204':
          description: Not in the group
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/errors:
    get:
      operationId: adminListErrors
      summary: The errors the server logged, by fault
      description: |
        The Errors list (Admin app spec sections 8.8 and 9.4): one row for
        each kind of fault the server logged at error level or above that
        was last seen in `window`, the one last seen first. A page of
        `limit` from `offset`, with the total of faults once the filters
        have applied, which all apply together, and `errors`, how many
        times those faults were seen in the window, which the list's
        heading gives with the total, as 14 errors of 4 kinds.

        - `window` is the last hour (`1h`), 24 hours (`24h`, the default), 7
          days (`7d`) or 30 days (`30d`). A fault is listed when it was last
          seen in it. `times` and `errors` count by whole clock hours in
          UTC, from the start of the hour the window begins in, so the last
          hour's counts cover the hour now and the one before it.
        - `q`, read with the whitespace at either end taken off, in any case,
          its `%` and `_` taken as they are, keeps the faults whose latest
          message, or the name of the logger they were logged through,
          contains it, each compared as stored, before URLs' user names and
          passwords are taken out. Without it, or blank, every fault.
        - `area` keeps the faults of that area.
        - `unresolved` true keeps the faults nobody has marked resolved
          since they were last seen.

        A resolved fault that's seen again is unresolved again, of itself.

        A `window` or `area` that isn't one of these, an `unresolved` that is
        neither `true` nor `false`, a negative `offset` or a `limit` outside
        1 to 200 is `400 bad-request`.
      tags: [Monitoring]
      parameters:
        - name: window
          in: query
          required: false
          description: How far back the list goes; `24h` by default
          schema:
            type: string
            enum: ['1h', '24h', '7d', '30d']
            default: '24h'
        - name: q
          in: query
          required: false
          description: >-
            Part of a fault's latest message as it's answered, with each
            URL's user name and password taken out, or of its logger's name
          schema:
            type: string
        - name: area
          in: query
          required: false
          description: Only the faults of this area
          schema:
            $ref: '#/components/schemas/ErrorArea'
        - name: unresolved
          in: query
          required: false
          description: '`true` for only the faults nobody has marked resolved; `false` by default'
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of faults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/errors/{id}:
    get:
      operationId: adminGetError
      summary: A fault
      description: |
        A fault, for the details the Errors screen opens below its list
        (Admin app spec section 8.8): what the list gives but `times`, which
        counts a window, and the level it was logged at, the logger it was
        logged through, its latest stack, the documents its latest message
        names, how many times it was seen in all (`total`), who marked it
        resolved and when, and the log its logger writes to, for
        **Show in Server Log**.

        An id that names no fault, as after the server has deleted a
        resolved fault not seen for 90 days, is `404 not-found`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/ErrorPath'
      responses:
        '200':
          description: The fault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/errors/{id}/resolve:
    post:
      operationId: adminResolveError
      summary: Mark a fault resolved
      description: |
        **Mark Resolved**: marks the fault resolved by the caller, now, in
        one transaction with its record, and answers it (Admin app spec
        section 8.8). Takes no body. Once it's seen again it's unresolved
        again, of itself, naming no one. A fault already resolved is
        answered as it is, still naming who resolved it, and nothing is
        recorded.

        `404 not-found` as `adminGetError` answers.

        Recorded as `error.resolved`, aimed at the fault, named by its
        message as `adminGetError` gives it, cut to fit.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/ErrorPath'
      responses:
        '200':
          description: The fault, resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/errors/{id}/reopen:
    post:
      operationId: adminReopenError
      summary: Mark a fault unresolved
      description: |
        Marks a resolved fault unresolved again, forgetting who resolved it
        and when, in one transaction with its record, and answers it (Admin
        app spec section 8.8). Takes no body. A fault that isn't resolved is
        answered as it is, and nothing is recorded.

        `404 not-found` as `adminGetError` answers.

        Recorded as `error.reopened`, aimed at the fault, named as
        `error.resolved` names it.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/ErrorPath'
      responses:
        '200':
          description: The fault, unresolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/logs:
    get:
      operationId: adminListLogs
      summary: The server's logs
      description: |
        The Server Log's menu (Admin app spec section 8.8): the logs the
        server's logging configuration writes to files, each named by its
        appender's name, read at the request. The main log, `DMS`, comes
        first whenever the configuration has it, labelled **Main Log**; then
        each other log whose file, or one of the files it rolled over to,
        holds anything, by label, ignoring case. The HTML copies of the logs
        (the appenders whose names end `_WEB`) aren't listed. Each with the
        size of its files together and when its current file last changed. A
        short list, so not a page.
      tags: [Monitoring]
      responses:
        '200':
          description: The logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/logs/{name}/lines:
    get:
      operationId: adminReadLog
      summary: Lines of a log
      description: |
        At most 200 entries of the log, for the Server Log (Admin app spec
        section 8.8), in the log's order, oldest first. A log is its current
        file and the files it rolled over to, which hold its older lines,
        read as one, from the oldest file to the newest, so it holds what
        they hold: about 30 MB of the main log. A log with no file holds no
        entries. `GET /v1/admin/logs/{name}/file` has the same files.

        Where a read starts is a position, a string the answers give: each
        entry's `position`, and an answer's `before` and `after`. A position
        names one of the log's files, by something of the file's own that
        stays as the log rolls over, and a place in it. It holds nothing a
        client reads, and nothing of it is ever read as a file's name or
        path.

        - With neither `before` nor `after`, the newest entries, ending at
          the end of the current file, and going back into older files as
          far as a read goes.
        - `before` gives the newest of the entries before that position,
          going on into the next older file at the start of one: send an
          answer's `before` for the entries before those, until `atStart`,
          the start of the oldest file there is. A `before` whose file has
          gone, as the oldest file is deleted when the log rolls over again,
          gives no entries, with `atStart`.
        - `after` gives the oldest of the entries at that position or after
          it: send an answer's `after` to follow the log as it grows, and
          each answer's `after` for the next. When the position's file has
          rolled over since, so it isn't the current file any more, the
          answer is `rolled`, and holds the current file's first entries.
          What was written to the older file after the position isn't given
          again here: paging back reaches it.
        - `level` keeps the entries at that level or above: everything
          (`all`, the default), warnings and errors (`warn`), or errors
          (`error`); an entry with no level is kept only with `all`. `q`,
          read with the whitespace at either end taken off, in any case,
          keeps the entries whose message, source or continuation lines, as
          answered, contain it.

        An entry is a line that starts with its time as the server's logging
        writes it, such as `22.11.2026 10:41:07,120`, and the lines after it
        that don't start one, such as a stack trace's, which are its
        `continuation`. After the time the main log, and most others, write
        the level, the source and the message; a few of the server's logs
        write the level and the message, or the message alone, and their
        entries have no `source`, or neither `level` nor `source`. Lines that start no entry at the start of what was
        read, such as those at the start of the oldest file, or, with
        `after`, the rest of a stack an earlier answer ended in while it was
        still being written, are entries of their own, a line each, with no
        time, level or source. A read that goes back stops at an entry's
        start when it finds one, so an entry's lines come together. A last
        line not yet ended is left for the next read. A line longer than
        10,000 characters is cut there.

        A read looks through at most 5 MiB of the log, and 50,000 lines, so
        with `level` or `q` it may give fewer than 200 entries, or none,
        before it reaches the start of the oldest file (`atStart`), or, with
        `after`, the end of the current file (`atEnd`): ask again from the
        answer's `before` or `after`. A read forward that stops there gives
        none of the entry it was reading, which the next read gives whole,
        but for the first it read, which is longer than a read looks through.

        - `400 bad-request` for both `before` and `after`, a position that
          isn't one this route gives, or a `level` that isn't one of these.
        - `404 not-found` for a `name` that isn't one of the logs
          `GET /v1/admin/logs` lists.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/LogName'
        - name: before
          in: query
          required: false
          description: The entries before this position, as an answer's `before` or an entry's `position` gives it
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: The entries at this position or after it, as an answer's `after` or an entry's `position` gives it
          schema:
            type: string
        - name: level
          in: query
          required: false
          description: |
            `all` for every entry (the default), `warn` for warnings and
            errors, `error` for errors
          schema:
            type: string
            enum: [all, warn, error]
        - name: q
          in: query
          required: false
          description: Part of an entry's message, source or continuation lines
          schema:
            type: string
      responses:
        '200':
          description: The entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLines'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/logs/{name}/file:
    get:
      operationId: adminDownloadLog
      summary: Download a log
      description: |
        **Download** (Admin app spec section 8.8): the log's files as they
        are, its current file and the files it rolled over to, which hold its
        older lines, in a zip, each under its own file name. The answer is an
        attachment named after the log's file and the time it was made, in
        UTC, such as `dms-20261122-104107.zip`. It's `no-store`, as the files
        hold what the server logged. A `HEAD` answers the headers, and reads
        no file.

        `404 not-found` for a `name` that isn't one of the logs
        `GET /v1/admin/logs` lists.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/LogName'
      responses:
        '200':
          description: The log's files, zipped
          headers:
            Content-Disposition:
              description: '`attachment`, with the zip''s file name'
              required: true
              schema:
                type: string
            Cache-Control:
              description: '`no-store`'
              required: true
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/audit:
    get:
      operationId: adminListAudit
      summary: The Audit Trail
      description: |
        The Audit Trail (Admin app spec sections 8.8 and 9.3): what was done,
        newest first, from LogicalDOC's history of documents, folders and
        accounts, Healdan's administration record, and its record of storage
        backends' recovery keys. Rows are kept for good, as nothing deletes
        them, but a document destroyed for good takes its document rows with
        it, while the administration rows, and the Trash's record of it,
        stay.

        Each row is of one `kind`:

        - `sign-in`: an account's sign-ins, sign-outs, sessions that timed
          out, and failed sign-ins;
        - `document`: what was done to a document, such as viewing,
          downloading, filing or saving a version;
        - `folder`: what was done to a folder;
        - `user`: the rest of an account's history, such as a new password;
        - `administration`: each change made through this app, and each
          client and matter change made elsewhere, with the fields it
          changed (`changes`); and each showing and entering of a storage
          backend's recovery key. One made through this app is one row, the
          administration record's; one made in the Classic Interface's
          Storage tab is listed from that tab's own record.

        The filters all apply together:

        - `kind` keeps the rows of those kinds; every kind without it.
        - `userId` keeps the rows the person did, and the rows about them:
          their account's own history, sign-ins included, and the
          administration rows aimed at them (`user`). A person's Activity
          tab is this filter.
        - `matterId` keeps the document and folder rows of the matter's own
          folder and every folder in it, those in the Trash included, and
          the administration rows aimed at the matter, or at a folder or
          search folder in it; no sign-in, user or storage rows. A document
          that has left the matter keeps the rows it made while it was in
          it. A matter's Activity tab is this filter.
        - `docNumber` keeps the rows of the document with that doc #.
        - `from` and `to` keep the rows of those days, from the start of
          `from` to the end of `to`, in `zone`. A row whose time is more
          than an hour out of step with the rows written around it, as
          after the server's clock was put back, may be left out of a
          dated list.
        - `q`, read with the whitespace at either end taken off, in any
          case, its `%` and `_` taken as they are, keeps the rows whose file
          name, folder path, target's name or address contains it, or the
          person as the row kept them: their username, and in LogicalDOC's
          history also their name at the time. Never the name `who` gives,
          which is read now: `userId` is the filter for a person. What was
          typed at a failed sign-in for a username no account has is never
          compared.

        A page holds at most `limit` rows, newest first, and reads only so
        far into each source, so a page whose filters keep few rows may
        hold fewer, or none, and still have a `nextCursor`. Send
        `nextCursor` back as `cursor`, with the same filters, for the rows
        after it. It holds each source's place, so rows written meanwhile
        never repeat one on a later page; they're on a fresh first page. A
        row whose transaction commits after a page has passed its id
        isn't on a later page either, only on a fresh first page. There's
        no total.
        `nextCursor` is null only once every source has been read to its
        end. `readBackTo` says how far back the page's reading reached, so
        a page with few rows, or none, can say nothing more was found back
        to then.

        A `kind` that isn't one of these, a `userId`, `matterId` or
        `docNumber` that isn't a whole number from 0 up, a `zone` the server
        doesn't know, a `from` or `to` that isn't a day of the years 0001 to
        9999 written as `2026-11-22`, a `limit` outside 1 to 200, or a
        `cursor` that isn't one this route gives is `400 bad-request`. A
        `userId`, `matterId` or `docNumber` that names nothing keeps no
        row, `0` included, and so does a `to` before `from`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/AuditKinds'
        - $ref: '#/components/parameters/AuditUserId'
        - $ref: '#/components/parameters/AuditMatterId'
        - $ref: '#/components/parameters/AuditDocNumber'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditZone'
        - $ref: '#/components/parameters/AuditText'
        - $ref: '#/components/parameters/PageLimit'
        - name: cursor
          in: query
          required: false
          description: An answer's `nextCursor`, for the rows after its page; the newest rows without it
          schema:
            type: string
      responses:
        '200':
          description: A page of the Audit Trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/audit/export:
    get:
      operationId: adminExportAudit
      summary: Export the Audit Trail as CSV
      description: |
        **Export CSV** (Admin app spec section 8.8): the rows the filters
        keep, as `adminListAudit` takes them, newest first, as CSV, sent as
        they're read and never held whole, following the pages to the end or
        to 100,000 rows. The answer is an attachment named after the day it
        was made, in `zone`, such as `audit-trail-2026-11-22.csv`.

        The file is UTF-8, starting with a byte order mark so that a
        spreadsheet reads it as UTF-8, and its lines end in CR LF. The first
        line names the columns, Time, Who, Kind, What, Detail, From and
        Changes, then a line for each row:

        - Time, the row's `when` in UTC in ISO 8601, always with three
          digits of milliseconds, such as `2026-11-22T10:44:07.120Z` or
          `2026-11-22T10:44:07.000Z`;
        - Who, What, Detail and From, the row's `who`, `what`, `detail` and
          `from`, empty for null;
        - Kind, as the Audit Trail shows it: Sign-In, Document, Folder, User
          or Administration;
        - Changes, an administration row's `changes`, each on a line of its
          own within the cell, the lines parted by an LF, as
          `name: before → after`, a value that was none as `(none)`, and a
          secret's as `name: changed`.

        A cell, once composed and before it's quoted, that starts with `=`,
        `+`, `-`, `@`, a tab or a CR starts with `'` before it, so a
        spreadsheet doesn't read it as a formula. Then a cell that holds a
        comma, a double quote, a CR or an LF is quoted, its double quotes
        doubled. With more than 100,000 rows, the newest 100,000 come, then a
        last line, whose one cell says
        `Stopped at 100,000 rows: narrow the filters to export the rest.`

        The filters are checked, and the first page of rows read, before
        anything is sent: a filter is refused as `adminListAudit` refuses
        it, `400 bad-request`, and a first page that can't be read is a
        problem, `500`. Then the column names go out at once, and the rows
        as each page is read. An export that can't finish says so in a last
        line, a cell of its own as the rows' are:
        `Stopped before the end: the server couldn't read the rest. Export again.`
        when a later page can't be read, and
        `Stopped before the end: only an administrator can export the Audit Trail.`
        when the person exporting is no longer an administrator as the next
        page is read, which is asked at each page. A `HEAD` answers the
        headers once the filters are checked, and reads no row. The answer
        is `no-store`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/AuditKinds'
        - $ref: '#/components/parameters/AuditUserId'
        - $ref: '#/components/parameters/AuditMatterId'
        - $ref: '#/components/parameters/AuditDocNumber'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditZone'
        - $ref: '#/components/parameters/AuditText'
      responses:
        '200':
          description: The rows, as CSV
          headers:
            Content-Disposition:
              description: '`attachment`, with the file''s name'
              required: true
              schema:
                type: string
            Cache-Control:
              description: '`no-store`'
              required: true
              schema:
                type: string
          content:
            text/csv;charset=utf-8:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/jobs:
    get:
      operationId: adminListJobs
      summary: The background jobs
      description: |
        Background Jobs (Admin app spec sections 8.8 and 9.5): every job,
        Healdan's first, in a fixed order, then LogicalDOC's scheduled tasks,
        each with what it last did since the server started, when it runs
        next and what it allows now, read at the request. A short list, so
        not a page.

        - Healdan's jobs report to the server as they run, so a restart
          forgets their last run. One that doesn't run on this server, such
          as a storage job where storage backends are off, is listed
          switched off. **Run Now** is offered for five of them, each while
          it's switched on and isn't running: `trash-destroyer`,
          `storage-mover`, `storage-retest`, `storage-purge` and
          `storage-nightly-check`. It's never offered for `preview`,
          `email-index`, `storage-alert` or `reindex`, which runs by itself
          while a reindex waits or runs, each started, watched and cancelled
          on the Search Index, and none of Healdan's jobs is stopped,
          switched off or rescheduled here.
        - LogicalDOC's tasks run on their `schedule`, while enabled. Run Now
          is offered while one is enabled and idle, unless the server has
          scheduled tasks switched off, **Stop** while it runs, and
          **Enable**, **Disable** and its schedule always. Its last run
          failed when it logged an error while it ran, which `error` gives.
      tags: [Monitoring]
      responses:
        '200':
          description: The jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/jobs/{name}/run:
    post:
      operationId: adminRunJob
      summary: Run a job now
      description: |
        **Run Now** (Admin app spec section 8.8): starts a run of the job at
        once, on a thread of its own, and answers the job, which may not
        show it running yet. The run reports as a scheduled run does, so
        its end and result come in `GET /v1/admin/jobs`. Takes no body.

        - `404 not-found` for a `name` that `GET /v1/admin/jobs` doesn't
          list.
        - `409 refused`, with a sentence that says why, for a job that
          can't run now (`canRun` false): one of Healdan's that's never run
          now, such as `preview`, one switched off or disabled, a
          LogicalDOC task on a server with scheduled tasks switched off,
          and one already running.

        Recorded as `job.run-requested`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/jobs/{name}/stop:
    post:
      operationId: adminStopJob
      summary: Stop a running task
      description: |
        **Stop** (Admin app spec section 8.8): asks a LogicalDOC task's run
        to stop, and answers the job, which shows it running until the run
        stops, at its next check. Takes no body.

        - `404 not-found` as `adminRunJob` answers.
        - `409 refused`, with a sentence that says why, for a job that
          can't be stopped now (`canStop` false): one of Healdan's, which is
          never stopped here, and a task that isn't running, or has been
          asked to stop already.

        Recorded as `job.stop-requested`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/jobs/{name}/enable:
    post:
      operationId: adminEnableJob
      summary: Enable a task
      description: |
        **Enable** (Admin app spec section 8.8): lets a LogicalDOC task run
        on its schedule again, saved in the server's configuration, so it
        lasts across a restart, and answers the job with its next run.
        Takes no body. A task already enabled is answered as it is, and
        nothing is recorded.

        - `404 not-found` as `adminRunJob` answers.
        - `409 refused`, with a sentence that says why, for one of Healdan's
          jobs, which is never switched off or on here (`switchable` false).

        Recorded as `job.enabled`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: The job, enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/jobs/{name}/disable:
    post:
      operationId: adminDisableJob
      summary: Disable a task
      description: |
        **Disable** (Admin app spec section 8.8): stops a LogicalDOC task
        from running on its schedule, saved in the server's configuration,
        so it lasts across a restart, and answers the job. A run already
        going on goes on to its end, unless it's stopped. Takes no body. A
        task already disabled is answered as it is, and nothing is
        recorded.

        - `404 not-found` as `adminRunJob` answers.
        - `409 refused`, with a sentence that says why, for one of Healdan's
          jobs, which is never switched off or on here (`switchable` false).

        Recorded as `job.disabled`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: The job, disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/jobs/{name}/schedule:
    put:
      operationId: adminScheduleJob
      summary: Change a task's schedule
      description: |
        Saves a LogicalDOC task's schedule in the server's configuration, as
        the Classic Interface's Scheduled Tasks screen saves it, and answers
        the job with its next run (Admin app spec section 8.8). `simple`
        runs the task every `intervalSeconds`; `cron` when the cron
        expression `cron` says, in Quartz's form (seconds, minutes, hours,
        day of month, month, day of week, and a year if wanted, such as
        `0 0 3 * * ?` for three in the morning every day), in the server's
        time zone. The schedule's other settings stay as they are, and so
        does whether the task is enabled. Saving the schedule it has is
        answered as it is, and nothing is recorded.

        - `404 not-found` as `adminRunJob` answers.
        - `422 validation`, each by its field: `mode` missing or null
          (`required`), or neither `simple` nor `cron` (`invalid`); for
          `simple`, `intervalSeconds` missing or null (`required`) or
          outside 1 to 31,536,000, a year (`out-of-range`); for `cron`,
          `cron` missing, null or blank (`required`), or not an expression
          Quartz takes, or one that never comes round again (`invalid`);
          and the other mode's member, sent with a value (`invalid`), null
          counting as left out.
        - `409 refused`, with a sentence that says why, for one of Healdan's
          jobs, which has no schedule here (`schedule` null).

        Recorded as `job.schedule-changed`, with the schedule before and
        after as one change, `schedule`, each written as
        `every 1800 seconds` or `cron 0 0 3 * * ?`.
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/JobName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobScheduleChange'
      responses:
        '200':
          description: The job, with its schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-index:
    get:
      operationId: adminGetSearchIndex
      summary: The Search Index
      description: |
        The Search Index's heading (Admin app spec section 8.9): how many
        documents are indexed, waiting and couldn't be indexed, as the
        Search Index tag counts them, never taken from the Dashboard's copy:
        the server keeps one count for up to 10 seconds, which this and both
        lists' totals share, and counts again at once after **Try Again**,
        **Skip**, a reindex's end or a waiting reindex's cancel; how many
        entries the index holds and how big its folder is, where those can
        be read; its health, as the Dashboard's Search Index tile works it
        out; and LogicalDOC's Indexer, with what **Run Indexer Now** would
        do. A reindex's progress is `GET /v1/admin/reindex`'s, with
        `active=true`.
      tags: [Search Index]
      responses:
        '200':
          description: The Search Index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchIndex'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-index/failed:
    get:
      operationId: adminListIndexFailures
      summary: The documents that couldn't be indexed
      description: |
        The **Couldn't Be Indexed** tab (Admin app spec sections 8.9 and
        9.6): each document that couldn't be indexed, as the Search Index
        tag defines it, the latest error first, one with no time last, then
        by the document's id, the highest first. A page of `limit` from
        `offset`, with the total, which is `GET /v1/admin/search-index`'s
        `failed`, from the same count.

        LogicalDOC's Indexer tries each of them again on its schedule, until
        one is indexed or set to Skip. **Try Again** indexes one now, and
        **Skip** stops it being tried again.

        A negative `offset` or a `limit` outside 1 to 200 is
        `400 bad-request`.
      tags: [Search Index]
      parameters:
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of the documents that couldn't be indexed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexFailureList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-index/waiting:
    get:
      operationId: adminListIndexWaiting
      summary: The documents waiting to be indexed
      description: |
        The **Waiting** tab (Admin app spec section 8.9): each document that
        waits for LogicalDOC's Indexer, as the Search Index tag defines it,
        those that couldn't be indexed left out, by the document's id, the
        lowest first. That is the order they were filed in, not the order
        the Indexer takes them in, which isn't fixed. A page of `limit` from
        `offset`, with the total, which is `GET /v1/admin/search-index`'s
        `waiting`, from the same count.

        A negative `offset` or a `limit` outside 1 to 200 is
        `400 bad-request`.
      tags: [Search Index]
      parameters:
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of the documents waiting to be indexed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexWaitingList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-index/history:
    get:
      operationId: adminListIndexHistory
      summary: What the index was given
      description: |
        The **History** tab's events (Admin app spec section 8.9): each time
        a document was indexed or couldn't be, newest first, from
        LogicalDOC's document history, whoever did it: LogicalDOC's
        Indexer, a reindex, **Try Again**, or the Classic Interface. The tab
        lists the reindexes first, from `GET /v1/admin/reindex`, then these.
        Rows are kept as the Audit Trail's are: a document destroyed for
        good takes its rows with it.

        A page holds at most `limit` rows, newest first, and looks through
        only so many rows of the history, of every kind, so a page may hold
        fewer, or none, and still have a `nextCursor`. Send `nextCursor`
        back as `cursor` for the rows after it: rows written meanwhile never
        repeat one on a later page, as `adminListAudit`'s don't, and are on
        a fresh first page. There's no total. `nextCursor` is null only once
        the history has been read to its end, and `readBackTo` says how far
        back the page's reading reached.

        A `limit` outside 1 to 200, or a `cursor` that isn't one this route
        gives, is `400 bad-request`.
      tags: [Search Index]
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - name: cursor
          in: query
          required: false
          description: An answer's `nextCursor`, for the rows after its page; the newest rows without it
          schema:
            type: string
      responses:
        '200':
          description: A page of the index's events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexHistoryPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-index/run:
    post:
      operationId: adminRunIndexer
      summary: Run LogicalDOC's Indexer now
      description: |
        **Run Indexer Now** (Admin app spec section 8.9): starts a run of
        LogicalDOC's Indexer at once, as Background Jobs' **Run Now** does
        for `IndexerTask` (`adminRunJob`), and answers the Indexer, which
        may not show it running yet. A run takes the next documents waiting,
        as many as the Indexer takes in a run, those that couldn't be
        indexed among them. Takes no body.

        `409 refused`, with a sentence that says why, when the Indexer can't
        run now (`Indexer.runRefusal`): it's disabled, the server has
        scheduled tasks switched off, or it's running already.

        Recorded as Background Jobs records Run Now: `job.run-requested`, in
        the Monitoring area, aimed at the job `IndexerTask`.
      tags: [Search Index]
      responses:
        '200':
          description: The Indexer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indexer'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-index/failed/{docNumber}/retry:
    post:
      operationId: adminRetryIndexing
      summary: Index a document that couldn't be indexed, now
      description: |
        **Try Again** (Admin app spec sections 8.9 and 9.6): indexes the
        document now, while the request waits, as LogicalDOC's Indexer would,
        and answers how that went, `200` either way: any failure but the
        index's or the storage's (below) is the document's own. Indexed, it
        leaves **Couldn't Be Indexed**. Not, it stays there with the new reason,
        and the Indexer goes on trying it on its schedule, unless the
        server is set to stop trying a document once it can't be indexed,
        which sets it to Skip, so it leaves the list. Either way the
        History tab has a row for it, naming the caller. A large or slow
        file holds the request while it's read. Takes no body.

        - `404 not-found` for a doc # no live document has: none with it,
          one in the Trash or deleted, or another tenant's.
        - `409 refused` for a document that isn't among those that couldn't
          be indexed, as when it has been indexed or set to Skip meanwhile,
          with the sentence
          `This document is no longer waiting after an error.`
        - `409 refused` when the search index itself can't be written just
          then, with the sentence
          `The search index can't be written just now. Try again later.`
          The document stays as it was, with its reason, it isn't set to
          Skip, the History tab gets no row, and nothing is recorded.
        - `503 storage-unreachable` when the storage that keeps the
          document's file can't be reached right now, as the public API
          answers it: its `detail` names the Store, and is meant to be
          shown as it is. The document stays as it was, among those that
          couldn't be indexed, the History tab gets no row, and nothing is
          recorded: ask again later.

        Recorded as `index.retried`, straight after it, aimed at the
        document (`document`, its id), named by its doc # and file name, as
        `# 10412 Witness Statement.pdf`, with one change, `outcome`, from
        none to `indexed` or `failed`.
      tags: [Search Index]
      parameters:
        - $ref: '#/components/parameters/IndexDocNumber'
      responses:
        '200':
          description: How it went
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRetry'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/search-index/failed/{docNumber}/skip:
    post:
      operationId: adminSkipIndexing
      summary: Stop trying to index a document
      description: |
        **Skip** (Admin app spec sections 8.9 and 9.6): sets the document
        not to be indexed (Skip), so LogicalDOC's Indexer stops trying it and
        it leaves **Couldn't Be Indexed**, counted neither as waiting nor
        as failed. Its entry in the index, if it has one, stays. A reindex
        that covers it leaves it out from then on, as it leaves out every
        document set to Skip. Answers `204`, with no body. Takes no body.

        `404 not-found` and `409 refused` as `adminRetryIndexing` answers
        them.

        Recorded as `index.skipped`, straight after it, aimed and named as
        `index.retried` is, with no change.
      tags: [Search Index]
      parameters:
        - $ref: '#/components/parameters/IndexDocNumber'
      responses:
        '204':
          description: It's set to Skip
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/reindex/preview:
    post:
      operationId: adminPreviewReindex
      summary: What a reindex would cover
      description: |
        The Reindex dialog's count and estimate (Admin app spec sections
        8.9 and 13): what `POST /v1/admin/reindex` would start with the same
        body, now, and changes nothing. The User app asks it for the
        question it asks before a reindex, too.

        It answers the name the reindex would be given, how many documents
        it would try (`count`, which a reindex started at once makes its
        `total`), how many of those in its scope it would leave out
        (`skipped`), about how long it would take, and for `documents`
        each doc # as found or not. `refusal` says what
        `POST /v1/admin/reindex` would refuse with now, so the dialog can
        say it before its button: a scope with nothing to reindex, and one
        an active reindex covers already.

        It's checked as `POST /v1/admin/reindex` checks its body, in the
        same order, `400`, `404` then `422`, and is never `409`.
      tags: [Search Index]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReindexScope'
      responses:
        '200':
          description: What the reindex would cover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/reindex:
    get:
      operationId: adminListReindexJobs
      summary: The reindexes
      description: |
        The reindexes started (Admin app spec sections 8.9 and 9.6), the
        newest first: with `active=true`, only those waiting or running, for
        the progress shown above the Search Index's tabs; without it, every
        one, for the History tab, those that ended kept for good. A page of
        `limit` from `offset`, with the total once `active` has applied.

        One reindex runs at a time, across the server, and the others wait
        their turn, oldest first.

        An `active` that is neither `true` nor `false`, a negative `offset`
        or a `limit` outside 1 to 200 is `400 bad-request`.
      tags: [Search Index]
      parameters:
        - name: active
          in: query
          required: false
          description: "`true` for only the reindexes waiting or running; `false` by default"
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of reindexes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexJobList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminStartReindex
      summary: Start a reindex
      description: |
        **Reindex** (Admin app spec sections 8.9, 9.6 and 13): starts a
        reindex of the documents the scope covers, as
        `POST /v1/admin/reindex/preview` counts them, and answers `201` with
        it, its address as `Location`, waiting or running. It runs on the
        server, straight through, whoever started it, and nothing waits for
        it: the User app starts one from a right-click and stays where it
        was.

        - The documents it will try are fixed as it's started, `total` of
          them; those it leaves out then are `leftOut`. Each is tried once,
          in the order of its id, its entry in the index replaced as it's
          done, so search keeps finding it throughout. A document that has
          gone by its turn (deleted, in the Trash or destroyed), or has been
          set to Skip, archived, or is being changed at that moment, is
          counted `skipped`, and so is one whose file's storage can't be
          reached then, counted in `unreachable` too, which keeps its entry
          and stays indexed, waiting or failed as it was, with no row in the
          History tab: a reindex once the storage is back covers it. One
          moved or given a new version is indexed as it is then, and one
          whose save meets another write at that moment is tried once more
          at the end of its batch. A document it couldn't index joins
          **Couldn't Be Indexed**, keeping the entry it had, unless the
          server is set to stop trying a document once it can't be indexed,
          which sets it to Skip, as **Try Again** does. A reindex that ends
          `done` has `done`, `failed` and `skipped` adding up to `total`.
        - When the index can't be written, it waits and tries again, its
          `stalledSince` saying since when, and counts nothing meanwhile.
          Before it waits, the index is asked whether it answers: if it
          does, the documents it refused are counted `failed`.
        - When the server's reindex worker itself fails, it tries again
          every 30 seconds, `failingSince` saying since when, and Background
          Jobs giving the failure.
        - `emptyFirst`, with `everything` only, marks every document to be
          indexed, then empties the index, as its run begins, not as it's
          started, so no other reindex is running then. An index the server
          can't empty is waited for, as one that can't be written. Search
          then misses documents until each is done again, and LogicalDOC's
          Indexer takes any the reindex doesn't cover, such as those filed
          meanwhile. Without it, nothing is taken out of the index.

        Refused in the order this file's introduction gives:

        - `400 bad-request` as `ReindexScope` says.
        - `404 not-found` for a `targetId` that isn't live, or is another
          tenant's: a folder that doesn't exist, is deleted or in the Trash,
          or is a folder alias; a matter that doesn't exist, is deleted or
          is in the Trash; and anything but a live Store for `store`,
          LogicalDOC's Default workspace, the Templates Store and the root
          included.
        - `422 validation`, each by its field: `kind` missing or null
          (`required`), or not one of the five (`invalid`); `targetId`
          missing or null for `folder`, `matter` or `store` (`required`);
          `docNumbers` missing, null or empty for `documents` (`required`),
          or holding more than 1,000 different doc #s (`too-many`); and
          `emptyFirst` true for any kind but `everything` (`invalid`).
        - `409 refused`, with a sentence that says why, for a scope whose
          `count` would be 0, `There's nothing here to reindex.`, and for a
          folder, matter, Store or everything that a reindex waiting or
          running covers already, the same kind and the same `targetId`,
          `This is already being reindexed.` Documents named by doc # are
          never refused as already being reindexed.

        Recorded as `reindex.started`, in the start's transaction, aimed at
        the scope: `matter`, `folder` or `store` with its id, or `documents`
        or `everything` with none, named by the reindex's `name`; with
        three changes, from none: `kind`, `documents` (its `total`) and
        `emptyFirst` (`true` or `false`).
      tags: [Search Index]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReindexScope'
      responses:
        '201':
          description: The reindex
          headers:
            Location:
              description: Its address, such as `/api/v1/admin/reindex/7`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexJob'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/reindex/{id}:
    get:
      operationId: adminGetReindexJob
      summary: A reindex
      description: |
        A reindex, with its progress (Admin app spec section 8.9).

        `404 not-found` for an id no reindex of the caller's tenant has.
      tags: [Search Index]
      parameters:
        - $ref: '#/components/parameters/ReindexPath'
      responses:
        '200':
          description: The reindex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexJob'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminCancelReindex
      summary: Cancel a reindex
      description: |
        **Cancel** (Admin app spec section 8.9): cancels the reindex, and
        answers it as it then is. One waiting is `cancelled` at once. One
        running is asked to stop (`cancelling`) and is `cancelled` once the
        batch of documents it's indexing ends, that batch's counts kept. The
        documents it hasn't reached keep the entries in the index they have,
        and stay indexed, waiting or failed as they were. A reindex already
        asked to stop is answered as it is, and nothing is recorded.

        - `404 not-found` as `adminGetReindexJob` answers.
        - `409 refused` for a reindex that has ended, `done` or
          `cancelled`, with the sentence `This reindex has ended.`

        Recorded as `reindex.cancelled`, straight after it, aimed and named
        as `reindex.started` is, with no change.
      tags: [Search Index]
      parameters:
        - $ref: '#/components/parameters/ReindexPath'
      responses:
        '200':
          description: The reindex, cancelled or cancelling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexJob'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        The browser's web session, for the Admin app, served from the same
        origin, on the rules `openapi.yaml`'s `cookieAuth` describes. A device
        token, sent as a Bearer `Authorization` header, is
        `403 web-session-only` here.
  parameters:
    PageOffset:
      name: offset
      in: query
      required: false
      description: How many items to skip. Default 0.
      schema:
        type: integer
        minimum: 0
    PageLimit:
      name: limit
      in: query
      required: false
      description: The most items to return, 1 to 200. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    SortOrder:
      name: order
      in: query
      required: false
      description: '`asc` (the default) or `desc`.'
      schema:
        type: string
        enum: [asc, desc]
    ClientPath:
      name: id
      in: path
      required: true
      description: The client's id
      schema:
        type: integer
        format: int64
        minimum: 0
    MatterPath:
      name: id
      in: path
      required: true
      description: The matter's id, not its folder's
      schema:
        type: integer
        format: int64
        minimum: 0
    FolderPath:
      name: id
      in: path
      required: true
      description: The id of a folder or search folder of a workspace
      schema:
        type: integer
        format: int64
        minimum: 0
    SearchFolderPath:
      name: id
      in: path
      required: true
      description: The search folder's id
      schema:
        type: integer
        format: int64
        minimum: 0
    TemplatePath:
      name: id
      in: path
      required: true
      description: The template's id, which is its folder's
      schema:
        type: integer
        format: int64
        minimum: 0
    StorePath:
      name: id
      in: path
      required: true
      description: The Store's id, which is its folder's
      schema:
        type: integer
        format: int64
        minimum: 0
    BackendPath:
      name: id
      in: path
      required: true
      description: The storage backend's id; Original's is 1
      schema:
        type: integer
        format: int64
        minimum: 0
    UserPath:
      name: id
      in: path
      required: true
      description: The user's id
      schema:
        type: integer
        format: int64
        minimum: 0
    DeviceTokenPath:
      name: tokenId
      in: path
      required: true
      description: The device token's id, as `GET /v1/admin/users/{id}/devices` gives it
      schema:
        type: integer
        format: int64
        minimum: 0
    GroupPath:
      name: id
      in: path
      required: true
      description: The group's id, as `GET /v1/admin/groups` gives it; `publisher`'s is negative
      schema:
        type: integer
        format: int64
    MemberPath:
      name: userId
      in: path
      required: true
      description: The person's user id
      schema:
        type: integer
        format: int64
        minimum: 0
    ErrorPath:
      name: id
      in: path
      required: true
      description: The fault's id, as `GET /v1/admin/errors` gives it
      schema:
        type: integer
        format: int64
        minimum: 0
    LogName:
      name: name
      in: path
      required: true
      description: |
        The log's name, its appender's, as `GET /v1/admin/logs` gives it,
        such as `DMS`: never a file's name or path
      schema:
        type: string
        pattern: '^[^/\\]*[^/\\.][^/\\]*$'
        examples: [DMS, IndexerTask]
    JobName:
      name: name
      in: path
      required: true
      description: The job's name, as `GET /v1/admin/jobs` gives it
      schema:
        type: string
        examples: [storage-mover, IndexerTask]
    AuditKinds:
      name: kind
      in: query
      required: false
      description: The kinds of row to keep, the parameter repeated for each; every kind without it
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AuditKind'
    AuditUserId:
      name: userId
      in: query
      required: false
      description: |
        Only the rows a person did, and those about them, by their id, as
        `GET /v1/admin/users` gives it
      schema:
        type: integer
        format: int64
        minimum: 0
    AuditMatterId:
      name: matterId
      in: query
      required: false
      description: Only the rows of a matter, by its id, as `GET /v1/admin/matters` gives it, not its folder's
      schema:
        type: integer
        format: int64
        minimum: 0
    AuditDocNumber:
      name: docNumber
      in: query
      required: false
      description: "Only the rows of the document with this doc #"
      schema:
        type: integer
        format: int64
        minimum: 0
    AuditFrom:
      name: from
      in: query
      required: false
      description: |
        Only the rows of this day or later, the day starting at midnight in
        `zone`; a day of the years 0001 to 9999
      schema:
        type: string
        format: date
    AuditTo:
      name: to
      in: query
      required: false
      description: |
        Only the rows of this day or earlier, to the day's end in `zone`; a
        day of the years 0001 to 9999
      schema:
        type: string
        format: date
    AuditZone:
      name: zone
      in: query
      required: false
      description: |
        The time zone the days of `from` and `to` are in, and the export's
        day in its file's name, as an IANA id such as `Europe/London`: the
        browser's own, so the days are the ones its person sees; the
        server's time zone without it. One the server doesn't know is
        `400`.
      schema:
        type: string
        examples: [Europe/London]
    AuditText:
      name: q
      in: query
      required: false
      description: |
        Part of a row's file name, folder path, target's name or address, or
        of the person's username or name as the row kept them
      schema:
        type: string
    IndexDocNumber:
      name: docNumber
      in: path
      required: true
      description: |
        The document's doc #, as the public API's
        `/v1/documents/{docNumber}` takes it
      schema:
        type: integer
        format: int64
        minimum: 0
    ReindexPath:
      name: id
      in: path
      required: true
      description: The reindex's id, as `GET /v1/admin/reindex` gives it
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    Problem:
      description: A refusal or an error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        An RFC 9457 problem, as in `openapi.yaml`, with the codes the admin
        API answers. `validation` adds `fields`, and `secret-key-missing`
        adds `sealed`.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: '`https://healdan.com/problems/<code>`; it needn''t resolve.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: An English sentence a client can show as it is.
        code:
          type: string
          description: What clients switch on.
          examples: [web-session-only, admins-only, not-found, refused, validation, secret-key-missing,
            storage-unavailable, storage-unreachable]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        sealed:
          type: integer
          format: int64
          minimum: 1
          description: |
            For `secret-key-missing`: how many stored values are sealed with
            Healdan's missing secret key file, sign-in providers' client
            secrets and storage backends' S3 secrets among them. A new key
            would leave each to be entered again, and helpers signed in
            through a provider to sign in again
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, detail]
      properties:
        field:
          type: string
          description: |
            The field that is wrong: a property's name, or a request's member.
            One element of a list is named with its position or index, as
            `fileEmail` names a ticked attachment `attachments[2]`.
          examples: [docclass, 'attachments[2]']
        code:
          type: string
          examples: [required, not-an-email, not-an-attachment]
        detail:
          type: string
          examples: [Class is required.]
    Page:
      type: object
      description: |
        The shape of every list. A list of things is
        `allOf: [{$ref: Page}, {properties: {items: {type: array, items: {$ref: Thing}}}}]`
        with `unevaluatedProperties: false`, as `TokenPage` is.
      required: [items, offset, limit, total]
      properties:
        items:
          type: array
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        total:
          type: [integer, 'null']
          minimum: 0
          description: Null where counting would be expensive, such as a full-text search.
    Dashboard:
      type: object
      description: The Dashboard's Needs Attention and Server Health
      additionalProperties: false
      required: [attention, unchecked, health, readAt]
      properties:
        attention:
          type: array
          description: What needs acting on, each code at most once, in the order `AttentionCode` lists them
          maxItems: 8
          items:
            $ref: '#/components/schemas/AttentionItem'
        unchecked:
          type: array
          description: |
            The codes whose source couldn't be read, in the order
            `AttentionCode` lists them, so the app can say it couldn't check
            them. Empty when everything was checked.
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AttentionCode'
        health:
          type: array
          description: The ten tiles, in the order `HealthTile.name` lists them
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/HealthTile'
        readAt:
          type: string
          format: date-time
          description: |
            When the oldest answer given was read (a part that couldn't be
            read gives none); the time of the request when every part was
            read for it
    AttentionCode:
      type: string
      description: |
        What needs attention:

        - `files-stuck`: files the storage mover gave up moving to their
          Store's backend;
        - `backend-unreachable`: a storage backend that can't be reached,
          or is failing for another reason, so Healdan can't use it;
        - `index-failed`: documents that couldn't be indexed, so search
          doesn't find their text;
        - `errors`: errors the server logged in the last 24 hours that
          nobody has resolved;
        - `previews-given-up`: previews that were given up on after their
          last try;
        - `job-failed`: a background job whose last run failed, unless it's
          switched off;
        - `job-overdue`: a background job that hasn't run when it should
          have;
        - `disk-low`: a disk the server writes to that is more than 85%
          full.
      enum: [files-stuck, backend-unreachable, index-failed, errors, previews-given-up, job-failed, job-overdue,
        disk-low]
    AttentionItem:
      type: object
      description: Something an administrator should act on
      additionalProperties: false
      required: [code, count, detail, link]
      properties:
        code:
          $ref: '#/components/schemas/AttentionCode'
        count:
          type: integer
          description: How many files, backends, documents, errors, previews, jobs or disks
          minimum: 1
        detail:
          type: string
          description: A line in English that says more, such as which Store or since when
          examples: ['Client Work, moving to Wasabi EU']
        link:
          type: string
          description: |
            Where it's fixed: the Admin app's address of that screen once it
            has shipped, such as `/admin/search-index`, and the Classic
            Interface, `/frontend.jsp`, until then.
          examples: [/admin/search-index, /frontend.jsp]
    HealthTile:
      type: object
      description: One of the Server Health tiles
      additionalProperties: false
      required: [name, status, detail, used, total, link, problem]
      properties:
        name:
          type: string
          description: |
            Which tile: Server (time up, Healdan's version), Database
            (product, version and size), Disk (used of total for the
            repository's volume, and the index's and logs' where they
            differ), Memory (heap used of its maximum), Sign-In (each enabled
            provider answering), Storage Backends (reachable, stuck files),
            Search Index (waiting and failed), Previews (waiting and given
            up), Background Jobs (on schedule, or which aren't) and Outgoing
            Email (whether it's set up, and whether a send failed in the last
            24 hours, from the errors the server logged sending that nobody
            has resolved: LogicalDOC logs no send that succeeds, so the last
            send's result can't be known).
          enum: [server, database, disk, memory, sign-in, storage-backends, search-index, previews, background-jobs,
            outgoing-email]
        status:
          type: string
          description: |
            `ok`; `attention` when something needs acting on, or the tile's
            part couldn't be read; `off` when what it shows isn't set up or
            is switched off, such as Outgoing Email with no mail server or
            Storage Backends on a server that doesn't use them.
          enum: [ok, attention, 'off']
        detail:
          type: [string, 'null']
          description: The tile's line in English, such as `Up 6 days, Healdan 9.3.2`; null when `problem` is set
        used:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Bytes: the Disk's and the Memory's used, and the Database's
            size; null for the other tiles, and when `problem` is set
        total:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Bytes, the Disk's and the Memory's total; null for the other tiles, and when `problem` is set
        link:
          type: string
          description: |
            The screen behind the tile: the Admin app's address once it has
            shipped, and the Classic Interface, `/frontend.jsp`, until then
          examples: [/admin/search-index, /frontend.jsp]
        problem:
          type: [string, 'null']
          description: |
            Why the tile's part couldn't be read, in English; then `status` is
            `attention`. Null when it was read.
    Usage:
      type: object
      description: |
        The Dashboard's Usage, worked out at most every 15 minutes, never by
        a request.

        Days are those of the request's `zone`, the server's without it.
        "The last 7 days" and "the last 30 days" are whole days, today
        included: the last 7 and the 30
        of `filedPerDay` add up to `documents.last7Days` and
        `documents.last30Days`. Documents are the live ones: not shortcuts,
        and not in the Trash. A matter's documents are those stamped with its
        client and matter numbers, and a Store's are its matters'.
      additionalProperties: false
      required: [computedAt, failedAt, documents, storage, matters, clients, people, signedIn, filedPerDay, stores,
        busiestMatters]
      properties:
        computedAt:
          type: [string, 'null']
          format: date-time
          description: When it was worked out; null until it has been once since the server started
        failedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the last try to work it out failed, the rest being the last
            summary that didn't; null once a try works again. The error itself
            is in the server's log, never here.
        documents:
          description: The documents, and how many were filed in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        storage:
          description: |
            The bytes of the documents' files, the current version of each,
            and of those filed in the last 7 and 30 days. Older versions,
            previews and the Trash aren't counted.
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        matters:
          description: The live matters, not deleted or in the Trash, and how many were created in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        clients:
          description: The clients, and how many were created in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        people:
          description: |
            The enabled user accounts, not system accounts such as `_system`,
            and how many were created in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        signedIn:
          type: integer
          minimum: 0
          description: |
            How many people have a session open on this server, each once,
            counted at each request rather than with the rest
        filedPerDay:
          type: array
          description: The documents filed on each of the last 30 days, oldest first, today last; empty until worked out
          maxItems: 30
          items:
            $ref: '#/components/schemas/DayCount'
        stores:
          type: array
          description: Every Store, but Default and Templates, most bytes first, then by name
          items:
            $ref: '#/components/schemas/StoreUsage'
        busiestMatters:
          type: array
          description: The matters most documents were filed in in the last 7 days, most first, at most five
          maxItems: 5
          items:
            $ref: '#/components/schemas/BusyMatter'
    UsageTotal:
      type: object
      description: A total, and how much of it came lately
      additionalProperties: false
      required: [total, last7Days, last30Days]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        last7Days:
          type: integer
          format: int64
          minimum: 0
          description: How much of the total came in the last 7 days
        last30Days:
          type: integer
          format: int64
          minimum: 0
          description: How much of the total came in the last 30 days
    DayCount:
      type: object
      additionalProperties: false
      required: [date, count]
      properties:
        date:
          type: string
          format: date
          description: The day, in the request's `zone`
        count:
          type: integer
          format: int64
          minimum: 0
          description: How many documents were filed on it
    StoreUsage:
      type: object
      description: A Store, and what its matters hold
      additionalProperties: false
      required: [id, name, documents, bytes, backend]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        documents:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: The size of its documents' files, the current version of each
        backend:
          description: |
            The storage backend it keeps its files on; null when the server
            doesn't use storage backends, or when they couldn't be read as
            the summary was worked out
          oneOf:
            - $ref: '#/components/schemas/StoreBackend'
            - type: 'null'
    StoreBackend:
      type: object
      description: A storage backend, as a Store names it
      additionalProperties: false
      required: [id, name, kind, encrypted]
      properties:
        id:
          type: integer
          format: int64
          description: Its id; Original, the server's own folder, is 1
        name:
          type: string
        kind:
          type: string
          description: '`local`, a folder, or `s3`, a bucket'
          enum: [local, s3]
        encrypted:
          type: boolean
    BusyMatter:
      type: object
      description: A matter documents were filed in in the last 7 days
      additionalProperties: false
      required: [id, number, name, filed]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
        filed:
          type: integer
          format: int64
          minimum: 1
          description: How many documents were filed in it in the last 7 days
    Found:
      type: object
      description: What the find found, at most five of each
      additionalProperties: false
      required: [clients, matters, people]
      properties:
        clients:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/FoundClient'
        matters:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/FoundMatter'
        people:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/FoundPerson'
    FoundClient:
      type: object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
    FoundMatter:
      type: object
      additionalProperties: false
      required: [id, number, name, client]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
        client:
          $ref: '#/components/schemas/FoundClient'
    FoundPerson:
      type: object
      additionalProperties: false
      required: [id, username, name, enabled]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
          description: The first and last name
        enabled:
          type: boolean
          description: False for a disabled account, which can't sign in
    Client:
      type: object
      description: A client, with its matters' figures
      additionalProperties: false
      required: [id, number, name, matters, documents, lastActivity]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
          description: Its number, which never changes
        name:
          type: string
        matters:
          type: integer
          format: int64
          minimum: 0
          description: How many live matters it has, not deleted or in the Trash
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Its matters' live documents, not shortcuts and not in the Trash,
            counted through the client and matter stamped on them, as the
            summary last counted them; null until the summary has been worked
            out since the server started
        lastActivity:
          type: [string, 'null']
          format: date-time
          description: |
            When one of its matters' documents was last filed or saved, as
            the summary last found it; null with none, or until the summary
            has been worked out
    ClientList:
      description: A page of clients, and when their figures were worked out
      allOf:
        - $ref: '#/components/schemas/Page'
        - required: [figuresAt]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Client'
            figuresAt:
              type: [string, 'null']
              format: date-time
              description: |
                When the summary that gives `documents` and `lastActivity`
                was worked out; null until it has been since the server
                started
      unevaluatedProperties: false
    NewClient:
      type: object
      description: A new client
      additionalProperties: false
      required: [number, name]
      properties:
        number:
          type: integer
          format: int64
          description: Its number, 1 or more, which never changes; `GET /v1/admin/clients/next-number` suggests one
        name:
          type: string
          description: Its name, at most 255 characters
    NameChange:
      type: object
      description: A client's new name
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: At most 255 characters
    NextNumber:
      type: object
      description: The number to suggest
      additionalProperties: false
      required: [number]
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
    ClientBrief:
      type: object
      description: A client named in another object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
    StoreBrief:
      type: object
      description: A Store named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    TemplateBrief:
      type: object
      description: A workspace template named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: Its id, which is its folder's
        name:
          type: string
    FolderBrief:
      type: object
      description: A folder named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PersonBrief:
      type: object
      description: A person named in another object
      additionalProperties: false
      required: [id, username, name]
      properties:
        id:
          type: integer
          format: int64
          description: The user's id
        username:
          type: string
        name:
          type: string
          description: The first and last name; the username when both are blank
    MatterRow:
      type: object
      description: A matter, as the Matters list shows it
      additionalProperties: false
      required: [id, number, name, client, store, owner, template, documents, bytes, lastActivity, folderId]
      properties:
        id:
          type: integer
          format: int64
          description: The matter's id, not its folder's
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
          description: Its own name, without its number
        client:
          $ref: '#/components/schemas/ClientBrief'
        store:
          $ref: '#/components/schemas/StoreBrief'
        owner:
          description: Who owns it; null when that person's account has been deleted
          oneOf:
            - $ref: '#/components/schemas/PersonBrief'
            - type: 'null'
        template:
          description: |
            The workspace template it was made from; null when it was made
            from none, or that template has been deleted since
          oneOf:
            - $ref: '#/components/schemas/TemplateBrief'
            - type: 'null'
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Its live documents, not shortcuts and not in the Trash, counted
            through the client and matter stamped on them, as the summary
            last counted them; null until the summary has been worked out
            since the server started, and 0 for a matter made since the last
            one
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: The size of those documents' files, the current version of each; null as `documents` is
        lastActivity:
          type: [string, 'null']
          format: date-time
          description: |
            When one of its documents was last filed or saved, as the
            summary last found it; null with none, or until the summary has
            been worked out
        folderId:
          type: integer
          format: int64
          description: |
            Its own folder, the top of its workspace:
            `GET /v1/admin/workspaces/{folderId}/tree` takes it, and so does
            the User app
    MatterList:
      description: A page of matters, and when their figures were worked out
      allOf:
        - $ref: '#/components/schemas/Page'
        - required: [figuresAt]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MatterRow'
            figuresAt:
              type: [string, 'null']
              format: date-time
              description: |
                When the summary that gives `documents`, `bytes` and
                `lastActivity` was worked out; null until it has been since
                the server started
      unevaluatedProperties: false
    Matter:
      type: object
      description: A matter, for its page
      additionalProperties: false
      required: [id, number, name, description, client, store, owner, template, documents, bytes, lastActivity,
        figuresAt, folderId, indexFailed, previewsGivenUp]
      properties:
        id:
          type: integer
          format: int64
          description: The matter's id, not its folder's
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
          description: Its own name, without its number
        description:
          type: [string, 'null']
        client:
          $ref: '#/components/schemas/ClientBrief'
        store:
          $ref: '#/components/schemas/StoreBrief'
        owner:
          description: Who owns it; null when that person's account has been deleted
          oneOf:
            - $ref: '#/components/schemas/PersonBrief'
            - type: 'null'
        template:
          description: |
            The workspace template it was made from; null when it was made
            from none, or that template has been deleted since
          oneOf:
            - $ref: '#/components/schemas/TemplateBrief'
            - type: 'null'
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: As in `MatterRow`, from the summary
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: As in `MatterRow`, from the summary
        lastActivity:
          type: [string, 'null']
          format: date-time
          description: As in `MatterRow`, from the summary
        figuresAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the summary that gives `documents`, `bytes` and
            `lastActivity` was worked out, as `MatterList`'s; null until it
            has been since the server started
        folderId:
          type: integer
          format: int64
          description: Its own folder, the top of its workspace
        indexFailed:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of its live documents couldn't be indexed, as the
            Dashboard's `index-failed` counts them, counted at the request
        previewsGivenUp:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of its live documents' previews were given up on after
            their last try, as the Dashboard's `previews-given-up` counts
            them, counted at the request
    NewMatter:
      type: object
      description: What New Matter creates
      additionalProperties: false
      required: [clientId, number, name, storeId, ownerId, templateId]
      properties:
        clientId:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
          description: |
            The matter's number within its client, such as 2 for `1004.2`;
            `GET /v1/admin/matters/next-number` suggests one
        name:
          type: string
          description: Its own name, without its number
        description:
          type: [string, 'null']
          description: At most 4,000 characters; null, blank or left out for none
        storeId:
          type: integer
          format: int64
          description: The Store its folder goes in
        ownerId:
          type: integer
          format: int64
          description: The user who owns it, whose own group gets Full Access
        templateId:
          type: integer
          format: int64
          description: The workspace template its folders are copied from
    MatterDraft:
      type: object
      description: |
        New Matter's form as it stands, for its check: `NewMatter`'s members,
        any of them left out or null
      additionalProperties: false
      properties:
        clientId:
          type: [integer, 'null']
          format: int64
        number:
          type: [integer, 'null']
          format: int64
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        storeId:
          type: [integer, 'null']
          format: int64
        ownerId:
          type: [integer, 'null']
          format: int64
        templateId:
          type: [integer, 'null']
          format: int64
    MatterCheck:
      type: object
      description: What creating the draft would refuse
      additionalProperties: false
      required: [problems]
      properties:
        problems:
          type: array
          description: Empty when nothing is found; in the order `MatterProblemCode` lists the codes
          items:
            $ref: '#/components/schemas/MatterProblem'
    MatterProblemCode:
      type: string
      description: |
        What New Matter's check finds, each looked for once the draft gives
        the members in brackets:

        - `client-missing` (`clientId`): the client no longer exists.
        - `number-invalid` (`number`): a number below 1.
        - `number-taken` (`clientId` and `number`, or `number` alone when
          numbers are system-wide): a matter already has the number, a
          deleted one too.
        - `name-invalid` (a `name` that isn't blank): a `/`, a `\` or markup,
          or, once `clientId` and `number` are given too, too long for the
          folder's name with the matter's number before it.
        - `description-invalid` (`description`): over 4,000 characters.
        - `store-missing` (`storeId`): not a live Store.
        - `template-missing` (`templateId`): not a live template.
        - `owner-missing` (`ownerId`): there's no such person.
        - `owner-disabled` (`ownerId`): the person's account is disabled.
        - `wider-than-parent` (`templateId`): a folder of the template grants
          a group something its parent doesn't (P1), once for each such
          folder, with the group the first excess is about.
        - `store-unreadable` (`templateId` and `storeId`, and `ownerId` for
          the owner): a group the template would let into the matter, or the
          owner, can't read the Store (P2), once for each, with `storeId`,
          `groupId` and `groupName`, and `fixAction` `grant-store-read`.
      enum: [client-missing, number-invalid, number-taken, name-invalid, description-invalid, store-missing,
        template-missing, owner-missing, owner-disabled, wider-than-parent, store-unreadable]
      examples: [number-taken, store-unreadable]
    MatterProblem:
      type: object
      description: One thing creating the draft would refuse
      additionalProperties: false
      required: [code, message, fixAction, storeId, groupId, groupName]
      properties:
        code:
          $ref: '#/components/schemas/MatterProblemCode'
        message:
          type: string
          description: An English sentence that says what's wrong, which the app can show as it is
          examples: [Everyone can't read the Store Regional Office.]
        fixAction:
          type: [string, 'null']
          description: |
            How New Matter can put it right there: `grant-store-read`, **Let
            {group} Read the Store**, which is
            `PUT /v1/admin/stores/{storeId}/access` with `groupId` added to
            who can see the Store, then the check again. Null for a problem
            the form puts right itself.
          enum: [grant-store-read, null]
        storeId:
          type: [integer, 'null']
          format: int64
          description: The Store it's about, for `store-unreadable`; null otherwise
        groupId:
          type: [integer, 'null']
          format: int64
          description: |
            The group it's about, a person's own group for a person: for
            `store-unreadable`, and `wider-than-parent` when it names one;
            null otherwise
        groupName:
          type: [string, 'null']
          description: |
            That group's name, or that person's first and last name (the
            username when both are blank), for **Let {group} Read the
            Store**; null with no `groupId`
    MatterChange:
      type: object
      description: |
        What **Edit** changes, each member left out staying as it is. A
        matter's client, number and template never change, and its Store
        changes by a move: those members are `422 validation`
        (`not-editable`).
      additionalProperties: false
      properties:
        name:
          type: string
          description: Its own name, without its number
        description:
          type: [string, 'null']
          description: At most 4,000 characters; null or blank for none
        ownerId:
          type: integer
          format: int64
          description: The user who owns it
    MatterMove:
      type: object
      description: Where a matter moves
      additionalProperties: false
      required: [storeId]
      properties:
        storeId:
          type: integer
          format: int64
          description: The Store its folder moves into
    DeletedMatter:
      type: object
      description: The Trash item a matter's delete made
      additionalProperties: false
      required: [trashItemId, folders, documents]
      properties:
        trashItemId:
          type: integer
          format: int64
          description: |
            The item in the caller's Trash that holds the matter's folder,
            which `POST /v1/trash/{id}/restore` restores and the User app's
            Trash lists
        folders:
          type: integer
          format: int64
          minimum: 0
          description: The folders in the matter's folder that went with it, at every level, its own left out
        documents:
          type: integer
          format: int64
          minimum: 0
          description: The documents that went with it
    DeletedFolder:
      type: object
      description: The Trash item a workspace folder's, a template's or a Store's delete made
      additionalProperties: false
      required: [trashItemId, folders, documents]
      properties:
        trashItemId:
          type: integer
          format: int64
          description: |
            The item in the caller's Trash that holds the folder, which the
            User app's Trash lists. `POST /v1/trash/{id}/restore` restores a
            matter's folder back where it was; a template's, or a folder of
            one, it answers `409 place-gone`, as it restores into a Store
            only; and a Store's `409 refused`, as
            `POST /v1/admin/stores/{id}/restore` restores a Store
        folders:
          type: integer
          format: int64
          minimum: 0
          description: |
            The folders and search folders in it that went with it, at every
            level, its own left out: a Store's matters' own folders among them
        documents:
          type: integer
          format: int64
          minimum: 0
          description: The documents that went with it; none in a template
    WorkspaceNode:
      type: object
      description: A folder or search folder of a workspace, with what's in it
      additionalProperties: false
      required: [id, name, kind, ownPermissions, children]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          description: '`folder`, or a `search-folder`, which lists documents by its rule and holds no folders'
          enum: [folder, search-folder]
        ownPermissions:
          type: boolean
          description: True when it has permissions of its own, false when it follows another folder's
        children:
          type: array
          description: Its folders, then its search folders, each by name, ignoring case; none for a search folder
          items:
            $ref: '#/components/schemas/WorkspaceNode'
    FolderName:
      type: string
      description: |
        A folder's name: a workspace folder's or search folder's, a
        template's or a Store's, with the whitespace at either end taken off. `422 validation` for
        the field `name` as `renameFolder` in `openapi.yaml` answers it:
        `required`, also for a name of characters that show nothing, such as
        U+200B; `too-long`, over 255 characters; and `invalid`, for a `/`, a
        `\`, a control character, one that changes the text's direction, any
        HTML tag, or a character reference such as `&amp;`.
    FolderRename:
      type: object
      description: A folder's, a template's or a Store's new name
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
    NewWorkspaceFolder:
      type: object
      description: A new folder of a workspace
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
    FolderMove:
      type: object
      description: Where a workspace's folder moves
      additionalProperties: false
      required: [folderId]
      properties:
        folderId:
          type: integer
          format: int64
          description: The folder it moves into, of the same workspace
    Permission:
      type: string
      description: |
        One of LogicalDOC's 25 permissions, in its order, which **Show Every
        Permission** lists
      enum: [read, download, write, add, security, immutable, delete, rename, import, export, sign, archive, workflow,
        calendar, subscription, print, password, move, email, automation, store, readingreq, preview, customid,
        revision]
    AccessLevel:
      type: string
      description: |
        A row's permissions as a level, an exact match (Admin app spec
        section 8.4):

        - `read-only`: read, preview, download, print and email;
        - `read-write`: Read Only's, plus write, add, rename, move and
          delete;
        - `full-access`: all 25, what a matter's owner gets;
        - `can-see`: read alone, a Store's one level; the Workspace Editor
          shows it as Custom on a folder;
        - `custom`: anything else.
      enum: [read-only, read-write, full-access, can-see, custom]
    AccessRow:
      type: object
      description: What a folder or Store grants a group or a person
      additionalProperties: false
      required: [groupId, name, person, userId, level, permissions, owner]
      properties:
        groupId:
          type: integer
          format: int64
          description: The group, or the person's own group
        name:
          type: string
          description: The group's name, or the person's first and last name (the username when both are blank)
        person:
          type: boolean
          description: True for a person's own group
        userId:
          type: [integer, 'null']
          format: int64
          description: The person, for a person's own group; null for a group
        level:
          $ref: '#/components/schemas/AccessLevel'
        permissions:
          type: array
          description: What it grants, at least one, in the order `Permission` lists them
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        owner:
          type: boolean
          description: |
            True for the matter's owner's own group, on any folder of the
            matter; false elsewhere, and on a Store
    FolderAccess:
      type: object
      description: Who can use a workspace's folder
      additionalProperties: false
      required: [folderId, ownPermissions, followsFolderId, rows, canApplyToSubfolders]
      properties:
        folderId:
          type: integer
          format: int64
        ownPermissions:
          type: boolean
          description: True when it has permissions of its own; false when it follows another folder's
        followsFolderId:
          type: [integer, 'null']
          format: int64
          description: |
            When it follows, the folder whose permissions it takes, which may
            be above its parent, or its Store; null with its own
        rows:
          type: array
          description: |
            What it grants, groups first, then people, each by name, ignoring
            case; a group or person it grants nothing isn't listed
          items:
            $ref: '#/components/schemas/AccessRow'
        canApplyToSubfolders:
          type: boolean
          description: |
            Whether **Apply to Subfolders** is offered: it has a live folder
            below it (one in the Trash doesn't count), and Healdan's rules
            allow it (`checkApplyToTree`)
    FolderAccessChange:
      type: object
      description: |
        A folder's new permissions: `rows`, its own; or `followParent: true`,
        its parent's. One of the two, never both.
      additionalProperties: false
      properties:
        followParent:
          type: boolean
          description: True to give up its own permissions and follow its parent's
        rows:
          type: array
          description: Its own permissions, each group or person once; one left out gets none here
          items:
            $ref: '#/components/schemas/AccessGrant'
    AccessGrant:
      type: object
      description: |
        What a folder grants a group, by `groupId`, or a person, by `userId`,
        whose own group gets it: one of the two. A person's own group may be
        named by its `groupId` too, as `AccessRow` gives it, so a row can be
        sent back as it came; naming a person by `userId` and by their own
        group's `groupId` names them twice (`duplicate`).
      additionalProperties: false
      required: [permissions]
      properties:
        groupId:
          type: integer
          format: int64
          description: A group, or a person's own group
        userId:
          type: integer
          format: int64
          description: A person, whose own group gets the row
        permissions:
          type: array
          description: Exactly what it grants, at least one; `AccessLevel` lists each level's
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
    FolderProperties:
      type: object
      description: The values a workspace's folder sets for what's filed below it
      additionalProperties: false
      required: [folderId, properties]
      properties:
        folderId:
          type: integer
          format: int64
        properties:
          type: array
          description: Each property that passes down from folders, in the profile's order
          items:
            $ref: '#/components/schemas/FolderProperty'
    FolderProperty:
      type: object
      description: One value a folder sets, or inherits
      additionalProperties: false
      required: [name, label, type, value, source, inheritedFrom, options]
      properties:
        name:
          type: string
          description: The property's name, as `values` names it
          examples: [docclass]
        label:
          type: string
          examples: [Class]
        type:
          type: string
          description: The type of the value
          enum: [string, integer, decimal, date, boolean, user, folder, document]
        value:
          description: |
            The folder's value: its own, or what it inherits; null when it
            has none. Text for a `string`, a number for an `integer` or a
            `decimal`, true or false for a `boolean`, an ISO 8601 timestamp
            for a `date`, a `PropertyUser` for a `user`, the folder's id for a
            `folder` and the doc # for a `document`, as `openapi.yaml`'s
            `ProfileField` gives them.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - $ref: '#/components/schemas/PropertyUser'
            - type: 'null'
        source:
          type: [string, 'null']
          description: |
            `local`: set on this folder, which passes it down. `inherited`:
            from the folder `inheritedFrom` names. `default`: the install's
            default Class. Null when there's no value.
          enum: [local, inherited, default, null]
        inheritedFrom:
          description: The folder an inherited value comes from, or null
          oneOf:
            - $ref: '#/components/schemas/FolderBrief'
            - type: 'null'
        options:
          type: [array, 'null']
          description: The values to pick from, in order; null when the property isn't picked from a list
          items:
            $ref: '#/components/schemas/PropertyOption'
    PropertyUser:
      type: object
      description: A person a `user` property names
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: [string, 'null']
    PropertyOption:
      type: object
      description: One value of a property picked from a list
      additionalProperties: false
      required: [value, label, class]
      properties:
        value:
          type: string
        label:
          type: string
        class:
          type: [string, 'null']
          description: For a Subclass, the Class it belongs to, so the list can narrow to the chosen Class; null otherwise
    FolderPropertiesChange:
      type: object
      description: A folder's values, the whole set
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: object
          description: |
            Each value the folder sets, by the property's name, as
            `FolderProperty.value` gives it (a `user` by its id, or the
            `{id, name}` given). A property that's null, empty text or left
            out inherits.
          additionalProperties:
            $ref: '#/components/schemas/FolderPropertyValue'
          examples:
            - docclass: Correspondence
              docsubclass: null
    FolderPropertyValue:
      description: |
        A value as a request sends it, in the form `FolderProperty.value`
        has. Text is at most 4,000 characters once cleaned of markup.
      oneOf:
        - type: string
          maxLength: 4000
        - type: number
        - type: boolean
        - type: object
          description: A user, by its `id`, as `PropertyUser` or alone
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: [string, 'null']
        - type: 'null'
    SearchFolderRule:
      type: object
      description: |
        Which documents a search folder lists: those of its matter changed
        within the window, that match the rest, which whoever opens it can
        read, newest change first. Sent back as `GET` gives it, every member
        given.
      additionalProperties: false
      required: [days, onlyMine, kind, docClass, docSubclass]
      properties:
        days:
          type: integer
          minimum: 1
          description: The window, documents changed in the last so many days, counted back from when it's opened
        onlyMine:
          type: boolean
          description: True when only the changes of whoever opens it count
        kind:
          type: string
          description: '`all` documents, `documents` only (not emails), or `emails` only (`.eml` and `.msg` files)'
          enum: [all, documents, emails]
        docClass:
          type: [string, 'null']
          description: |
            The Class the documents must have; null for any. The editor offers
            the `docclass` property's `options`, which
            `GET /v1/admin/folders/{id}/properties` gives for any folder of
            the workspace, the search folder's own being refused
        docSubclass:
          type: [string, 'null']
          description: |
            The Subclass the documents must have, only with a `docClass`; null
            for any. The editor offers the `docsubclass` property's `options`
            whose `class` is the chosen Class
    SearchFolder:
      type: object
      description: A search folder of a workspace, with its rule
      additionalProperties: false
      required: [id, name, rule]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        rule:
          $ref: '#/components/schemas/SearchFolderRule'
    NewSearchFolder:
      type: object
      description: A new search folder
      additionalProperties: false
      required: [name, rule]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        rule:
          $ref: '#/components/schemas/SearchFolderRule'
    SearchFolderChange:
      type: object
      description: |
        A search folder's new rule. Its name changes only through
        `PATCH /v1/admin/folders/{id}`, as a folder's does.
      additionalProperties: false
      required: [rule]
      properties:
        rule:
          $ref: '#/components/schemas/SearchFolderRule'
    TemplateInfo:
      type: object
      description: A workspace template
      additionalProperties: false
      required: [id, name, folders, matters]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Its id, which is its folder's: New Matter's `templateId`, and the
            `folderId` of `GET /v1/admin/workspaces/{folderId}/tree`
        name:
          type: string
        folders:
          type: integer
          format: int64
          minimum: 0
          description: The live folders and search folders in it, at every level, its own and any folder alias left out
        matters:
          type: integer
          format: int64
          minimum: 0
          description: The live matters made from it, not deleted or in the Trash
    NewTemplate:
      type: object
      description: A new workspace template
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        copyOf:
          type: [integer, 'null']
          format: int64
          description: The template to copy; null or left out for an empty one
    TemplateProblem:
      type: object
      description: Something New Matter would refuse in a matter made from the template
      additionalProperties: false
      required: [code, message, folderId, storeId, groupId, groupName]
      properties:
        code:
          type: string
          description: |
            `wider-than-parent`: a folder grants a group something its parent
            doesn't (P1). `store-unreadable`: a group that could read a matter
            made from it can't read a Store (P2).
          enum: [wider-than-parent, store-unreadable]
        message:
          type: string
          description: An English sentence that says what's wrong, which the app can show as it is
          examples: ["Privileged grants more than the folder it's in (group Partners: WRITE)."]
        folderId:
          type: [integer, 'null']
          format: int64
          description: The folder that grants more than its parent, for `wider-than-parent`; null otherwise
        storeId:
          type: [integer, 'null']
          format: int64
          description: The Store, for `store-unreadable`; null otherwise
        groupId:
          type: [integer, 'null']
          format: int64
          description: The group it's about, a person's own group for a person; null when it names none
        groupName:
          type: [string, 'null']
          description: |
            That group's name, or that person's first and last name (the
            username when both are blank), as `MatterProblem.groupName`; null
            with no `groupId`
    Store:
      type: object
      description: A Store, as its create answers it; `StoreInfo` has the rest
      additionalProperties: false
      required: [id, name, backendId]
      properties:
        id:
          type: integer
          format: int64
          description: Its id, which is its folder's
        name:
          type: string
        backendId:
          type: integer
          format: int64
          description: |
            The backend it keeps its files on: the one asked for, or Original,
            1, when none was asked for or it couldn't be given the one asked
            for
    NewStore:
      type: object
      description: A new Store, who can see it, and the storage backend it keeps its files on
      additionalProperties: false
      required: [name, groupIds]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        groupIds:
          type: array
          description: The groups, or people's own groups, that can see it, each given Read; empty for administrators alone
          uniqueItems: true
          items:
            type: integer
            format: int64
        backendId:
          type: [integer, 'null']
          format: int64
          description: |
            The storage backend it keeps its files on, one offered to Stores;
            null or left out for Original, the server's own folder, whose id
            is 1
    StoreAccess:
      type: object
      description: Who can see a Store
      additionalProperties: false
      required: [storeId, rows]
      properties:
        storeId:
          type: integer
          format: int64
        rows:
          type: array
          description: |
            Each group and person with permissions on it, groups first, then
            people, each by name, ignoring case; a row's `level` is
            `can-see` or `custom`, and its `owner` false
          items:
            $ref: '#/components/schemas/AccessRow'
    StoreAccessChange:
      type: object
      description: Who can see a Store from then on
      additionalProperties: false
      required: [groupIds]
      properties:
        groupIds:
          type: array
          description: |
            The groups, or people's own groups, that can see it, each given
            Read; every other group's row goes. Empty for administrators
            alone.
          uniqueItems: true
          items:
            type: integer
            format: int64
    StoreInfo:
      type: object
      description: A Store, as the Stores list and its page show it
      additionalProperties: false
      required: [id, name, matters, documents, bytes, figuresAt, readers, backend, pending]
      properties:
        id:
          type: integer
          format: int64
          description: Its id, which is its folder's
        name:
          type: string
        matters:
          type: integer
          format: int64
          minimum: 0
          description: How many live matters it holds, not deleted or in the Trash, counted at the request
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Its matters' live documents, not shortcuts and not in the Trash,
            counted through the client and matter stamped on them, as the
            summary last counted them; null until the summary has been worked
            out since the server started
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: The size of those documents' files, the current version of each; null as `documents` is
        figuresAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the summary that gives `documents` and `bytes` was worked
            out; null until it has been since the server started
        readers:
          type: array
          description: |
            Who can see it: each group and person whose row on it grants
            Read, groups first, then people, each by name, ignoring case, as
            `GET /v1/admin/stores/{id}/access` lists them. Empty when only
            administrators can
          items:
            $ref: '#/components/schemas/StoreReader'
        backend:
          description: |
            The storage backend it keeps its files on, Original when it has no
            other; null while storage backends are off, and on a server
            without Healdan's storage module
          oneOf:
            - $ref: '#/components/schemas/StoreBackend'
            - type: 'null'
        pending:
          description: Its files that haven't reached its backend, and those the mover gave up on; null as `backend` is
          oneOf:
            - $ref: '#/components/schemas/PendingFiles'
            - type: 'null'
    StoreReader:
      type: object
      description: A group, or a person, that can see a Store
      additionalProperties: false
      required: [groupId, name, person]
      properties:
        groupId:
          type: integer
          format: int64
          description: The group, or the person's own group, as `AccessRow` gives it
        name:
          type: string
          description: The group's name, or the person's first and last name (the username when both are blank)
        person:
          type: boolean
          description: True for a person's own group
    DeletedStore:
      type: object
      description: A Store in the Trash
      additionalProperties: false
      required: [id, name, trashItemId, state, matters, deletedAt, deletedBy, removedAt, destroyAfter]
      properties:
        id:
          type: integer
          format: int64
          description: The Store's id, which is its folder's, as `POST /v1/admin/stores/{id}/restore` takes it
        name:
          type: string
          description: Its name, as it was deleted
        trashItemId:
          type: integer
          format: int64
          description: The Trash item that holds it, which its delete made
        state:
          type: string
          description: |
            `deleted`, in its Trash; `removed`, taken out of the Trash:
            what's in it is destroyed for good after `destroyAfter`, while
            the Store itself and its matters' own folders never are, so it
            stays listed and an administrator can still restore it, empty
          enum: [deleted, removed]
        matters:
          type: integer
          format: int64
          minimum: 0
          description: How many matters went to the Trash with it, and are in its item still
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          description: |
            Who deleted it; null when the server's data doesn't say, or that
            person's account has been deleted
          oneOf:
            - $ref: '#/components/schemas/PersonBrief'
            - type: 'null'
        removedAt:
          type: [string, 'null']
          format: date-time
          description: When it was removed from the Trash; null unless `removed`
        destroyAfter:
          type: [string, 'null']
          format: date-time
          description: |
            The night the server destroys what's in it for good, once it has
            been removed for the days the administrators set, never the Store
            itself; null unless `removed`
    StoreBackendChange:
      type: object
      description: The storage backend a Store keeps its files on from then on
      additionalProperties: false
      required: [backendId]
      properties:
        backendId:
          type: integer
          format: int64
          description: The backend, one offered to Stores; Original's id is 1
    StoreStorage:
      type: object
      description: The storage backend a Store keeps its files on, and its files
      additionalProperties: false
      required: [storeId, 'on', backend, files, bytes, pending, switchPreview]
      properties:
        storeId:
          type: integer
          format: int64
        'on':
          type: boolean
          description: Whether this server keeps its files through storage backends; false while they're off
        backend:
          description: Its backend, Original when it has no other; null while storage backends are off
          oneOf:
            - $ref: '#/components/schemas/StoreBackend'
            - type: 'null'
        files:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of its files are recorded, on whichever backend each is
            now; 0 while storage backends are off
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
        pending:
          $ref: '#/components/schemas/PendingFiles'
        switchPreview:
          description: |
            With `backendId`, what would move were the Store given that
            backend; null without it
          oneOf:
            - $ref: '#/components/schemas/SwitchPreview'
            - type: 'null'
    SwitchPreview:
      type: object
      description: How much would move, were a Store given another backend
      additionalProperties: false
      required: [backendId, files, bytes]
      properties:
        backendId:
          type: integer
          format: int64
          description: The backend asked about
        files:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of the Store's files would move to it, those not on it
            now; none when nothing would, and the switch then takes effect at
            once
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
    PendingFiles:
      type: object
      description: Files that haven't reached their Store's backend yet, and those the mover gave up on
      additionalProperties: false
      required: [waiting, waitingBytes, stuck]
      properties:
        waiting:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many files wait to move to their Store's backend: after the
            Store was given another, a matter moved in from another Store, or
            saves still to be uploaded
        waitingBytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
        stuck:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many files the mover gave up on, after ten failed tries in a
            row: they stay where they are, and still open, until they're
            retried
    StuckFile:
      type: object
      description: A file the mover gave up on
      additionalProperties: false
      required: [docId, fileName, resource, attempts, lastError]
      properties:
        docId:
          type: integer
          format: int64
          description: "LogicalDOC's internal id of the document, not its doc #"
        fileName:
          type: [string, 'null']
          description: The document's file name; null when the document can't be found
        resource:
          type: string
          description: |
            Which of the document's files it is: a version's own file by its
            version, such as `1.2`, and a file made from it after that, such
            as `1.2-thumb.png` for its thumbnail or `1.2-conversion.pdf` for
            its preview
          examples: ['1.2', 1.2-thumb.png]
        attempts:
          type: integer
          minimum: 0
          description: How many times the mover has tried it
        lastError:
          type: [string, 'null']
          description: Why its last try failed, in English
    BackendOverview:
      type: object
      description: The storage backends, and the files with no Store
      additionalProperties: false
      required: ['on', backends, otherFiles]
      properties:
        'on':
          type: boolean
          description: |
            Whether this server keeps its files through storage backends;
            false when it keeps them in LogicalDOC's own store, and then
            nothing here can change
        backends:
          type: array
          description: Original first, then the others in the order they were added; none while storage backends are off
          items:
            $ref: '#/components/schemas/Backend'
        otherFiles:
          $ref: '#/components/schemas/PendingFiles'
          description: |
            The files with no Store, such as a document's saved before it had
            a folder, the Storage tab's Other Files, which have no backend to
            choose; all 0 while storage backends are off
    Backend:
      type: object
      description: |
        A storage backend, as its page and its Edit window show it. Its S3
        secret is never answered, only whether one is stored, nor its
        recovery key.
      additionalProperties: false
      required: [id, name, kind, original, path, endpoint, region, bucket, prefix, pathStyle, accessKey, hasSecret,
        encrypted, keyConfirmed, offered, inUse, files, bytes, status, error, since, keyLastShown, keyLastShownBy,
        stores, storesInTrash]
      properties:
        id:
          type: integer
          format: int64
          description: Its id; Original's is 1
        name:
          type: string
          description: Its own name, at most 100 characters, which no other backend has in any case
        kind:
          type: string
          description: '`local`, a folder, or `s3`, a bucket at an S3 service'
          enum: [local, s3]
        original:
          type: boolean
          description: |
            True for Original, the folder the server has always kept files in,
            which every Store keeps its files on until it's given another
        path:
          type: [string, 'null']
          description: |
            A folder's whole path in the server's container, such as
            `/mnt/archive`; Original's comes from the server's configuration
            and can't change here. Null for S3
          examples: [/mnt/archive]
        endpoint:
          type: [string, 'null']
          description: |
            S3's endpoint, its scheme, host and port only; null for a folder,
            and for an S3 endpoint stored that can't be read as an address
            with a host
          examples: ['https://s3.eu-west-1.wasabisys.com']
        region:
          type: [string, 'null']
          description: S3's region; null for a folder
          examples: [eu-west-1]
        bucket:
          type: [string, 'null']
          description: S3's bucket; null for a folder
        prefix:
          type: [string, 'null']
          description: S3's folder in the bucket, as kept, ending in `/`, or empty for none; null for a folder
          examples: [healdan/]
        pathStyle:
          type: boolean
          description: |
            S3's path-style addressing, the bucket in the address's path
            rather than its host name; false for a folder
        accessKey:
          type: [string, 'null']
          description: S3's access key ID, as the Storage tab shows it; null for a folder. The secret is never answered
        hasSecret:
          type: boolean
          description: |
            True when an S3 secret is stored that the server can read; false
            for a folder, and when the stored one can't be read, as after a
            new secret key, so it's typed again
        encrypted:
          type: boolean
          description: Whether its files are encrypted, as its add chose; it never changes, and Original never is
        keyConfirmed:
          type: boolean
          description: |
            For an encrypted backend, whether its recovery key's last group
            was typed back, which shows it was saved; false otherwise
        offered:
          type: boolean
          description: |
            Whether a Store can be given it: true but for an encrypted backend
            whose recovery key isn't confirmed
        inUse:
          type: boolean
          description: |
            True while a file is recorded or a copy held on it: its bucket,
            prefix or path can't change then
        files:
          type: integer
          format: int64
          minimum: 0
          description: How many files are recorded on it
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
        status:
          $ref: '#/components/schemas/BackendStatus'
        error:
          type: [string, 'null']
          description: |
            Why it's failing, in English, naming it as "this backend"; null
            unless `status` is `unreachable` or `failing`
        since:
          type: [string, 'null']
          format: date-time
          description: When it entered its status, such as since when it has been failing; null while `unchecked`
        keyLastShown:
          type: [string, 'null']
          format: date-time
          description: |
            When its recovery key was last shown, at its add or since; null if
            never, and for one not encrypted
        keyLastShownBy:
          type: [string, 'null']
          description: The username of whom it was last shown to; null as `keyLastShown` is
        stores:
          type: array
          description: |
            The names of the Stores that keep their files on it, by name,
            ignoring case: for Original, every Store with no other backend.
            The Templates Store isn't among them
          items:
            type: string
        storesInTrash:
          type: array
          description: |
            The names of the Stores in the Trash, deleted or removed and not
            destroyed yet, that keep their files on it, by name, ignoring
            case: for Original, every such Store with no other backend. Their
            files stay on it while they're in the Trash, as a restore brings
            them back, so it can't be removed, nor its bucket, prefix or path
            changed, until each is restored, given another backend and deleted
            again. The Templates Store is never among them
          items:
            type: string
    BackendStatus:
      type: string
      description: |
        A backend's status, from its last use, Test or check:

        - `unchecked`: not checked since the server started, which checks
          every backend as it starts;
        - `ok`: its last check passed;
        - `unreachable`: failing because it can't be reached, an outage,
          whose moves pause until it's back;
        - `failing`: failing for another reason, such as its marker missing
          or its credentials refused.
      enum: [unchecked, ok, unreachable, failing]
    NewBackend:
      type: object
      description: |
        A new backend: a folder's `path`, or an S3 bucket's settings. Members
        of the other kind are left out or null.
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          description: |
            `local`, a folder, or `s3`, a bucket at an S3 service; any other
            value is `422 validation` (`invalid`), not `400`
          enum: [local, s3]
        name:
          type: string
          description: Its own name, at most 100 characters
        path:
          type: [string, 'null']
          description: A folder's whole path in the server's container, from `/`
          examples: [/mnt/archive]
        endpoint:
          type: [string, 'null']
          description: |
            S3: the service's address for the bucket's region, `https://`, or
            `http://` only for an S3 server whose every address is on a
            private network, with path style
          examples: ['https://s3.eu-west-1.wasabisys.com']
        region:
          type: [string, 'null']
        bucket:
          type: [string, 'null']
        prefix:
          type: [string, 'null']
          description: |
            S3, optional, a folder in the bucket, to which Healdan adds a `/`;
            null, blank or left out for none
        pathStyle:
          type: [boolean, 'null']
          description: S3, the bucket in the address's path rather than its host name; false when null or left out
        accessKey:
          type: [string, 'null']
        secret:
          type: [string, 'null']
          description: S3's secret, never answered or shown again
        encrypted:
          type: [boolean, 'null']
          description: |
            Whether its files are encrypted, chosen now and never changed;
            null or left out for the kind's own choice, true for S3 and false
            for a folder
        newKey:
          type: [boolean, 'null']
          description: |
            True to make Healdan's secret key file anew, after
            `secret-key-missing`, which leaves the values sealed with the
            missing one to be entered again; false, null or left out otherwise
    BackendTrial:
      type: object
      description: |
        Settings to test, as the add or the edit window holds them, any member
        left out or null. With `id`, they're that backend's, being edited.
      additionalProperties: false
      properties:
        id:
          type: [integer, 'null']
          format: int64
          description: The backend being edited; null or left out for one being added
        kind:
          type: [string, 'null']
          description: As `NewBackend.kind`; another value, or none, is one of the test's problems
          enum: [local, s3, null]
        name:
          type: [string, 'null']
        path:
          type: [string, 'null']
        endpoint:
          type: [string, 'null']
        region:
          type: [string, 'null']
        bucket:
          type: [string, 'null']
        prefix:
          type: [string, 'null']
        pathStyle:
          type: [boolean, 'null']
        accessKey:
          type: [string, 'null']
        secret:
          type: [string, 'null']
          description: As typed; with `id`, null or blank for the stored one
        encrypted:
          type: [boolean, 'null']
    BackendChange:
      type: object
      description: |
        A backend's new settings, each member left out staying as it is. Its
        kind and whether it's encrypted never change: those members are
        `422 validation` (`not-editable`), as is every member but `name` for
        Original.
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
          description: At most 100 characters; null or blank is `422 validation` (`required`)
        path:
          type: [string, 'null']
          description: |
            A folder's new path, only while it's not `inUse` and no Store keeps
            its files there, a Store in the Trash included. On a folder, null
            or blank is `422 validation` (`required`); on S3 or Original, null
            counts as left out
        endpoint:
          type: [string, 'null']
          description: |
            S3's new endpoint. On S3, null or blank is `422 validation`
            (`required`); on a folder or Original, null counts as left out
        region:
          type: [string, 'null']
          description: |
            S3's new region. On S3, null or blank is `422 validation`
            (`required`); on a folder or Original, null counts as left out
        bucket:
          type: [string, 'null']
          description: |
            A new bucket, only while it's not `inUse` and no Store keeps its
            files there, a Store in the Trash included. On S3, null or blank
            is `422 validation` (`required`); on a folder or Original, null
            counts as left out
        prefix:
          type: [string, 'null']
          description: |
            A new prefix, only while it's not `inUse` and no Store keeps its
            files there, a Store in the Trash included; null or blank for none
        pathStyle:
          type: [boolean, 'null']
          description: S3's path-style addressing; null or left out keeps it as it is
        accessKey:
          type: [string, 'null']
          description: |
            S3's new access key ID. On S3, null or blank is `422 validation`
            (`required`); on a folder or Original, null counts as left out
        secret:
          type: [string, 'null']
          description: A new S3 secret; null, blank or left out keeps the stored one
        newKey:
          type: [boolean, 'null']
          description: |
            As `NewBackend.newKey`, with a new `secret`; nothing without one,
            and false when null or left out
    AddedBackend:
      type: object
      description: A backend just added, and an encrypted one's recovery key
      additionalProperties: false
      required: [backend, recoveryKey]
      properties:
        backend:
          $ref: '#/components/schemas/Backend'
        recoveryKey:
          description: |
            An encrypted backend's recovery key, shown now and recorded as
            shown; null for one not encrypted
          oneOf:
            - $ref: '#/components/schemas/RecoveryKeyText'
            - type: 'null'
    RecoveryKeyText:
      type: string
      description: |
        An encrypted backend's key written out: 52 characters in 13 groups of
        four, with a space between, using no I, L, O or U. Lose both it and
        the backend's key file, and the backend's files can't be read
      pattern: '^[0-9A-HJKMNP-TV-Z]{4}( [0-9A-HJKMNP-TV-Z]{4}){12}$'
    RecoveryKey:
      type: object
      description: An encrypted backend's recovery key, as Show Recovery Key answers it
      additionalProperties: false
      required: [recoveryKey]
      properties:
        recoveryKey:
          $ref: '#/components/schemas/RecoveryKeyText'
    RecoveryKeyConfirmation:
      type: object
      description: A recovery key's last group, typed back
      additionalProperties: false
      required: [lastGroup]
      properties:
        lastGroup:
          type: string
          description: Its last four characters, as typed; any case, spaces and hyphens ignored
    RecoveryKeyEntry:
      type: object
      description: A recovery key, as typed, to put a backend's key file back
      additionalProperties: false
      required: [recoveryKey]
      properties:
        recoveryKey:
          type: string
          description: As typed or pasted; any case, spaces and hyphens ignored
    BackendTestResult:
      type: object
      description: What a test found
      additionalProperties: false
      required: [problems]
      properties:
        problems:
          type: array
          description: Each problem it found, a sentence in English the app shows as it is; empty when it passed
          items:
            type: string
    KeyEvent:
      type: object
      description: A showing or an entering of a backend's recovery key
      additionalProperties: false
      required: [event, at, userId, username]
      properties:
        event:
          type: string
          description: '`shown`, shown to an administrator; `entered`, typed in to put its key file back'
          enum: [shown, entered]
        at:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
          description: The administrator's user id
        username:
          type: string
          description: The administrator's username then
    StorageSettings:
      type: object
      description: The storage settings, and each one's limits
      additionalProperties: false
      required: ['on', holdDays, cacheGb, transfers, limits]
      properties:
        'on':
          type: boolean
          description: Whether this server keeps its files through storage backends; false while they're off
        holdDays:
          type: integer
          minimum: 1
          description: |
            The holding period, how many days an old copy is held after a move
            or a delete before the purge deletes it
        cacheGb:
          type: integer
          minimum: 1
          description: The read cache's size, in GB, for copies of S3 backends' files on the server
        transfers:
          type: integer
          minimum: 1
          description: Parallel transfers, how many files move between backends at once
        limits:
          $ref: '#/components/schemas/StorageLimits'
    StorageLimits:
      type: object
      description: Each storage setting's limits, as the server holds them
      additionalProperties: false
      required: [holdDays, cacheGb, transfers]
      properties:
        holdDays:
          $ref: '#/components/schemas/SettingRange'
        cacheGb:
          $ref: '#/components/schemas/SettingRange'
        transfers:
          $ref: '#/components/schemas/SettingRange'
    SettingRange:
      type: object
      description: The lowest and highest values a setting takes, both included
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 1
          description: Always 1
        max:
          type: integer
          minimum: 1
    StorageSettingsChange:
      type: object
      description: All three storage settings
      additionalProperties: false
      required: [holdDays, cacheGb, transfers]
      properties:
        holdDays:
          type: integer
          description: Days, from 1 to `limits.holdDays.max`
        cacheGb:
          type: integer
          description: GB, from 1 to `limits.cacheGb.max`
        transfers:
          type: integer
          description: From 1 to `limits.transfers.max`
    UserStatus:
      type: string
      description: |
        Whether the person can sign in: `active`; `disabled`, an account
        that can't sign in until it's enabled; or `blocked`, an enabled
        account that can't sign in until `blockedUntil`, or until its block
        is cleared, after too many failed sign-ins under its username. A
        disabled account is `disabled`, blocked or not.
      enum: ['active', 'disabled', 'blocked']
    ProviderBrief:
      type: object
      description: A sign-in provider named in another object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          description: Its id, as the Classic Interface's Sign-In tab and `/api/signin/<id>` name it
          examples: [entra]
        label:
          type: string
          description: The label of its button; its id once the provider has been removed
          examples: [Sign In with Microsoft]
    SignsInWith:
      type: object
      description: How a person signs in
      additionalProperties: false
      required: [kind, provider]
      properties:
        kind:
          type: string
          enum: ['password', 'provider']
          description: |
            `provider` for an account linked to a sign-in provider, which
            signs in there and has no password in Healdan; `password` for
            any other
        provider:
          description: The provider the account is linked to; null for `password`
          oneOf:
            - $ref: '#/components/schemas/ProviderBrief'
            - type: 'null'
    GroupBrief:
      type: object
      description: A group named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    UserRow:
      type: object
      description: A person, as the Users list shows them
      additionalProperties: false
      required: [id, username, name, firstName, lastName, email, groups, signsInWith, status, blockedUntil,
        lastSignIn, devices, readOnly, admin]
      properties:
        id:
          type: integer
          format: int64
          description: The user's id
        username:
          type: string
        name:
          type: string
          description: The first and last name; the username when both are blank
        firstName:
          type: [string, 'null']
          description: Null for none, a blank one included
        lastName:
          type: [string, 'null']
          description: Null for none, a blank one included
        email:
          type: [string, 'null']
          description: Their email address; null for none, a blank one included
        groups:
          type: array
          description: |
            The groups they're in, by name, ignoring case: those
            `GET /v1/admin/groups` lists, so not their own group
          items:
            $ref: '#/components/schemas/GroupBrief'
        signsInWith:
          $ref: '#/components/schemas/SignsInWith'
        status:
          $ref: '#/components/schemas/UserStatus'
        blockedUntil:
          type: [string, 'null']
          format: date-time
          description: When the block on their username ends of itself; null unless `status` is `blocked`
        lastSignIn:
          type: [string, 'null']
          format: date-time
          description: |
            When they last signed in, on any route; null when they never
            have. An app on a device signs in again, with its token, each
            time its last session has timed out, so a device in use keeps it
            recent
        devices:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many device tokens of theirs still work, as
            `GET /v1/admin/users/{id}/devices` lists them
        readOnly:
          type: boolean
          description: |
            A read-only account, which is always in its own group and
            `guest`, and in no other, and which this app neither makes nor
            changes into another kind
        admin:
          type: boolean
          description: A member of `admin`, who can use this app and read every document
    UserList:
      description: A page of people
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserRow'
      unevaluatedProperties: false
    User:
      type: object
      description: A person, for their page
      additionalProperties: false
      required: [id, username, name, firstName, lastName, email, groups, signsInWith, status, blockedUntil,
        lastSignIn, devices, readOnly, admin, language, timeZone, created, passwordChanged, mustChangePassword,
        checkedOut, mattersOwned, refusals]
      properties:
        id:
          type: integer
          format: int64
          description: The user's id
        username:
          type: string
        name:
          type: string
          description: As in `UserRow`
        firstName:
          type: [string, 'null']
          description: As in `UserRow`
        lastName:
          type: [string, 'null']
          description: As in `UserRow`
        email:
          type: [string, 'null']
          description: As in `UserRow`
        groups:
          type: array
          description: As in `UserRow`
          items:
            $ref: '#/components/schemas/GroupBrief'
        signsInWith:
          $ref: '#/components/schemas/SignsInWith'
        status:
          $ref: '#/components/schemas/UserStatus'
        blockedUntil:
          type: [string, 'null']
          format: date-time
          description: As in `UserRow`
        lastSignIn:
          type: [string, 'null']
          format: date-time
          description: As in `UserRow`
        devices:
          type: integer
          format: int64
          minimum: 0
          description: As in `UserRow`
        readOnly:
          type: boolean
          description: As in `UserRow`
        admin:
          type: boolean
          description: As in `UserRow`
        language:
          type: string
          description: |
            The code of the language Healdan speaks to them in; the options'
            `defaultLanguage` when the account has none. It may be one the
            options don't offer, given elsewhere or since turned off, which
            Edit accepts as it is
          examples: [en]
        timeZone:
          type: [string, 'null']
          description: |
            Their time zone; null for none. It may be one the options'
            `timeZones` leave out, given elsewhere, which Edit accepts as it
            is
          examples: [Europe/London]
        created:
          type: string
          format: date-time
          description: When the account was made
        passwordChanged:
          type: [string, 'null']
          format: date-time
          description: |
            When its password was last set, by anyone; null for an account
            linked to a sign-in provider, which has no password in Healdan
        mustChangePassword:
          type: boolean
          description: |
            True while its password must be changed at its next sign-in, as
            the sign-in page asks for: a password marked so, as New User's and
            Reset Password's temporary ones are, or one that has expired by
            age under the server's password settings. False for an account
            linked to a sign-in provider
        checkedOut:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many documents they have checked out, as
            `GET /v1/admin/users/{id}/checkouts` lists them
        mattersOwned:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many live matters they own, not deleted or in the Trash, as
            `GET /v1/admin/matters?ownerId=` lists them
        refusals:
          $ref: '#/components/schemas/UserRefusals'
    UserRefusals:
      type: object
      description: |
        The sentence the server would refuse each of a person's page's
        actions with, read at the request, so the page can say why before
        it's tried; null when the server wouldn't refuse it, as for an
        action that would change nothing, which is answered as it is. A
        change made meanwhile can make an action refused all the same, with
        its sentence.
      additionalProperties: false
      required: [disable, enable, resetPassword, leaveAdmin]
      properties:
        disable:
          type: [string, 'null']
          description: '`POST /v1/admin/users/{id}/disable`''s, such as for the `admin` account or your own'
        enable:
          type: [string, 'null']
          description: '`POST /v1/admin/users/{id}/enable`''s'
        resetPassword:
          type: [string, 'null']
          description: |
            `POST /v1/admin/users/{id}/reset-password`'s, such as for an
            account linked to a sign-in provider or your own
        leaveAdmin:
          type: [string, 'null']
          description: |
            Taking them out of `admin`, by
            `PUT /v1/admin/users/{id}/groups` or
            `DELETE /v1/admin/groups/{id}/members/{userId}`, such as for the
            `admin` account, your own or the last enabled administrator;
            null too when they aren't in it
    UserOptions:
      type: object
      description: What the forms that add and edit a person offer
      additionalProperties: false
      required: [languages, defaultLanguage, timeZones, providers, outgoingEmail]
      properties:
        languages:
          type: array
          description: The languages a person can be given, by name
          items:
            $ref: '#/components/schemas/LanguageOption'
        defaultLanguage:
          type: string
          description: The code of the language New User fills in, one of `languages`
          examples: [en]
        timeZones:
          type: array
          description: |
            The time zones a person can be given: the IANA region names the
            server knows, as `Europe/London`, and `UTC`, sorted, leaving out
            older forms such as `PST` and the `SystemV/` names
          items:
            type: string
            examples: [Europe/London]
        providers:
          type: array
          description: |
            The sign-in providers that are on, in the order of their buttons;
            empty when none is
          items:
            $ref: '#/components/schemas/ProviderBrief'
        outgoingEmail:
          type: boolean
          description: |
            Whether outgoing email is set up, so a temporary password can be
            emailed: false while the server has no mail server set up, or
            keeps every email from it
    LanguageOption:
      type: object
      description: A language a person can be given
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          examples: [en, en_US]
        name:
          type: string
          description: Its name, in English
          examples: [English, English (United States)]
    NewUser:
      type: object
      description: A new person, with a password account
      additionalProperties: false
      required: [username, firstName, lastName, emailPassword]
      properties:
        username:
          type: string
          description: What they sign in with, at most 255 characters, which this app never changes
        firstName:
          type: string
          description: At most 255 characters
        lastName:
          type: string
          description: At most 255 characters
        email:
          type: [string, 'null']
          description: Their email address, at most 255 characters; null, blank or left out for none
        language:
          type: [string, 'null']
          description: |
            One of the options' `languages`, by its code; null, blank or left
            out for the options' `defaultLanguage`
        timeZone:
          type: [string, 'null']
          description: One of the options' `timeZones`; null, blank or left out for none
        groupIds:
          type: array
          description: |
            The groups they're in besides Everyone, which every account but a
            read-only one is in; left out for none. Adding someone to `admin`
            lets them use this app and read every document: the app asks
            first
          uniqueItems: true
          items:
            type: integer
            format: int64
        emailPassword:
          type: boolean
          description: |
            True to email them the temporary password; false to have it shown
            once, in the answer, for the administrator to give them
    CreatedUser:
      type: object
      description: A person just added, and their temporary password unless it was emailed
      additionalProperties: false
      required: [user, temporaryPassword, emailed, notEmailed]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporaryPassword:
          type: [string, 'null']
          description: |
            The temporary password, which must be changed at the first
            sign-in, given in this answer only; null when it was emailed
        emailed:
          type: boolean
          description: |
            True when it was emailed, as `emailPassword` asked; false when
            it's `temporaryPassword` instead: not asked, or it couldn't be
            emailed, as `adminCreateUser` says
        notEmailed:
          type: [string, 'null']
          enum: [not-asked, not-set-up, no-email, not-taken, null]
          description: |
            Why it's `temporaryPassword` instead of an email: `not-asked`;
            `not-set-up`, outgoing email isn't set up or the server doesn't
            send now; `no-email`, the person has no email address; or
            `not-taken`, the email couldn't be sent or the mail server didn't
            take it in time, so it may still arrive. Null when it was emailed
    UserChange:
      type: object
      description: |
        What the app's Edit changes, each member left out staying as it is.
        A username never changes here: `username` is `422 validation`
        (`not-editable`).
      additionalProperties: false
      properties:
        firstName:
          type: [string, 'null']
          description: |
            At most 255 characters; null or blank is `422 validation`
            (`required`), unless the person's first name is blank now, which then
            stays blank
        lastName:
          type: [string, 'null']
          description: |
            At most 255 characters; null or blank is `422 validation`
            (`required`), unless the person's last name is blank now, which then
            stays blank
        email:
          type: [string, 'null']
          description: At most 255 characters; null or blank for none
        language:
          type: [string, 'null']
          description: |
            One of the options' `languages`, by its code, or the person's
            current one; null or blank for the options' `defaultLanguage`
        timeZone:
          type: [string, 'null']
          description: One of the options' `timeZones`, or the person's current one; null or blank for none
    PasswordReset:
      type: object
      description: How a reset's temporary password reaches the person
      additionalProperties: false
      required: [emailPassword]
      properties:
        emailPassword:
          type: boolean
          description: As in `NewUser`
    TemporaryPassword:
      type: object
      description: A reset's temporary password, unless it was emailed
      additionalProperties: false
      required: [temporaryPassword, emailed, notEmailed]
      properties:
        temporaryPassword:
          type: [string, 'null']
          description: |
            The temporary password, which must be changed at the next
            sign-in, given in this answer only; null when it was emailed
        emailed:
          type: boolean
          description: As in `CreatedUser`
        notEmailed:
          type: [string, 'null']
          enum: [not-asked, not-set-up, no-email, not-taken, null]
          description: As in `CreatedUser`
    SignedOut:
      type: object
      description: What Sign Out Everywhere signed out
      additionalProperties: false
      required: [sessions, devices]
      properties:
        sessions:
          type: integer
          format: int64
          minimum: 0
          description: How many open sessions closed, on this server
        devices:
          type: integer
          format: int64
          minimum: 0
          description: How many device tokens were revoked
    UserGroups:
      type: object
      description: The groups a person is in
      additionalProperties: false
      required: [groupIds]
      properties:
        groupIds:
          type: array
          description: |
            Every group they're to be in, as `GET /v1/admin/groups` lists
            them; Everyone is kept for an account that isn't read-only, and
            `guest` for a read-only one, named or not
          uniqueItems: true
          items:
            type: integer
            format: int64
    UserDevice:
      type: object
      description: A device a person is signed in on, by the token it signs in with
      additionalProperties: false
      required: [id, name, device, provider, created, lastUsed, expires]
      properties:
        id:
          type: integer
          format: int64
          description: The token's id, which `DELETE /v1/admin/users/{id}/devices/{tokenId}` takes
        name:
          type: string
          description: What its sign-in called it
          examples: [Healdan Helper on MacBook]
        device:
          type: [string, 'null']
          description: |
            The computer's device id, the same on every sign-in from it, so
            the tokens of one computer can be told apart from another's; null
            when its sign-in named none
        provider:
          description: The sign-in provider it signed in through; null for a password sign-in
          oneOf:
            - $ref: '#/components/schemas/ProviderBrief'
            - type: 'null'
        created:
          type: string
          format: date-time
          description: When it signed in
        lastUsed:
          type: string
          format: date-time
          description: To within a few minutes
        expires:
          type: string
          format: date-time
          description: When it stops working of itself, unless it's revoked first
    MatterBrief:
      type: object
      description: A matter named in another object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id:
          type: integer
          format: int64
          description: The matter's id, not its folder's
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
          description: Its own name, without its number
    UserCheckout:
      type: object
      description: A document a person has checked out
      additionalProperties: false
      required: [docNumber, fileVersion, title, matter, since, device, deviceId, app]
      properties:
        docNumber:
          type: integer
          format: int64
          description: The document's number, which the User app's links take
        fileVersion:
          type: string
          description: |
            The version its file was last saved as, as the User app's Version
            column shows it: `DocumentView`'s `fileVersion` in `openapi.yaml`
          examples: ['2.1']
        title:
          type: string
          description: Its name, as the User app's Title column shows it
        matter:
          description: The matter it's in; null for none
          oneOf:
            - $ref: '#/components/schemas/MatterBrief'
            - type: 'null'
        since:
          type: [string, 'null']
          format: date-time
          description: |
            When it was checked out, as the public API's `hold.since` says: a
            save that keeps it checked out moves it on. Null when the
            server's data doesn't say
        device:
          type: [string, 'null']
          description: |
            The computer the check-out is held on, named as the token it last
            wrote through is; null when no device holds it, as for a
            check-out from the web page
          examples: [Healdan Helper on MacBook]
        deviceId:
          type: [string, 'null']
          description: |
            That computer's id, which the public API's
            `DELETE /v1/documents/{n}/checkout` takes as `elsewhere`, as its
            holder's own release of it must; null when no device holds it
        app:
          type: [string, 'null']
          description: The app its check-out named; null when no device holds it, or it named none
          examples: [LibreOffice]
    Group:
      type: object
      description: |
        A group, not a person's own, for the Groups list and the forms that
        name one, which read `id`, `name` and `description`
      additionalProperties: false
      required: [id, name, description, members, fixed, admin, mappedBy]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: [string, 'null']
          description: Its description; null for none, an empty one included
        members:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many people are in it, as `GET /v1/admin/groups/{id}/members`
            lists them: disabled and read-only accounts included, not deleted
            or system accounts
        fixed:
          type: boolean
          description: |
            `admin`, `guest`, `publisher` or Everyone, which is never renamed
            or deleted
        admin:
          type: boolean
          description: It's the `admin` group, whose members can use this app and read every document
        mappedBy:
          type: array
          description: |
            The labels of the sign-in providers whose group map names it, by
            label, ignoring case; empty for none. A member who signs in
            through one of them is put in it, or taken out, at each sign-in
            there, and a group a map names isn't deleted
          items:
            type: string
    GroupList:
      description: A page of groups
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Group'
      unevaluatedProperties: false
    GroupDetail:
      type: object
      description: A group, for its page
      additionalProperties: false
      required: [id, name, description, members, fixed, admin, mappedBy, folders]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: [string, 'null']
          description: As in `Group`
        members:
          type: integer
          format: int64
          minimum: 0
          description: As in `Group`
        fixed:
          type: boolean
          description: As in `Group`
        admin:
          type: boolean
          description: As in `Group`
        mappedBy:
          type: array
          description: As in `Group`
          items:
            type: string
        folders:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many folders and search folders, not in the Trash, give it a
            permission of their own: Stores and workspace templates' folders
            among them
    NewGroup:
      type: object
      description: A new group
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: At most 200 characters
        description:
          type: [string, 'null']
          description: At most 255 characters; null, blank or left out for none
    GroupChange:
      type: object
      description: A group's new name or description, each member left out staying as it is
      additionalProperties: false
      properties:
        name:
          type: string
          description: At most 200 characters; null or blank is `422 validation` (`required`)
        description:
          type: [string, 'null']
          description: At most 255 characters; null or blank for none
    GroupMember:
      type: object
      description: A person in a group
      additionalProperties: false
      required: [id, username, name, status, readOnly]
      properties:
        id:
          type: integer
          format: int64
          description: The user's id
        username:
          type: string
        name:
          type: string
          description: As in `UserRow`
        status:
          $ref: '#/components/schemas/UserStatus'
        readOnly:
          type: boolean
          description: As in `UserRow`
    GroupMemberList:
      description: A page of a group's members
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GroupMember'
      unevaluatedProperties: false
    ErrorArea:
      type: string
      description: |
        A fault's area, from the package or class of the logger it was
        logged through: Previews, Storage, Search Index (reading documents'
        text included), Email, Sign-In, Background Jobs, and Server for
        anything else
      enum: ['Previews', 'Storage', 'Search Index', 'Email', 'Sign-In', 'Background Jobs', 'Server']
    ErrorRow:
      type: object
      description: A kind of fault, as the Errors list shows it
      additionalProperties: false
      required: [id, message, area, times, firstSeen, lastSeen, resolved]
      properties:
        id:
          type: integer
          format: int64
          description: The fault's id
        message:
          type: string
          description: |
            What Happened: its latest message, as the server logged it, but
            for the credentials of the URLs in it, taken out as the Monitoring
            tag says
        area:
          $ref: '#/components/schemas/ErrorArea'
        times:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many times it was seen in the list's window, counted by whole
            clock hours in UTC from the start of the hour the window begins in
        firstSeen:
          type: string
          format: date-time
          description: When it was first seen
        lastSeen:
          type: string
          format: date-time
          description: When it was last seen
        resolved:
          type: boolean
          description: Whether someone has marked it resolved since it was last seen
    ErrorList:
      description: A page of faults, and how many times they were seen
      allOf:
        - $ref: '#/components/schemas/Page'
        - required: [errors]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ErrorRow'
            errors:
              type: integer
              format: int64
              minimum: 0
              description: |
                How many times the faults the filters keep were seen in the
                window, every page's together: their `times` added up. With
                `total`, the faults, the heading's 14 errors of 4 kinds
      unevaluatedProperties: false
    ErrorDetail:
      type: object
      description: A fault, for its details
      additionalProperties: false
      required: [id, level, area, logger, message, stack, documents, total, firstSeen, lastSeen, resolved,
        resolvedBy, resolvedAt, log]
      properties:
        id:
          type: integer
          format: int64
          description: The fault's id
        level:
          type: string
          description: The level it was first logged at
          enum: [ERROR, FATAL]
        area:
          $ref: '#/components/schemas/ErrorArea'
        logger:
          type: string
          description: The name of the logger it was first logged through
          examples: [com.logicaldoc.healdan.preview.PreviewWorker]
        message:
          type: string
          description: Its latest message, as `ErrorRow.message` gives it
        stack:
          type: [string, 'null']
          description: |
            Its latest stack trace, as the server logged it, but for the
            credentials of the URLs in it, taken out as the Monitoring tag
            says; null when it was logged with none
        documents:
          type: array
          description: The documents its latest message names, in the order it names them
          items:
            $ref: '#/components/schemas/ErrorDocument'
        total:
          type: integer
          format: int64
          minimum: 1
          description: How many times it was seen in all
        firstSeen:
          type: string
          format: date-time
          description: When it was first seen
        lastSeen:
          type: string
          format: date-time
          description: When it was last seen
        resolved:
          type: boolean
          description: Whether someone has marked it resolved since it was last seen
        resolvedBy:
          type: [string, 'null']
          description: The username of who marked it resolved; null unless `resolved`
        resolvedAt:
          type: [string, 'null']
          format: date-time
          description: When; null unless `resolved`
        log:
          type: [string, 'null']
          description: |
            The log its logger writes to, by its name, as
            `GET /v1/admin/logs` lists it: `DMS`, the main log, unless the
            logger has one of its own; null when no log listed holds its
            lines
          examples: [DMS, IndexerTask]
    ErrorDocument:
      type: object
      description: A document a fault's message names
      additionalProperties: false
      required: [id, docNumber, fileName]
      properties:
        id:
          type: integer
          format: int64
          description: "LogicalDOC's internal id of the document, as the message names it, not its doc #"
        docNumber:
          type: [integer, 'null']
          format: int64
          description: "Its doc #; null when no document has that id now, or the document has no doc #"
        fileName:
          type: [string, 'null']
          description: Its file name; null when no document has that id now
    LogInfo:
      type: object
      description: One of the server's logs
      additionalProperties: false
      required: [name, label, size, modified]
      properties:
        name:
          type: string
          description: Its appender's name, which the log's paths take
          pattern: '^[^/\\]*[^/\\.][^/\\]*$'
          examples: [DMS, IndexerTask]
        label:
          type: string
          description: |
            Its name as the Server Log's menu shows it: Main Log for `DMS`;
            for the log of one of LogicalDOC's tasks, which its appender is
            named after, the task's `label` as `GET /v1/admin/jobs` gives
            it; and for any other, its appender's name
          examples: [Main Log, Indexer]
        size:
          type: integer
          format: int64
          minimum: 0
          description: |
            The size of its current file and the files it rolled over to,
            together, in bytes; 0 when it has none
        modified:
          type: [string, 'null']
          format: date-time
          description: When its current file last changed; null when the file isn't there
    LogLines:
      type: object
      description: Entries of a log, and where they were read from
      additionalProperties: false
      required: [lines, before, after, atStart, atEnd, rolled]
      properties:
        lines:
          type: array
          description: The entries, in the file's order, oldest first
          maxItems: 200
          items:
            $ref: '#/components/schemas/LogLine'
        before:
          type: string
          description: |
            Where this read began, as a position: the start of the earliest
            entry it looked at, kept or not, or of its earliest line when it
            found no entry's start. Send it as `before` for the entries before
            these.
        after:
          type: string
          description: |
            Where this read ended, as a position: when it stopped at 200
            entries, the start of the entry after the last it gave; when it
            stopped at the most it looks through, inside an entry that isn't
            the first it read, the start of that entry, which the next read
            gives whole; otherwise just past the last whole line it looked
            at, the end of the current file when it got there. Send it as
            `after` for the entries after these, as they're written.
        atStart:
          type: boolean
          description: |
            Whether the read reached the start of the oldest file there is,
            so the log holds no older entries
        atEnd:
          type: boolean
          description: |
            Whether the read reached the end of the current file as it was
            then, so the log held no newer entries
        rolled:
          type: boolean
          description: |
            Whether the `after` sent named a file that has rolled over since,
            so the entries are the current file's from its start; false for
            a read with `before`, or with neither
    LogLine:
      type: object
      description: An entry of a log
      additionalProperties: false
      required: [position, time, level, source, message, continuation]
      properties:
        position:
          type: string
          description: |
            Where its first line starts in the log, as a position, which no
            other entry of the log has, so a client can tell entries apart by
            it
        time:
          type: [string, 'null']
          format: date-time
          description: |
            When it was logged, which the log writes in the server's time
            zone; null for a line that starts no entry
        level:
          type: [string, 'null']
          description: |
            The level it was logged at; null for a line that starts no
            entry, and for an entry of a log that writes no level
          enum: [TRACE, DEBUG, INFO, WARN, ERROR, FATAL, null]
        source:
          type: [string, 'null']
          description: |
            Where it was logged from, as the log writes it: the class and the
            line, without spaces; null for a line that starts no entry, and
            for an entry of a log that writes no source
          examples: ['com.logicaldoc.healdan.preview.PreviewWorker:366']
        message:
          type: string
          description: |
            Its message, as the server logged it, but for the credentials of
            the URLs in it, taken out as the Monitoring tag says; for a line
            that starts no entry, the line
          maxLength: 10000
        continuation:
          type: array
          description: |
            The lines after it that start no entry, such as a stack trace's,
            each with the credentials of its URLs taken out as the Monitoring
            tag says; empty for a line that starts no entry
          items:
            type: string
            maxLength: 10000
    AuditKind:
      type: string
      description: |
        What a row of the Audit Trail is about: `sign-in`, an account's
        sign-ins, sign-outs, timed-out sessions and failed sign-ins;
        `document`, a document; `folder`, a folder; `user`, the rest of an
        account's history; `administration`, a change the administration
        record holds, or a showing or entering of a storage backend's
        recovery key
      enum: [sign-in, document, folder, user, administration]
    AuditPage:
      type: object
      description: |
        A page of the Audit Trail, and where the next one starts. It may
        hold fewer rows than asked for, even none, while `nextCursor` isn't
        null.
      additionalProperties: false
      required: [items, nextCursor, readBackTo]
      properties:
        items:
          type: array
          description: The rows, newest first
          maxItems: 200
          items:
            $ref: '#/components/schemas/AuditRow'
        nextCursor:
          type: [string, 'null']
          description: |
            Where the next page starts, for `cursor`, which holds each
            source's place and nothing a client reads; null once every
            source has been read to its end
        readBackTo:
          type: [string, 'null']
          format: date-time
          description: |
            How far back the reading has reached: every row the filters keep
            that's newer than this has been given, on this page or an
            earlier one of the same filters, so a page with fewer rows than
            asked for, or none, says nothing more was found back to it. The
            rows of the next page are this old or older. Null once every
            source has been read to its end, as `nextCursor` is
    AuditRow:
      type: object
      description: A row of the Audit Trail
      additionalProperties: false
      required: [id, when, who, kind, event, what, detail, from, docNumber, folderId, changes]
      properties:
        id:
          type: string
          description: The row's own, which no other row in the Audit Trail has, and which a client only compares
        when:
          type: string
          format: date-time
          description: When it was done
        who:
          type: [string, 'null']
          description: |
            Who did it: the person's name, as the Users list names them, read
            now; when no account has the row's user id, the person as the
            row kept them, which in LogicalDOC's history is their name at the
            time and in Healdan's records their username; null when the row
            names no one. On a `user` row, the person who made the change to
            the account, when the row names them, as a change made in this
            app does, and null when it doesn't: `detail` names the account.
            On a failed sign-in for a username no account has, null
          examples: [Sam Okafor]
        kind:
          $ref: '#/components/schemas/AuditKind'
        event:
          type: string
          description: |
            What was done, as the row keeps it: LogicalDOC's history event,
            such as `event.downloaded` or `event.user.login`; the
            administration record's action, such as `client.renamed`; or the
            storage record's, `key-shown` or `key-entered`
          examples: [event.downloaded, client.renamed]
        what:
          type: string
          description: |
            What was done, in US English, as the Audit Trail and its export
            say it, such as `Downloaded` or `Renamed a client`; `event`
            itself when Healdan has no words for it
          examples: [Downloaded, Renamed a client]
        detail:
          type: [string, 'null']
          description: |
            One line more, in English: a document's doc #, file name and
            version; a folder's path; a sign-in's client, or
            `Unknown username` for a failed sign-in for a username no account
            has, whose typed text isn't answered; an administration row's
            target. On a `user` row, the account it's about, as the
            administration record names a person, then, for an account
            created, changed, disabled, enabled or deleted, a password
            changed, an API key made, a sign-in as another account, a change
            of who can sign in as the account, or a legal notice confirmed,
            the note LogicalDOC kept with it, cut to 300 characters, as
            `Sam Okafor (sokafor): By admin in the Admin app`; for any other
            account event, such as a message received or a search, the
            account alone. Null when there's nothing more to say
          examples: ['# 10388, Skeleton Argument.docx, version 1.4',
            'Sam Okafor (sokafor): By admin in the Admin app']
        from:
          type: [string, 'null']
          description: The address it came from; null when the row keeps none
          examples: [192.0.2.12]
        docNumber:
          type: [integer, 'null']
          format: int64
          description: "A document row's doc #; null for other rows, and when the document has none"
        folderId:
          type: [integer, 'null']
          format: int64
          description: |
            The folder of a document or folder row, and the folder or search
            folder an administration row is aimed at; null for other rows
        changes:
          type: [object, 'null']
          description: |
            An administration row's changed fields, by name, in the order of
            their names, each with its old and new value, a secret's with
            neither, as the administration record keeps them; null for
            other rows, and for an administration row that changed no field
          additionalProperties:
            $ref: '#/components/schemas/AuditChange'
          examples:
            - accessKey:
                secret: true
              name:
                before: Wasabi
                after: Wasabi EU
    AuditChange:
      description: |
        A field's change: its old and new value, each null for none; or, for
        a secret, `secret` alone, as no value of it is kept
      oneOf:
        - type: object
          additionalProperties: false
          required: [before, after]
          properties:
            before:
              type: [string, 'null']
            after:
              type: [string, 'null']
        - type: object
          additionalProperties: false
          required: [secret]
          properties:
            secret:
              const: true
    Job:
      type: object
      description: A background job, as Background Jobs shows it
      additionalProperties: false
      required: [name, label, logicalDocTask, enabled, running, lastStart, lastEnd, result, error, nextRun, overdue,
        canRun, canStop, switchable, schedule]
      properties:
        name:
          type: string
          description: |
            Its name, which its paths take: one of Healdan's, lower case
            words joined by hyphens, or a LogicalDOC task's
          examples: [storage-mover, IndexerTask]
        label:
          type: string
          description: Its name as the app shows it, US English in Title Case
          examples: [Storage Mover, Indexer]
        logicalDocTask:
          type: boolean
          description: Whether it's one of LogicalDOC's scheduled tasks, not one of Healdan's jobs
        enabled:
          type: boolean
          description: |
            Whether it runs at all: a LogicalDOC task can be disabled, and one
            of Healdan's jobs that doesn't run on this server is switched off
        running:
          type: boolean
          description: Whether a run has begun and not ended, one asked to stop included
        lastStart:
          type: [string, 'null']
          format: date-time
          description: When its last run began; null if none has since the server started
        lastEnd:
          type: [string, 'null']
          format: date-time
          description: |
            When its last run that ended did; null if none has, and for a
            LogicalDOC task while it runs
        result:
          type: [string, 'null']
          description: |
            How its last run ended: `succeeded`, or `failed`, as `error`
            says; `done` for a job whose work is done for good, as the email
            index's once its first pass has ended. Null when it hasn't run
            since the server started, and for a LogicalDOC task running with
            no error yet
          enum: [succeeded, failed, done, null]
        error:
          type: [string, 'null']
          description: |
            What its last run failed with, in English, as the server logged
            it, but for the credentials of the URLs in it, taken out as the
            Monitoring tag says; null unless `result` is `failed`
        nextRun:
          type: [string, 'null']
          format: date-time
          description: When it runs next; null when it won't, or that isn't known
        overdue:
          type: boolean
          description: |
            Whether it's overdue: enabled, not running, and its next run more
            than twice its interval past, and an hour at least
        canRun:
          type: boolean
          description: |
            Whether **Run Now** runs it now: a LogicalDOC task while it's
            enabled and idle and the server has scheduled tasks on, and the
            five of Healdan's jobs that
            `GET /v1/admin/jobs` names, each while it's switched on and not
            running
        canStop:
          type: boolean
          description: |
            Whether **Stop** stops it now: a LogicalDOC task while it runs
            and hasn't been asked to stop
        switchable:
          type: boolean
          description: |
            Whether **Enable** and **Disable** apply to it, as to every
            LogicalDOC task and none of Healdan's jobs; which applies is
            `enabled`'s to say
        schedule:
          description: A LogicalDOC task's schedule; null for Healdan's jobs, which are never rescheduled here
          oneOf:
            - $ref: '#/components/schemas/JobSchedule'
            - type: 'null'
    JobSchedule:
      type: object
      description: |
        When a LogicalDOC task runs: every so many seconds (`simple`), or
        when a cron expression says (`cron`)
      additionalProperties: false
      required: [mode, intervalSeconds, cron]
      properties:
        mode:
          type: string
          enum: [simple, cron]
        intervalSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: For `simple`, the seconds from one run's start to the next; null for `cron`
          examples: [1800]
        cron:
          type: [string, 'null']
          description: |
            For `cron`, the expression, in Quartz's form, read in the
            server's time zone; null for `simple`
          examples: ['0 0 3 * * ?']
    JobScheduleChange:
      type: object
      description: |
        A LogicalDOC task's new schedule: `mode`, and the member for it.
        The other mode's member is left out or null.
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          description: |
            `simple`, every `intervalSeconds`, or `cron`, when `cron` says;
            any other value is `422 validation` (`invalid`), not `400`
          enum: [simple, cron]
        intervalSeconds:
          type: [integer, 'null']
          format: int64
          description: For `simple`, the seconds from one run's start to the next, from 1 to 31,536,000
        cron:
          type: [string, 'null']
          description: For `cron`, the cron expression, in Quartz's form
    SearchIndex:
      type: object
      description: The Search Index's heading
      additionalProperties: false
      required: [indexed, waiting, failed, entries, bytes, health, indexer]
      properties:
        indexed:
          type: integer
          format: int64
          minimum: 0
          description: How many documents are in the index, as the Search Index tag counts them
        waiting:
          type: integer
          format: int64
          minimum: 0
          description: How many wait for LogicalDOC's Indexer, those that couldn't be indexed left out
        failed:
          type: integer
          format: int64
          minimum: 0
          description: How many couldn't be indexed
        entries:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            How many entries the index holds, for documents and shortcuts
            alike, which can differ from `indexed`; null when the index
            can't be read
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: The size of the index's folder on the server's disk; null when it can't be read
        health:
          $ref: '#/components/schemas/IndexHealth'
        indexer:
          $ref: '#/components/schemas/Indexer'
    IndexHealth:
      type: object
      description: The index's health, as the Dashboard's Search Index tile gives it
      additionalProperties: false
      required: [status, detail]
      properties:
        status:
          type: string
          description: |
            `ok` when every document has been indexed or waits to be;
            `attention` when one or more couldn't be indexed
          enum: [ok, attention]
        detail:
          type: string
          description: The tile's line in English
          examples: ['None waiting, none failed', '5 waiting, 2 failed']
    Indexer:
      type: object
      description: LogicalDOC's Indexer, and what **Run Indexer Now** would do
      additionalProperties: false
      required: [job, runRefusal]
      properties:
        job:
          description: |
            The Indexer, `IndexerTask`, as `GET /v1/admin/jobs` lists it: its
            last start and end, how its last run ended, its next run,
            whether it's running, and `canRun`, whether
            **Run Indexer Now** runs it now
          allOf:
            - $ref: '#/components/schemas/Job'
        runRefusal:
          type: [string, 'null']
          description: |
            The sentence `POST /v1/admin/search-index/run` would refuse with
            now, which the screen can show beside the greyed-out button:
            the Indexer running already, scheduled tasks switched off on
            the server, or the Indexer disabled. Null when
            **Run Indexer Now** would run it now. Just after a Run Now this
            already says the Indexer is running while `job.canRun`, as
            Background Jobs gives it, may still be true for a moment, until
            the run shows: the button follows this
          examples: [This job is running already.]
    IndexDocument:
      type: object
      description: A document, as the Search Index names it
      additionalProperties: false
      required: [id, docNumber, fileName, matter]
      properties:
        id:
          type: integer
          format: int64
          description: "LogicalDOC's internal id of the document, not its doc #"
        docNumber:
          type: [integer, 'null']
          format: int64
          description: "Its doc #, which the User app's links take; null when it has none"
        fileName:
          type: string
          description: Its file name
        matter:
          description: |
            The matter stamped on it, by its client and matter numbers; null
            when none is, or the stamps name no live matter
          oneOf:
            - $ref: '#/components/schemas/MatterBrief'
            - type: 'null'
    IndexFailure:
      type: object
      description: A document that couldn't be indexed, as the Couldn't Be Indexed tab shows it
      additionalProperties: false
      required: [document, reason, when]
      properties:
        document:
          $ref: '#/components/schemas/IndexDocument'
        reason:
          type: [string, 'null']
          description: |
            Why it couldn't be indexed the last time it was tried, in
            English, as LogicalDOC kept it; null when it kept none
          examples: [The file is encrypted]
        when:
          type: [string, 'null']
          format: date-time
          description: When it was last tried; null when that isn't kept
    IndexFailureList:
      description: A page of the documents that couldn't be indexed
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/IndexFailure'
      unevaluatedProperties: false
    IndexWaiting:
      type: object
      description: A document waiting to be indexed, as the Waiting tab shows it
      additionalProperties: false
      required: [document, lastChanged]
      properties:
        document:
          $ref: '#/components/schemas/IndexDocument'
        lastChanged:
          type: string
          format: date-time
          description: |
            When the document was last changed: for most documents, when
            they began to wait, as a new file or version, or a change of
            its properties, marks one to be indexed. A document marked to be
            indexed again with every other, as Empty the Index First marks
            them, keeps the time it last changed before
    IndexWaitingList:
      description: A page of the documents waiting to be indexed
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/IndexWaiting'
      unevaluatedProperties: false
    IndexEvent:
      type: object
      description: A time a document was indexed, or couldn't be
      additionalProperties: false
      required: [id, when, event, reason, who, document]
      properties:
        id:
          type: integer
          format: int64
          description: The row's own, in LogicalDOC's document history, which a client only compares
        when:
          type: string
          format: date-time
          description: |
            When it was done: the row's date, or, for a row that keeps none,
            when the row was written, as the Audit Trail's `when` is
        event:
          type: string
          description: '`indexed`, its entry in the index written; `failed`, it couldn''t be indexed'
          enum: [indexed, failed]
        reason:
          type: [string, 'null']
          description: |
            For `failed`, why it couldn't be indexed, in English, as
            LogicalDOC kept it, null when it kept none; null for `indexed`
          examples: [The file is encrypted]
        who:
          type: [string, 'null']
          description: |
            Who it was done for, as the Audit Trail's `who` names them: the
            person who started the reindex or pressed **Try Again**, or the
            account LogicalDOC's Indexer runs as; null when the row names
            no one
          examples: [Sam Okafor]
        document:
          $ref: '#/components/schemas/IndexDocument'
    IndexHistoryPage:
      type: object
      description: |
        A page of the index's events, and where the next one starts. It may
        hold fewer rows than asked for, even none, while `nextCursor` isn't
        null.
      additionalProperties: false
      required: [items, nextCursor, readBackTo]
      properties:
        items:
          type: array
          description: The events, newest first
          maxItems: 200
          items:
            $ref: '#/components/schemas/IndexEvent'
        nextCursor:
          type: [string, 'null']
          description: |
            Where the next page starts, for `cursor`, which holds the
            reading's place and nothing a client reads; null once the
            history has been read to its end
        readBackTo:
          type: [string, 'null']
          format: date-time
          description: |
            How far back the reading has reached: every event newer than
            this has been given, on this page or an earlier one, so a page
            with fewer rows than asked for, or none, says nothing more was
            found back to it. Null once the history has been read to its
            end, as `nextCursor` is
    IndexRetry:
      type: object
      description: How **Try Again** went
      additionalProperties: false
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          description: |
            `indexed`, its entry in the index written; `failed`, it still
            couldn't be indexed, and stays among those that couldn't
          enum: [indexed, failed]
        reason:
          type: [string, 'null']
          description: |
            For `failed`, why, in English, as `IndexFailure.reason` gives it;
            null for `indexed`
    ReindexKind:
      type: string
      description: |
        What a reindex covers: `documents`, documents named by doc #;
        `folder`, the documents in a folder and every folder in it, at
        every level; `matter`, those of a matter's own folder, likewise;
        `store`, those of a Store's folder, its matters' included,
        likewise; `everything`, every document of the tenant
      enum: [documents, folder, matter, store, everything]
    ReindexScope:
      type: object
      description: |
        What to reindex: `kind`, and the member for it. A member for another
        kind is left out or null.

        - `400 bad-request` for a body that isn't a JSON object, a member
          this doesn't list, a member of the wrong type, a doc # that isn't
          a whole number from 0 up, more than 10,000 numbers in
          `docNumbers`, repeats included, an `emptyFirst` that isn't `true`
          or `false`, null included, and, for a `kind` of the five, a
          `targetId` with `documents` or `everything`, or `docNumbers` with
          any other kind.
        - `422 validation` as `POST /v1/admin/reindex` says.
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          description: |
            One of `ReindexKind`'s; any other value is `422 validation`
            (`invalid`), not `400`
          enum: [documents, folder, matter, store, everything]
        targetId:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            For `folder`, the folder's id, as the Workspace Editor's tree and
            the public API's folders give it, any folder that isn't a folder
            alias; for `matter`, the matter's id, not its folder's, as the
            admin Matters routes and the public API's matters give it; for
            `store`, the Store's id, which is its folder's, as
            `GET /v1/admin/stores` gives it. None for `documents` and
            `everything`
        docNumbers:
          type: [array, 'null']
          description: |
            For `documents`, the doc #s, as typed or pasted, 1 to 1,000
            different ones; a number given more than once counts once. None
            for the other kinds
          maxItems: 10000
          items:
            type: integer
            format: int64
            minimum: 0
        emptyFirst:
          type: boolean
          description: |
            **Empty the index first**, for `everything` only: true empties
            the index and marks every document to be indexed as the
            reindex's run begins; false when left out
    ReindexPreview:
      type: object
      description: What a reindex of a scope would cover, if it were started now
      additionalProperties: false
      required: [name, count, skipped, estimateSeconds, documents, refusal]
      properties:
        name:
          type: string
          description: The name a reindex started now would be given, as `ReindexJob.name` says
          examples: [Matter 1001.1 Charter Dispute]
        count:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many documents it would try: the scope's live documents, less
            those set to Skip, archived or being changed at that moment
        skipped:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many it would leave out: in a folder, matter, Store or
            everything, the shortcuts, which LogicalDOC's Indexer indexes
            again once the document each leads to is done; and, in any
            scope, the documents set to Skip,
            those archived, which LogicalDOC's Indexer leaves out too, and
            those being changed at that moment. A reindex started at once
            makes it its `leftOut`
        estimateSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            About how many seconds it would take once it runs, rounded up:
            `count` times the time each document took in the latest reindex
            that ended `done` having tried 20 or more, its run's time over
            its `done` and `failed`, or 1.75 seconds each while no reindex
            has; the reindexes that would run before it not counted. Null
            when `count` is 0
          examples: [721]
        documents:
          type: [array, 'null']
          description: |
            For `documents`, each doc # given, in the order given, a repeat
            left out; null for the other kinds
          items:
            $ref: '#/components/schemas/ReindexMatch'
        refusal:
          type: [string, 'null']
          description: |
            The sentence `POST /v1/admin/reindex` would refuse this scope
            with now: `There's nothing here to reindex.` when `count` is 0,
            and `This is already being reindexed.` when a reindex waiting or
            running covers it already; null when it would start one
          examples: [There's nothing here to reindex.]
    ReindexMatch:
      type: object
      description: "A doc # given for a reindex of `documents`, and what it names"
      additionalProperties: false
      required: [docNumber, status, document]
      properties:
        docNumber:
          type: integer
          format: int64
          description: "The doc #, as given"
        status:
          type: string
          description: |
            `found`, a live document the reindex would try; `left-out`, a
            live document it would leave out, counted in `skipped`, as it's
            set to Skip, archived or being changed at that moment;
            `not-found`, no live document of the tenant has it, as for one
            in the Trash
          enum: [found, left-out, not-found]
        document:
          description: The document it names; null for `not-found`
          oneOf:
            - $ref: '#/components/schemas/IndexDocument'
            - type: 'null'
    ReindexJob:
      type: object
      description: |
        A reindex, with its progress: `done`, `failed` and `skipped`
        together of `total`
      additionalProperties: false
      required: [id, kind, targetId, name, startedBy, state, cancelling, emptyFirst, total, done, failed, skipped,
        unreachable, leftOut, created, started, ended, stalledSince, failingSince, estimateSecondsLeft]
      properties:
        id:
          type: integer
          format: int64
          description: Its id, which its paths take
        kind:
          $ref: '#/components/schemas/ReindexKind'
        targetId:
          type: [integer, 'null']
          format: int64
          description: |
            The folder's, the matter's or the Store's id, as `ReindexScope`
            took it; null for `documents` and `everything`
        name:
          type: string
          description: |
            What it covers, in English, as it was started, at most 255
            characters: `Matter 1001.1 Charter Dispute`; `Store Client Work`;
            `Folder Pleadings`, followed by ` in 1001.1 Charter Dispute` when
            the folder is in a matter; `3 Documents`, or `1 Document`,
            counting the doc #s that name a live document, those left out
            included; `Everything`
          examples: [Matter 1001.1 Charter Dispute, Folder Pleadings in 1001.1 Charter Dispute, 3 Documents]
        startedBy:
          description: |
            Who started it, read now; when that account has been deleted, the
            username the reindex kept, as both `username` and `name`
          allOf:
            - $ref: '#/components/schemas/PersonBrief'
        state:
          type: string
          description: |
            `waiting` for its turn, as one reindex runs at a time, oldest
            first; `running`; `done`, every document tried or skipped;
            `cancelled`. A running reindex goes on from where it was when
            the server starts again
          enum: [waiting, running, done, cancelled]
        cancelling:
          type: boolean
          description: |
            Whether it was asked to stop while running: it's `cancelled` once
            the batch it's indexing ends. False in every other state
        emptyFirst:
          type: boolean
          description: Whether it empties the index first, as its run begins; only ever true for `everything`
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many documents it tries, fixed as it was started, its preview's `count`
        done:
          type: integer
          format: int64
          minimum: 0
          description: How many it has indexed
        failed:
          type: integer
          format: int64
          minimum: 0
          description: How many it couldn't index, which joined **Couldn't Be Indexed**
        skipped:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many it skipped at their turn, as they had gone (deleted, in
            the Trash or destroyed), or were set to Skip, archived or being
            changed at that moment, or the storage that keeps their file
            couldn't be reached then, each keeping its entry and its status
        unreachable:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of `skipped` it skipped because the storage that keeps
            their file couldn't be reached at their turn: a reindex once the
            storage is back covers them
        leftOut:
          type: integer
          format: int64
          minimum: 0
          description: How many it left out as it was started, as its preview's `skipped` counts them, not in `total`
        created:
          type: string
          format: date-time
          description: When it was started, which `started` follows once its turn comes
        started:
          type: [string, 'null']
          format: date-time
          description: When its run began; null while it's waiting, and for one cancelled before its turn
        ended:
          type: [string, 'null']
          format: date-time
          description: When it ended, `done` or `cancelled`; null until it has
        stalledSince:
          type: [string, 'null']
          format: date-time
          description: |
            While it's running, since when the index couldn't be written: it
            waits and tries again, counting nothing meanwhile. Null while it
            can be, and in every other state
        failingSince:
          type: [string, 'null']
          format: date-time
          description: |
            While it's running, since when the server's reindex worker has
            failed at each try, so it makes no progress: it tries again every
            30 seconds, and Background Jobs gives the failure, as its
            `reindex` job. Kept in the server's memory, so null after a
            restart until the worker fails again; null while the worker
            doesn't fail, and in every other state
        estimateSecondsLeft:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |
            About how many seconds it has left, rounded up. For `running`,
            the documents left (`total` less `done`, `failed` and `skipped`)
            times the time each has taken in its run so far (its run's time
            over its `done` and `failed`) once it has tried 20 or more, and
            as a preview would estimate them before then; for `waiting`, its
            `total` as a preview estimates it, the reindexes ahead of it not
            counted. Null once it has ended, while `stalledSince` or
            `failingSince` is set, and when nothing is left
          examples: [360]
    ReindexJobList:
      description: A page of reindexes
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReindexJob'
      unevaluatedProperties: false
