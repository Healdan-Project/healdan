  /v1/admin/stores:
    get:
      operationId: adminListStores
      summary: The Stores
      description: |
        Every live Store, by name, ignoring case (`MatterService.stores`):
        not LogicalDOC's Default workspace, the Templates Store or a Store in
        the Trash. A short list, so not a page: for the Store menus of New
        Matter, Move to Another Store and the Matters list, and for the Stores
        list (Admin app spec section 8.6), each with what that list shows.

        - `matters` counts its live matters, not deleted or in the Trash, as
          they are at the request.
        - `documents` and `bytes` are its matters', from the summary the
          server keeps in memory for the Dashboard's Usage, worked out at
          most every 15 minutes and never by a request: `figuresAt` says
          when. Until the first summary since the server started, they and
          `figuresAt` are null; a Store made or restored since the last
          summary has `documents` and `bytes` 0 until the next.
        - `readers` are the groups and people that can see it, as
          `GET /v1/admin/stores/{id}/access` lists them.
        - `backend` and `pending` are its storage backend and its files that
          haven't reached it, as `GET /v1/admin/stores/{id}/backend` gives
          them: null when storage backends are off, or on a server without
          Healdan's storage module, which this route answers all the same.
      tags: [Stores]
      responses:
        '200':
          description: The Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminCreateStore
      summary: Create a Store
      description: |
        Creates a Store, a workspace under the root, and gives each group in
        `groupIds` Read, the Store's one level, **Can See**, all in one
        transaction (`StoreService.create`), so a matter can be made in it
        at once (Admin app spec section 8.6). Answers `201` with it. The
        name has the whitespace at either end taken off. A group in
        `groupIds` may be a person's own. It answers the Store's id and name
        and the backend it keeps its files on: `GET /v1/admin/stores/{id}`
        gives the rest.

        The new Store keeps its files on the backend `backendId` names,
        Original, the server's own folder, when it's null or left out. The
        backend is checked first; the Store is made, in one transaction, then
        given its backend, as `PUT /v1/admin/stores/{id}/backend` does. Should
        that backend stop being offered to Stores in between, as when another
        administrator removes it, or should giving it fail, the Store stays
        on Original and the answer is still `201`, with Original as its
        `backendId`, so a client can say so; the server logs it.

        - `400 bad-request` for a `groupIds` that names a group twice or
          holds a null.
        - `422 validation` for the name, as `FolderName` says, and for a
          missing `groupIds` (`required`).
        - `409 refused` for a name another live folder directly under the
          root has, compared without regard to case: another Store,
          LogicalDOC's Default workspace or the Templates Store; for a group
          that no longer exists; for a `backendId` that names no backend, or
          one not offered to Stores (an encrypted backend whose recovery key
          isn't confirmed); for any backend but Original while storage
          backends are off, or on a server without Healdan's storage module;
          and for what Healdan's rules refuse. Of two creates, renames or
          restores giving one name at the same moment, the second is refused
          as a name taken, with the same sentence.

        Recorded as `store.created`, with its name and one change for each
        group that can see it, named as `group Partners` or `user jdoe`,
        with `read`; and, for a backend other than Original, as
        `store.backend-changed` too, in the Storage area.
      tags: [Stores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStore'
      responses:
        '201':
          description: The new Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/deleted:
    get:
      operationId: adminListDeletedStores
      summary: The Stores in the Trash
      description: |
        The Stores in the Trash, which the Stores list shows apart, each with
        **Restore** (`POST /v1/admin/stores/{id}/restore`; Admin app spec
        section 8.6): every Store whose delete is in a Trash, whoever deleted
        it, `deleted`, or removed from it and not destroyed yet, `removed`.
        Most recently deleted first. A short list, so not a page.

        The User app's Trash doesn't restore a Store's item
        (`409 refused`): this route's restore does.
      tags: [Stores]
      responses:
        '200':
          description: The Stores in the Trash
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeletedStore'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}:
    get:
      operationId: adminGetStore
      summary: A Store
      description: |
        The Store, as the list gives it, for its page (Admin app spec section
        8.6), which lists its matters with `GET /v1/admin/matters?storeId=`,
        who can see it with `GET /v1/admin/stores/{id}/access`, and its
        storage backend with `GET /v1/admin/stores/{id}/backend`.

        Anything but a live Store is `404 not-found`: LogicalDOC's Default
        workspace, the Templates Store, the root, a Store in the Trash and
        any other folder.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminRenameStore
      summary: Rename a Store
      description: |
        Renames the Store's folder, through `StoreService.rename`, and
        answers the Store (Admin app spec section 8.6). Its matters keep
        their folders and their names. The name has the whitespace at either
        end taken off; its own name changes nothing, after the checks up to
        `422` and the refusal of the three folders below, which comes first:
        they're refused whatever the name, their own included.

        - `404 not-found` for anything but a live Store, but for the three
          folders `409 refused` names.
        - `422 validation` for the name, as `FolderName` says.
        - `409 refused` for LogicalDOC's Default workspace, the Templates
          Store and the root, which aren't renamed here, each with a sentence
          that says so, even when the name sent is the one it has; for a name
          another live folder directly under the root has, compared without
          regard to case, with the sentences of `POST /v1/admin/stores`
          (changing only the case of its own name works); and for what
          Healdan's rules refuse. Of two creates, renames or restores giving
          one name at the same moment, the second is refused as a name taken.

        Recorded as `store.renamed`, with the name before and after.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderRename'
      responses:
        '200':
          description: The Store, renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminDeleteStore
      summary: Move a Store to the Trash
      description: |
        Moves the Store's folder, every matter in it and everything live in
        them, to the caller's Trash as one item, through LogicalDOC's folder
        delete, as a matter's delete does, and answers the Trash item it made
        (Admin app spec section 8.6). The matters' rows stay, so their
        numbers stay taken. The Store and its matters are then `404` here
        and gone from the lists, and `GET /v1/admin/stores/deleted` lists the
        Store, which `POST /v1/admin/stores/{id}/restore` brings back with
        its matters.

        - `404 not-found` for anything but a live Store, but for the three
          folders `409 refused` names.
        - `409 refused` for LogicalDOC's Default workspace, the Templates
          Store and the root, which aren't deleted here, each with a sentence
          that says so; while a document in it is checked out, by anyone, the
          caller too; while it holds an immutable document; and for what
          Healdan's rules refuse.

        Recorded as `store.deleted`, after the delete.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The Trash item the delete made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedFolder'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/restore:
    post:
      operationId: adminRestoreStore
      summary: Restore a Store from the Trash
      description: |
        Restores the Store from the Trash, back directly under the root, with
        the matters and everything else its delete took, through the Trash's
        restore, whether its item is `deleted` or `removed`, and answers the
        Store (Admin app spec section 8.6). `id` is the Store's folder, as
        `GET /v1/admin/stores/deleted` gives it. What was deleted on its own
        before the Store was is a Trash item of its own, and stays there.
        Takes no body.

        - `404 not-found` when `id` names no Store, live or in the Trash.
        - `409 refused` for a live Store, with a sentence that says it isn't
          in the Trash, as after another restore; when another live folder
          directly under the root now has its name, compared without regard
          to case, with the sentences of `POST /v1/admin/stores`, so that
          folder is renamed first; when the nightly destroy, or another
          restore, takes it out of the Trash as this one runs; and for what
          Healdan's rules refuse, such as a group that could read one of its
          matters but can't read the Store (P2).
          Of two creates, renames or restores giving one name at the same
          moment, the second is refused as a name taken.

        Recorded as `store.restored`, after the restore.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: The Store, back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/access:
    get:
      operationId: adminGetStoreAccess
      summary: Who can see a Store
      description: |
        Each group and person with permissions on the Store (Admin app spec
        section 8.6). A Store has one level, **Can See** (Read, the only
        permission that matters on a Store), so a row's `level` is `can-see`
        when it grants Read alone, and `custom` when it grants anything
        else, with or without Read. A group or person the Store grants
        nothing isn't listed, though LogicalDOC can keep a row for one.

        LogicalDOC's Default workspace, the Templates Store, the root and any
        other folder that isn't a live Store are `404 not-found`.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: Who can see it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAccess'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetStoreAccess
      summary: Set who can see a Store
      description: |
        Sets who can see the Store, in one transaction
        (`StoreService.setAccess`), and answers who can see it after (Admin
        app spec section 8.6): each group in `groupIds`, a person's own group
        among them, gets Read, keeping any other permission its row has, and
        every other group's row goes. An empty list leaves the Store to
        administrators alone. A Store that followed another folder's
        permissions gets its own.

        New Matter's **Let {group} Read the Store** sends the groups whose
        rows have `read`, with the problem's group added. A `custom` row that
        lacks Read isn't among them, so its group's row goes: harmless on a
        Store, where only Read matters. Healdan's permission rules then
        narrow, as on every route, what in the Store's matters follows the
        Store's permissions.

        - `400 bad-request` for a `groupIds` that names a group twice or
          holds a null.
        - `404 not-found` as `adminGetStoreAccess` answers.
        - `422 validation` for a missing `groupIds` (`required`).
        - `409 refused` for a group that no longer exists (a deleted group
          the Store already grants something may stay, so a change needn't
          take away what's there); for a change that would leave a matter in
          the Store letting in a group the Store wouldn't (P2: whoever can
          read a matter can read its Store), checked before anything is written,
          the matter's owner's own group passing while the owner could read
          the Store, with a sentence that names the first such group and its
          matter, or how many of the Store's matters it can read and the
          first by name; and for what Healdan's rules refuse. A matter that
          already let in a group the Store didn't refuses no other change,
          so the change that puts it right goes through, and a matter in the
          Trash is checked when it's restored.

        Recorded as `store.access-changed`, with `follows` (the folder it
        followed, null after) when it followed another folder's permissions,
        and one change for each row that changed, named as `group Partners`
        or `user jdoe`, valued with its permissions in `Permission`'s order
        (`read, download`), null for no row. A change that changes nothing
        is neither written nor recorded.
      tags: [Stores]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAccessChange'
      responses:
        '200':
          description: Who can see it, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAccess'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/backend:
    get:
      operationId: adminGetStoreBackend
      summary: A Store's storage backend
      description: |
        The storage backend the Store keeps its files on, Original when it
        has no other, and its files: how many it has and their size, those
        that haven't reached that backend yet, and those the mover gave up on
        (Admin app spec section 8.6).

        With `backendId`, `switchPreview` also says how many of its files,
        and their bytes, would move were it given that backend, the files not
        on it now, as the Storage tab says before a switch. It changes
        nothing.

        While storage backends are off, `on` is false, `backend` null and the
        counts 0.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store, as
          `GET /v1/admin/stores/{id}` answers it, and for a `backendId` that
          names no backend, any while storage backends are off.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
        - name: backendId
          in: query
          required: false
          description: A backend to count the move to; without it, nothing is counted
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Its backend and its files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStorage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetStoreBackend
      summary: Give a Store another storage backend
      description: |
        Gives the Store the backend `backendId` names, from then on, as the
        Storage tab's change of a Store's backend does, and answers its
        backend and its files after (Admin app spec section 8.6). Its files
        move there in the background, `pending` falling as they do, and until
        each has moved it's read from where it is. Original brings them back
        to the server's own folder. The Store's own backend changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store.
        - `422 validation` for a missing `backendId` (`required`).
        - `409 refused`, with the Storage tab's sentence: while storage
          backends are off; for a `backendId` that names no backend; for one
          not offered to Stores, an encrypted backend whose recovery key
          isn't confirmed; for one still being added; and for what Healdan's
          rules refuse.

        Recorded as `store.backend-changed`, with the backend before and
        after, by name.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBackendChange'
      responses:
        '200':
          description: Its backend and its files, after
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStorage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/stuck-files:
    get:
      operationId: adminListStoreStuckFiles
      summary: A Store's stuck files
      description: |
        The Store's files the mover gave up on, after ten failed tries in a
        row, which stay where they are, where they still open, until they're
        retried (Admin app spec section 8.6). The newest documents first, at
        most 1,000: `pending.stuck` of `GET /v1/admin/stores/{id}/backend`
        counts them all. A short list, so not a page.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '200':
          description: Its stuck files
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/StuckFile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/stores/{id}/stuck-files/retry:
    post:
      operationId: adminRetryStoreStuckFiles
      summary: Retry a Store's stuck files
      description: |
        **Retry** (Admin app spec section 8.6): every stuck file of the Store
        goes back to waiting, its tries counted from nought again, and the
        mover is woken, which moves them with the others. The cause, such as
        the S3 user's permissions or a full disk, is put right first. Takes
        no body; answers `204`. With none stuck, it changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for anything but a live Store.
        - `409 refused` while storage backends are off.

        Recorded as `storage.stuck-retried`, naming the Store; with none
        stuck, it changes nothing and isn't recorded.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/StorePath'
      responses:
        '204':
          description: Waiting again
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends:
    get:
      operationId: adminListBackends
      summary: The storage backends
      description: |
        Whether this server keeps its files through storage backends (`on`),
        every backend as its page shows it, and the files with no Store that
        haven't reached a backend or that the mover gave up on, such as a
        document's saved before it had a folder, the Storage tab's Other
        Files (Admin app spec section 8.6). Original first, then the others
        in the order they were added. A short list, so not a page.

        While storage backends are off, `on` is false, with no backends and
        `otherFiles` all 0.

        `503 storage-unavailable` on a server without Healdan's storage
        module.
      tags: [Storage]
      responses:
        '200':
          description: The backends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendOverview'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: adminAddBackend
      summary: Add a storage backend
      description: |
        Adds a backend, a local folder or an S3 bucket, as the Storage tab's
        Add does, and answers `201` with it as its page shows it, its address
        as `Location` (Admin app spec section 8.6). In order: Test on the
        settings as sent, which must pass; the settings saved; its marker
        written in its place, which refuses a place whose marker names
        another backend or another install; for an encrypted backend, its key
        file and check object; and Test once more, in full, its key included.
        A step that fails undoes the ones before it, so its name and place
        are free to try again. It holds nothing until a Store is given it.

        An encrypted backend's answer carries its recovery key in
        `recoveryKey`, often the only time it's shown, so the app shows it at
        once, to be saved away from the server; that showing is recorded.
        Only `POST /v1/admin/backends/{id}/recovery-key/show` answers it
        again. No Store can be given the backend until the key's last group
        is typed back (`POST /v1/admin/backends/{id}/recovery-key/confirm`).
        Whether a backend is encrypted is chosen here, and never changes.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `422 validation` for what the kind needs, missing or blank
          (`required`): `kind` and `name`; a folder's `path`; an S3 bucket's
          `endpoint`, `region`, `bucket`, `accessKey` and `secret`. For a
          `kind` other than `local` and `s3` (`invalid`). And for a member of
          the other kind, sent with a value (`invalid`): S3's for a folder,
          or `path` for S3; null counts as left out.
        - `409 secret-key-missing`, with `sealed`, for an S3 bucket while
          Healdan's secret key file is missing and values are sealed with it,
          unless `newKey` is true; nothing is written.
        - `409 refused`, with the Storage tab's sentence: while storage
          backends are off; for a name another backend has, in any case, or
          over 100 characters; for a setting too long, or that isn't what it
          must be (a path that isn't a folder's whole path from `/`; an
          endpoint that isn't an address, or `http://` but for an S3 server
          whose every address is on a private network, with path style); for
          a place another backend has (the same bucket, at the same S3
          service, with the same prefix or one that holds or sits inside it;
          a folder that is, holds or sits inside another backend's, Original's,
          staging's, the read cache's, the configuration folder or the storage
          key files' folder, links followed); for Test failing, with what it
          found; and for a later step failing, such as another backend's or
          another install's marker in its place.

        Recorded as `backend.added`, with its settings: its name, kind,
        place and `encrypted`, its access key and its secret as changed with
        no value; and, for an encrypted backend, as
        `backend.recovery-key-shown` too, as its answer shows the key.
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBackend'
      responses:
        '201':
          description: The new backend
          headers:
            Location:
              description: The backend's address, such as `/api/v1/admin/backends/3`
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedBackend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/test:
    post:
      operationId: adminTestNewBackend
      summary: Test a backend's settings before saving
      description: |
        **Test**, in the windows that add and edit a backend (Admin app spec
        section 8.6): tries the settings as typed, saving nothing, and answers
        the problems it found, none when it passed. A test that fails isn't a
        refusal: it's `200`, each problem a sentence in `problems`, a setting
        Healdan refuses among them, as the add or the save would say it.

        - For S3, it writes a test object in the bucket, reads it back whole
          and in part, lists it and deletes it. For a folder, it checks that
          the folder exists, that Healdan can write in it, and that it holds
          no other backend's marker.
        - With `id`, the backend being edited: a missing or blank `secret`
          uses the stored one, and a place that's still its own is tested
          with its marker. Original's `id` tests Original in full, as
          `POST /v1/admin/backends/{id}/test` does, whatever else is sent.
        - The settings of the other kind, S3's for a folder or `path` for S3,
          are left aside.

        A draft never answers `422`: what's missing or wrong, an unknown
        `kind` included, is among the problems. It records nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `409 refused` while storage backends are off, and for an `id` that
          names no backend.
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackendTrial'
      responses:
        '200':
          description: What the test found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendTestResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}:
    get:
      operationId: adminGetBackend
      summary: A storage backend
      description: |
        The backend, as the list gives it, for its page and its Edit window
        (Admin app spec section 8.6). Its S3 secret is never answered, only
        whether one is stored (`hasSecret`), nor its recovery key.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: The backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: adminEditBackend
      summary: Change a storage backend
      description: |
        Saves the backend's settings, as the Storage tab's Edit does, and
        answers it as saved (Admin app spec section 8.6). A member left out
        stays as it is, and `secret` only replaces the stored one: null,
        blank or left out keeps it. The app tests the settings first
        (`POST /v1/admin/backends/test` with `id`), as the tab does, and saves
        all the same if the administrator chooses, so a backend can be
        renamed during an outage: one whose settings don't work fails until
        they do.

        - The name changes, and for S3 the endpoint, region, access key,
          secret and path style. The bucket, prefix or path change only while
          no file is recorded or copy held on the backend (`inUse` false) and
          no Store keeps its files there, and the new place is given its
          marker, and an encrypted backend's check object, before the backend
          points there. Original's folder comes from the server's
          configuration, so only its name changes.
        - Its kind never changes, nor whether it's encrypted, which its add
          chose, as its recovery key was shown then.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `422 validation` for `kind` and `encrypted` (`not-editable`); for
          Original, every member but `name` (`not-editable`); for a member of
          the other kind, S3's on a folder or `path` on S3 (`not-editable`),
          each only when sent with a value, as the add refuses them: null
          counts as left out. And for the name, or a setting the backend's
          kind needs, sent as null or blank (`required`).
        - `409 secret-key-missing`, with `sealed`, for a new `secret` while
          Healdan's secret key file is missing and values are sealed with it,
          unless `newKey` is true; nothing is saved.
        - `409 refused`, before the Storage tab's refusals, for a new bucket,
          prefix or path while a Store in the Trash keeps its files there,
          naming each such Store, as `storesInTrash` lists them: its files
          stay there while it's in the Trash, so it's restored, given another
          backend and deleted again.
        - `409 refused`, with the Storage tab's sentence: for a name another
          backend has, in any case, or a setting refused as the add refuses
          it; for a new bucket, prefix or path once a file is recorded or a
          copy held on the backend, or while a Store keeps its files there;
          for a new place that another backend has, or whose marker can't be
          written; for a new place while the stored secret can't be read, as
          after a new secret key, so the secret is typed again; for another
          save that changed the backend meanwhile, so it's opened again; for
          a backend still being added; and for what Healdan's rules refuse.

        Recorded as `backend.changed`, with each changed setting before and
        after, a new access key and a new secret as changed with no value. A
        save that changes nothing isn't recorded.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackendChange'
      responses:
        '200':
          description: The backend, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminRemoveBackend
      summary: Remove a storage backend
      description: |
        Removes an empty backend, as the Storage tab's Remove does (Admin app
        spec section 8.6): one no Store keeps its files on, live or in the
        Trash, with no file recorded on it and no copy held there. Its
        settings leave the database, its sealed S3 secret among them; an
        encrypted backend's key file is deleted; and its marker and check
        object are deleted from its place, so another backend can have it.
        It can't be undone. Answers `204`.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `409 refused`, before the Storage tab's refusals but Original's,
          while a Store in the Trash keeps its files on it, naming each such
          Store, as `storesInTrash` lists them: its files stay there while
          it's in the Trash, so it's restored, given another backend and
          deleted again.
        - `409 refused`, with the Storage tab's sentence: for Original, which
          keeps the files of every Store with no other backend; while a Store
          keeps its files on it, until it's given another; while files are
          recorded on it, until they've moved off; while copies are held on
          it, until the holding period ends and the purge deletes them; and
          for a backend still being added.

        Recorded as `backend.removed`.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/test:
    post:
      operationId: adminTestBackend
      summary: Test a saved backend
      description: |
        **Test** on a backend's page (Admin app spec section 8.6): tests the
        saved backend in full, with its settings and key file as they are
        now, and answers the problems, none when it passed: its marker, a
        test object as `POST /v1/admin/backends/test` writes, and for an
        encrypted backend its key, which must decrypt its check object. Its
        `status` then says what Test found. A test that fails isn't a
        refusal. Takes no body, and records nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `409 refused` for a backend still being added.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: What the test found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendTestResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/recovery-key/show:
    post:
      operationId: adminShowRecoveryKey
      summary: Show an encrypted backend's recovery key
      description: |
        **Show Recovery Key** (Admin app spec section 8.6): answers an
        encrypted backend's recovery key, from its key file as it is now, the
        only answer but the backend's add that holds it. Each showing is
        recorded, with who and when, before the key is answered, and the
        server's log says it was shown, never the key; the backend's
        `keyLastShown` and `keyLastShownBy`, and its key history, then name
        it. Takes no body.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `409 refused`, with the Storage tab's sentence: for a backend that
          isn't encrypted, which has no recovery key; for one whose key file
          is missing or can't be read, whose recovery key is entered to put
          it back; and for one still being added.

        Recorded as `backend.recovery-key-shown`.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: The recovery key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryKey'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/recovery-key/confirm:
    post:
      operationId: adminConfirmRecoveryKey
      summary: Confirm an encrypted backend's recovery key
      description: |
        Confirms that the backend's recovery key was saved, by the last group
        of four characters typed back, and answers the backend, which Stores
        can then be given (Admin app spec section 8.6). The group is read in
        any case, spaces and hyphens ignored. Confirming a key already
        confirmed changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `422 validation` for a missing or blank `lastGroup` (`required`).
        - `409 refused`, with the Storage tab's sentence: for a backend that
          isn't encrypted; for one whose key file is missing, whose recovery
          key is entered to put it back; for a group that isn't its recovery
          key's last; and for a backend still being added.

        Recorded as `backend.recovery-key-confirmed`, but for a key already
        confirmed.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKeyConfirmation'
      responses:
        '200':
          description: The backend, its recovery key confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/recovery-key/enter:
    post:
      operationId: adminEnterRecoveryKey
      summary: Put an encrypted backend's key file back
      description: |
        **Enter Recovery Key** (Admin app spec section 8.6): writes an
        encrypted backend's key file again from its recovery key, as typed or
        pasted, and answers the backend, which is then checked again. The key
        is read in any case, spaces and hyphens ignored, and must decrypt the
        backend's check object, which is read before anything is written, so
        a mistyped key, or another backend's, can't replace the file.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
        - `422 validation` for a missing or blank `recoveryKey`
          (`required`).
        - `409 refused`, with the Storage tab's sentence: for a backend that
          isn't encrypted; for what isn't a recovery key, by its length, its
          last character or a character a recovery key can't hold; for a key
          that isn't the backend's, so nothing was written; for a backend that
          can't be used, or whose check object is missing or can't be read, so
          the key can't be checked; for a key file that couldn't be written;
          and for a backend still being added.

        Recorded as `backend.recovery-key-entered`.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKeyEntry'
      responses:
        '200':
          description: The backend, its key file back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/backends/{id}/key-events:
    get:
      operationId: adminListKeyEvents
      summary: A backend's key history
      description: |
        **Key History** (Admin app spec section 8.6): every showing and every
        entering of the backend's recovery key, newest first, with who and
        when, the showing at its add included. Empty for a backend that isn't
        encrypted. A short list, so not a page.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `404 not-found` for a backend that doesn't exist or was removed,
          and for any while storage backends are off.
      tags: [Storage]
      parameters:
        - $ref: '#/components/parameters/BackendPath'
      responses:
        '200':
          description: Its key history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyEvent'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/storage/settings:
    get:
      operationId: adminGetStorageSettings
      summary: The storage settings
      description: |
        The storage settings, with each one's limits, for their form (Admin
        app spec section 8.6): the holding period, how many days a file's old
        copy is held after a move or a delete before the purge deletes it;
        the read cache's size, for copies of S3 backends' files on the
        server; and parallel transfers, how many files move between backends
        at once. While storage backends are off, `on` is false, and the
        values are as saved.

        `503 storage-unavailable` on a server without Healdan's storage
        module.
      tags: [Storage]
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: adminSetStorageSettings
      summary: Save the storage settings
      description: |
        Saves all three settings in one transaction, each checked before any
        is written, and answers them as saved (Admin app spec section 8.6). A
        new number of parallel transfers applies at once, and a holding
        period to the copies held from then on.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `422 validation` for a setting that's missing (`required`), or
          outside its limits, from 1 to the maximum `GET` gives
          (`out-of-range`), each by its field; nothing is saved.
        - `409 refused` while storage backends are off.

        Recorded as `storage.settings-changed`, with each changed setting
        before and after. Saving them as they are changes nothing.
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsChange'
      responses:
        '200':
          description: The settings, saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/storage/stuck-files:
    get:
      operationId: adminListOtherStuckFiles
      summary: The stuck files with no Store
      description: |
        The files with no Store the mover gave up on, such as a document's
        saved before it had a folder, listed as a Store's are
        (`GET /v1/admin/stores/{id}/stuck-files`): the newest documents
        first, at most 1,000; `otherFiles.stuck` of `GET /v1/admin/backends`
        counts them all.

        `503 storage-unavailable` on a server without Healdan's storage
        module.
      tags: [Storage]
      responses:
        '200':
          description: The stuck files with no Store
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/StuckFile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/storage/stuck-files/retry:
    post:
      operationId: adminRetryOtherStuckFiles
      summary: Retry the stuck files with no Store
      description: |
        **Retry** for the files with no Store, as a Store's
        (`POST /v1/admin/stores/{id}/stuck-files/retry`): each goes back to
        waiting, its tries counted from nought again, and the mover is woken.
        Takes no body; answers `204`. With none stuck, it changes nothing.

        - `503 storage-unavailable` on a server without Healdan's storage
          module.
        - `409 refused` while storage backends are off.

        Recorded as `storage.stuck-retried`, naming no Store; with none
        stuck, it changes nothing and isn't recorded.
      tags: [Storage]
      responses:
        '204':
          description: Waiting again
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/admin/groups:
    get:
      operationId: adminListGroups
      summary: The groups
      description: |
        The groups, for the forms that name one, such as New Store's **who
        can see it** (Admin app spec section 8.6): live groups only, not a
        person's own group (`_user_…`), by name, ignoring case. A page of
        `limit` from `offset`, with the total once `q` has filtered them.

        `q`, read with the whitespace at either end taken off, in any case,
        its `%` and `_` taken as they are, keeps the groups whose name
        contains it. Without it, or blank, every group.

        A negative `offset` or a `limit` outside 1 to 200 is
        `400 bad-request`.
      tags: [People]
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a group's name
          schema:
            type: string
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        The browser's web session, for the Admin app, served from the same
        origin, on the rules `openapi.yaml`'s `cookieAuth` describes. A device
        token, sent as a Bearer `Authorization` header, is
        `403 web-session-only` here.
  parameters:
    PageOffset:
      name: offset
      in: query
      required: false
      description: How many items to skip. Default 0.
      schema:
        type: integer
        minimum: 0
    PageLimit:
      name: limit
      in: query
      required: false
      description: The most items to return, 1 to 200. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    SortOrder:
      name: order
      in: query
      required: false
      description: '`asc` (the default) or `desc`.'
      schema:
        type: string
        enum: [asc, desc]
    ClientPath:
      name: id
      in: path
      required: true
      description: The client's id
      schema:
        type: integer
        format: int64
        minimum: 0
    MatterPath:
      name: id
      in: path
      required: true
      description: The matter's id, not its folder's
      schema:
        type: integer
        format: int64
        minimum: 0
    FolderPath:
      name: id
      in: path
      required: true
      description: The id of a folder or search folder of a workspace
      schema:
        type: integer
        format: int64
        minimum: 0
    SearchFolderPath:
      name: id
      in: path
      required: true
      description: The search folder's id
      schema:
        type: integer
        format: int64
        minimum: 0
    TemplatePath:
      name: id
      in: path
      required: true
      description: The template's id, which is its folder's
      schema:
        type: integer
        format: int64
        minimum: 0
    StorePath:
      name: id
      in: path
      required: true
      description: The Store's id, which is its folder's
      schema:
        type: integer
        format: int64
        minimum: 0
    BackendPath:
      name: id
      in: path
      required: true
      description: The storage backend's id; Original's is 1
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    Problem:
      description: A refusal or an error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: |
        An RFC 9457 problem, as in `openapi.yaml`, with the codes the admin
        API answers. `validation` adds `fields`, and `secret-key-missing`
        adds `sealed`.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: '`https://healdan.com/problems/<code>`; it needn''t resolve.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: An English sentence a client can show as it is.
        code:
          type: string
          description: What clients switch on.
          examples: [web-session-only, admins-only, not-found, refused, validation, secret-key-missing,
            storage-unavailable]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        sealed:
          type: integer
          format: int64
          minimum: 1
          description: |
            For `secret-key-missing`: how many stored values are sealed with
            Healdan's missing secret key file, sign-in providers' client
            secrets and storage backends' S3 secrets among them. A new key
            would leave each to be entered again, and helpers signed in
            through a provider to sign in again
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, detail]
      properties:
        field:
          type: string
          description: |
            The field that is wrong: a property's name, or a request's member.
            One element of a list is named with its position or index, as
            `fileEmail` names a ticked attachment `attachments[2]`.
          examples: [docclass, 'attachments[2]']
        code:
          type: string
          examples: [required, not-an-email, not-an-attachment]
        detail:
          type: string
          examples: [Class is required.]
    Page:
      type: object
      description: |
        The shape of every list. A list of things is
        `allOf: [{$ref: Page}, {properties: {items: {type: array, items: {$ref: Thing}}}}]`
        with `unevaluatedProperties: false`, as `TokenPage` is.
      required: [items, offset, limit, total]
      properties:
        items:
          type: array
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        total:
          type: [integer, 'null']
          minimum: 0
          description: Null where counting would be expensive, such as a full-text search.
    Dashboard:
      type: object
      description: The Dashboard's Needs Attention and Server Health
      additionalProperties: false
      required: [attention, unchecked, health, readAt]
      properties:
        attention:
          type: array
          description: What needs acting on, each code at most once, in the order `AttentionCode` lists them
          maxItems: 8
          items:
            $ref: '#/components/schemas/AttentionItem'
        unchecked:
          type: array
          description: |
            The codes whose source couldn't be read, in the order
            `AttentionCode` lists them, so the app can say it couldn't check
            them. Empty when everything was checked.
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AttentionCode'
        health:
          type: array
          description: The ten tiles, in the order `HealthTile.name` lists them
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/HealthTile'
        readAt:
          type: string
          format: date-time
          description: |
            When the oldest answer given was read (a part that couldn't be
            read gives none); the time of the request when every part was
            read for it
    AttentionCode:
      type: string
      description: |
        What needs attention:

        - `files-stuck`: files the storage mover gave up moving to their
          Store's backend;
        - `backend-unreachable`: a storage backend that can't be reached,
          or is failing for another reason, so Healdan can't use it;
        - `index-failed`: documents that couldn't be indexed, so search
          doesn't find their text;
        - `errors`: errors the server logged in the last 24 hours that
          nobody has resolved;
        - `previews-given-up`: previews that were given up on after their
          last try;
        - `job-failed`: a background job whose last run failed, unless it's
          switched off;
        - `job-overdue`: a background job that hasn't run when it should
          have;
        - `disk-low`: a disk the server writes to that is more than 85%
          full.
      enum: [files-stuck, backend-unreachable, index-failed, errors, previews-given-up, job-failed, job-overdue,
        disk-low]
    AttentionItem:
      type: object
      description: Something an administrator should act on
      additionalProperties: false
      required: [code, count, detail, link]
      properties:
        code:
          $ref: '#/components/schemas/AttentionCode'
        count:
          type: integer
          description: How many files, backends, documents, errors, previews, jobs or disks
          minimum: 1
        detail:
          type: string
          description: A line in English that says more, such as which Store or since when
          examples: ['Client Work, moving to Wasabi EU']
        link:
          type: string
          description: |
            Where it's fixed: the Admin app's address of that screen once it
            has shipped, such as `/admin/search-index`, and the Classic
            Interface, `/frontend.jsp`, until then.
          examples: [/admin/search-index, /frontend.jsp]
    HealthTile:
      type: object
      description: One of the Server Health tiles
      additionalProperties: false
      required: [name, status, detail, used, total, link, problem]
      properties:
        name:
          type: string
          description: |
            Which tile: Server (time up, Healdan's version), Database
            (product, version and size), Disk (used of total for the
            repository's volume, and the index's and logs' where they
            differ), Memory (heap used of its maximum), Sign-In (each enabled
            provider answering), Storage Backends (reachable, stuck files),
            Search Index (waiting and failed), Previews (waiting and given
            up), Background Jobs (on schedule, or which aren't) and Outgoing
            Email (whether it's set up, and whether a send failed in the last
            24 hours, from the errors the server logged sending that nobody
            has resolved: LogicalDOC logs no send that succeeds, so the last
            send's result can't be known).
          enum: [server, database, disk, memory, sign-in, storage-backends, search-index, previews, background-jobs,
            outgoing-email]
        status:
          type: string
          description: |
            `ok`; `attention` when something needs acting on, or the tile's
            part couldn't be read; `off` when what it shows isn't set up or
            is switched off, such as Outgoing Email with no mail server or
            Storage Backends on a server that doesn't use them.
          enum: [ok, attention, 'off']
        detail:
          type: [string, 'null']
          description: The tile's line in English, such as `Up 6 days, Healdan 9.3.2`; null when `problem` is set
        used:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Bytes: the Disk's and the Memory's used, and the Database's
            size; null for the other tiles, and when `problem` is set
        total:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Bytes, the Disk's and the Memory's total; null for the other tiles, and when `problem` is set
        link:
          type: string
          description: |
            The screen behind the tile: the Admin app's address once it has
            shipped, and the Classic Interface, `/frontend.jsp`, until then
          examples: [/admin/search-index, /frontend.jsp]
        problem:
          type: [string, 'null']
          description: |
            Why the tile's part couldn't be read, in English; then `status` is
            `attention`. Null when it was read.
    Usage:
      type: object
      description: |
        The Dashboard's Usage, worked out at most every 15 minutes, never by
        a request.

        Days are those of the request's `zone`, the server's without it.
        "The last 7 days" and "the last 30 days" are whole days, today
        included: the last 7 and the 30
        of `filedPerDay` add up to `documents.last7Days` and
        `documents.last30Days`. Documents are the live ones: not shortcuts,
        and not in the Trash. A matter's documents are those stamped with its
        client and matter numbers, and a Store's are its matters'.
      additionalProperties: false
      required: [computedAt, failedAt, documents, storage, matters, clients, people, signedIn, filedPerDay, stores,
        busiestMatters]
      properties:
        computedAt:
          type: [string, 'null']
          format: date-time
          description: When it was worked out; null until it has been once since the server started
        failedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the last try to work it out failed, the rest being the last
            summary that didn't; null once a try works again. The error itself
            is in the server's log, never here.
        documents:
          description: The documents, and how many were filed in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        storage:
          description: |
            The bytes of the documents' files, the current version of each,
            and of those filed in the last 7 and 30 days. Older versions,
            previews and the Trash aren't counted.
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        matters:
          description: The live matters, not deleted or in the Trash, and how many were created in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        clients:
          description: The clients, and how many were created in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        people:
          description: |
            The enabled user accounts, not system accounts such as `_system`,
            and how many were created in the last 7 and 30 days
          oneOf:
            - $ref: '#/components/schemas/UsageTotal'
            - type: 'null'
        signedIn:
          type: integer
          minimum: 0
          description: |
            How many people have a session open on this server, each once,
            counted at each request rather than with the rest
        filedPerDay:
          type: array
          description: The documents filed on each of the last 30 days, oldest first, today last; empty until worked out
          maxItems: 30
          items:
            $ref: '#/components/schemas/DayCount'
        stores:
          type: array
          description: Every Store, but Default and Templates, most bytes first, then by name
          items:
            $ref: '#/components/schemas/StoreUsage'
        busiestMatters:
          type: array
          description: The matters most documents were filed in in the last 7 days, most first, at most five
          maxItems: 5
          items:
            $ref: '#/components/schemas/BusyMatter'
    UsageTotal:
      type: object
      description: A total, and how much of it came lately
      additionalProperties: false
      required: [total, last7Days, last30Days]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        last7Days:
          type: integer
          format: int64
          minimum: 0
          description: How much of the total came in the last 7 days
        last30Days:
          type: integer
          format: int64
          minimum: 0
          description: How much of the total came in the last 30 days
    DayCount:
      type: object
      additionalProperties: false
      required: [date, count]
      properties:
        date:
          type: string
          format: date
          description: The day, in the request's `zone`
        count:
          type: integer
          format: int64
          minimum: 0
          description: How many documents were filed on it
    StoreUsage:
      type: object
      description: A Store, and what its matters hold
      additionalProperties: false
      required: [id, name, documents, bytes, backend]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        documents:
          type: integer
          format: int64
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: The size of its documents' files, the current version of each
        backend:
          description: |
            The storage backend it keeps its files on; null when the server
            doesn't use storage backends, or when they couldn't be read as
            the summary was worked out
          oneOf:
            - $ref: '#/components/schemas/StoreBackend'
            - type: 'null'
    StoreBackend:
      type: object
      description: A storage backend, as a Store names it
      additionalProperties: false
      required: [id, name, kind, encrypted]
      properties:
        id:
          type: integer
          format: int64
          description: Its id; Original, the server's own folder, is 1
        name:
          type: string
        kind:
          type: string
          description: '`local`, a folder, or `s3`, a bucket'
          enum: [local, s3]
        encrypted:
          type: boolean
    BusyMatter:
      type: object
      description: A matter documents were filed in in the last 7 days
      additionalProperties: false
      required: [id, number, name, filed]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
        filed:
          type: integer
          format: int64
          minimum: 1
          description: How many documents were filed in it in the last 7 days
    Found:
      type: object
      description: What the find found, at most five of each
      additionalProperties: false
      required: [clients, matters, people]
      properties:
        clients:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/FoundClient'
        matters:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/FoundMatter'
        people:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/FoundPerson'
    FoundClient:
      type: object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
    FoundMatter:
      type: object
      additionalProperties: false
      required: [id, number, name, client]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
        client:
          $ref: '#/components/schemas/FoundClient'
    FoundPerson:
      type: object
      additionalProperties: false
      required: [id, username, name, enabled]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
          description: The first and last name
        enabled:
          type: boolean
          description: False for a disabled account, which can't sign in
    Client:
      type: object
      description: A client, with its matters' figures
      additionalProperties: false
      required: [id, number, name, matters, documents, lastActivity]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
          description: Its number, which never changes
        name:
          type: string
        matters:
          type: integer
          format: int64
          minimum: 0
          description: How many live matters it has, not deleted or in the Trash
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Its matters' live documents, not shortcuts and not in the Trash,
            counted through the client and matter stamped on them, as the
            summary last counted them; null until the summary has been worked
            out since the server started
        lastActivity:
          type: [string, 'null']
          format: date-time
          description: |
            When one of its matters' documents was last filed or saved, as
            the summary last found it; null with none, or until the summary
            has been worked out
    ClientList:
      description: A page of clients, and when their figures were worked out
      allOf:
        - $ref: '#/components/schemas/Page'
        - required: [figuresAt]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Client'
            figuresAt:
              type: [string, 'null']
              format: date-time
              description: |
                When the summary that gives `documents` and `lastActivity`
                was worked out; null until it has been since the server
                started
      unevaluatedProperties: false
    NewClient:
      type: object
      description: A new client
      additionalProperties: false
      required: [number, name]
      properties:
        number:
          type: integer
          format: int64
          description: Its number, 1 or more, which never changes; `GET /v1/admin/clients/next-number` suggests one
        name:
          type: string
          description: Its name, at most 255 characters
    NameChange:
      type: object
      description: A client's new name
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: At most 255 characters
    NextNumber:
      type: object
      description: The number to suggest
      additionalProperties: false
      required: [number]
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
    ClientBrief:
      type: object
      description: A client named in another object
      additionalProperties: false
      required: [id, number, name]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        name:
          type: string
    StoreBrief:
      type: object
      description: A Store named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    TemplateBrief:
      type: object
      description: A workspace template named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: Its id, which is its folder's
        name:
          type: string
    FolderBrief:
      type: object
      description: A folder named in another object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PersonBrief:
      type: object
      description: A person named in another object
      additionalProperties: false
      required: [id, username, name]
      properties:
        id:
          type: integer
          format: int64
          description: The user's id
        username:
          type: string
        name:
          type: string
          description: The first and last name; the username when both are blank
    MatterRow:
      type: object
      description: A matter, as the Matters list shows it
      additionalProperties: false
      required: [id, number, name, client, store, owner, template, documents, bytes, lastActivity, folderId]
      properties:
        id:
          type: integer
          format: int64
          description: The matter's id, not its folder's
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
          description: Its own name, without its number
        client:
          $ref: '#/components/schemas/ClientBrief'
        store:
          $ref: '#/components/schemas/StoreBrief'
        owner:
          description: Who owns it; null when that person's account has been deleted
          oneOf:
            - $ref: '#/components/schemas/PersonBrief'
            - type: 'null'
        template:
          description: |
            The workspace template it was made from; null when it was made
            from none, or that template has been deleted since
          oneOf:
            - $ref: '#/components/schemas/TemplateBrief'
            - type: 'null'
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Its live documents, not shortcuts and not in the Trash, counted
            through the client and matter stamped on them, as the summary
            last counted them; null until the summary has been worked out
            since the server started, and 0 for a matter made since the last
            one
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: The size of those documents' files, the current version of each; null as `documents` is
        lastActivity:
          type: [string, 'null']
          format: date-time
          description: |
            When one of its documents was last filed or saved, as the
            summary last found it; null with none, or until the summary has
            been worked out
        folderId:
          type: integer
          format: int64
          description: |
            Its own folder, the top of its workspace:
            `GET /v1/admin/workspaces/{folderId}/tree` takes it, and so does
            the User app
    MatterList:
      description: A page of matters, and when their figures were worked out
      allOf:
        - $ref: '#/components/schemas/Page'
        - required: [figuresAt]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MatterRow'
            figuresAt:
              type: [string, 'null']
              format: date-time
              description: |
                When the summary that gives `documents`, `bytes` and
                `lastActivity` was worked out; null until it has been since
                the server started
      unevaluatedProperties: false
    Matter:
      type: object
      description: A matter, for its page
      additionalProperties: false
      required: [id, number, name, description, client, store, owner, template, documents, bytes, lastActivity,
        figuresAt, folderId, indexFailed, previewsGivenUp]
      properties:
        id:
          type: integer
          format: int64
          description: The matter's id, not its folder's
        number:
          type: string
          description: Its number with its client's
          examples: ['1001.1']
        name:
          type: string
          description: Its own name, without its number
        description:
          type: [string, 'null']
        client:
          $ref: '#/components/schemas/ClientBrief'
        store:
          $ref: '#/components/schemas/StoreBrief'
        owner:
          description: Who owns it; null when that person's account has been deleted
          oneOf:
            - $ref: '#/components/schemas/PersonBrief'
            - type: 'null'
        template:
          description: |
            The workspace template it was made from; null when it was made
            from none, or that template has been deleted since
          oneOf:
            - $ref: '#/components/schemas/TemplateBrief'
            - type: 'null'
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: As in `MatterRow`, from the summary
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: As in `MatterRow`, from the summary
        lastActivity:
          type: [string, 'null']
          format: date-time
          description: As in `MatterRow`, from the summary
        figuresAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the summary that gives `documents`, `bytes` and
            `lastActivity` was worked out, as `MatterList`'s; null until it
            has been since the server started
        folderId:
          type: integer
          format: int64
          description: Its own folder, the top of its workspace
        indexFailed:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of its live documents couldn't be indexed, as the
            Dashboard's `index-failed` counts them, counted at the request
        previewsGivenUp:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of its live documents' previews were given up on after
            their last try, as the Dashboard's `previews-given-up` counts
            them, counted at the request
    NewMatter:
      type: object
      description: What New Matter creates
      additionalProperties: false
      required: [clientId, number, name, storeId, ownerId, templateId]
      properties:
        clientId:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
          description: |
            The matter's number within its client, such as 2 for `1004.2`;
            `GET /v1/admin/matters/next-number` suggests one
        name:
          type: string
          description: Its own name, without its number
        description:
          type: [string, 'null']
          description: At most 4,000 characters; null, blank or left out for none
        storeId:
          type: integer
          format: int64
          description: The Store its folder goes in
        ownerId:
          type: integer
          format: int64
          description: The user who owns it, whose own group gets Full Access
        templateId:
          type: integer
          format: int64
          description: The workspace template its folders are copied from
    MatterDraft:
      type: object
      description: |
        New Matter's form as it stands, for its check: `NewMatter`'s members,
        any of them left out or null
      additionalProperties: false
      properties:
        clientId:
          type: [integer, 'null']
          format: int64
        number:
          type: [integer, 'null']
          format: int64
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        storeId:
          type: [integer, 'null']
          format: int64
        ownerId:
          type: [integer, 'null']
          format: int64
        templateId:
          type: [integer, 'null']
          format: int64
    MatterCheck:
      type: object
      description: What creating the draft would refuse
      additionalProperties: false
      required: [problems]
      properties:
        problems:
          type: array
          description: Empty when nothing is found; in the order `MatterProblemCode` lists the codes
          items:
            $ref: '#/components/schemas/MatterProblem'
    MatterProblemCode:
      type: string
      description: |
        What New Matter's check finds, each looked for once the draft gives
        the members in brackets:

        - `client-missing` (`clientId`): the client no longer exists.
        - `number-invalid` (`number`): a number below 1.
        - `number-taken` (`clientId` and `number`, or `number` alone when
          numbers are system-wide): a matter already has the number, a
          deleted one too.
        - `name-invalid` (a `name` that isn't blank): a `/`, a `\` or markup,
          or, once `clientId` and `number` are given too, too long for the
          folder's name with the matter's number before it.
        - `description-invalid` (`description`): over 4,000 characters.
        - `store-missing` (`storeId`): not a live Store.
        - `template-missing` (`templateId`): not a live template.
        - `owner-missing` (`ownerId`): there's no such person.
        - `owner-disabled` (`ownerId`): the person's account is disabled.
        - `wider-than-parent` (`templateId`): a folder of the template grants
          a group something its parent doesn't (P1), once for each such
          folder, with the group the first excess is about.
        - `store-unreadable` (`templateId` and `storeId`, and `ownerId` for
          the owner): a group the template would let into the matter, or the
          owner, can't read the Store (P2), once for each, with `storeId`,
          `groupId` and `groupName`, and `fixAction` `grant-store-read`.
      enum: [client-missing, number-invalid, number-taken, name-invalid, description-invalid, store-missing,
        template-missing, owner-missing, owner-disabled, wider-than-parent, store-unreadable]
      examples: [number-taken, store-unreadable]
    MatterProblem:
      type: object
      description: One thing creating the draft would refuse
      additionalProperties: false
      required: [code, message, fixAction, storeId, groupId, groupName]
      properties:
        code:
          $ref: '#/components/schemas/MatterProblemCode'
        message:
          type: string
          description: An English sentence that says what's wrong, which the app can show as it is
          examples: [Everyone can't read the Store Regional Office.]
        fixAction:
          type: [string, 'null']
          description: |
            How New Matter can put it right there: `grant-store-read`, **Let
            {group} Read the Store**, which is
            `PUT /v1/admin/stores/{storeId}/access` with `groupId` added to
            who can see the Store, then the check again. Null for a problem
            the form puts right itself.
          enum: [grant-store-read, null]
        storeId:
          type: [integer, 'null']
          format: int64
          description: The Store it's about, for `store-unreadable`; null otherwise
        groupId:
          type: [integer, 'null']
          format: int64
          description: |
            The group it's about, a person's own group for a person: for
            `store-unreadable`, and `wider-than-parent` when it names one;
            null otherwise
        groupName:
          type: [string, 'null']
          description: |
            That group's name, or that person's first and last name (the
            username when both are blank), for **Let {group} Read the
            Store**; null with no `groupId`
    MatterChange:
      type: object
      description: |
        What **Edit** changes, each member left out staying as it is. A
        matter's client, number and template never change, and its Store
        changes by a move: those members are `422 validation`
        (`not-editable`).
      additionalProperties: false
      properties:
        name:
          type: string
          description: Its own name, without its number
        description:
          type: [string, 'null']
          description: At most 4,000 characters; null or blank for none
        ownerId:
          type: integer
          format: int64
          description: The user who owns it
    MatterMove:
      type: object
      description: Where a matter moves
      additionalProperties: false
      required: [storeId]
      properties:
        storeId:
          type: integer
          format: int64
          description: The Store its folder moves into
    DeletedMatter:
      type: object
      description: The Trash item a matter's delete made
      additionalProperties: false
      required: [trashItemId, folders, documents]
      properties:
        trashItemId:
          type: integer
          format: int64
          description: |
            The item in the caller's Trash that holds the matter's folder,
            which `POST /v1/trash/{id}/restore` restores and the User app's
            Trash lists
        folders:
          type: integer
          format: int64
          minimum: 0
          description: The folders in the matter's folder that went with it, at every level, its own left out
        documents:
          type: integer
          format: int64
          minimum: 0
          description: The documents that went with it
    DeletedFolder:
      type: object
      description: The Trash item a workspace folder's, a template's or a Store's delete made
      additionalProperties: false
      required: [trashItemId, folders, documents]
      properties:
        trashItemId:
          type: integer
          format: int64
          description: |
            The item in the caller's Trash that holds the folder, which the
            User app's Trash lists. `POST /v1/trash/{id}/restore` restores a
            matter's folder back where it was; a template's, or a folder of
            one, it answers `409 place-gone`, as it restores into a Store
            only; and a Store's `409 refused`, as
            `POST /v1/admin/stores/{id}/restore` restores a Store
        folders:
          type: integer
          format: int64
          minimum: 0
          description: |
            The folders and search folders in it that went with it, at every
            level, its own left out: a Store's matters' own folders among them
        documents:
          type: integer
          format: int64
          minimum: 0
          description: The documents that went with it; none in a template
    WorkspaceNode:
      type: object
      description: A folder or search folder of a workspace, with what's in it
      additionalProperties: false
      required: [id, name, kind, ownPermissions, children]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          description: '`folder`, or a `search-folder`, which lists documents by its rule and holds no folders'
          enum: [folder, search-folder]
        ownPermissions:
          type: boolean
          description: True when it has permissions of its own, false when it follows another folder's
        children:
          type: array
          description: Its folders, then its search folders, each by name, ignoring case; none for a search folder
          items:
            $ref: '#/components/schemas/WorkspaceNode'
    FolderName:
      type: string
      description: |
        A folder's name: a workspace folder's or search folder's, a
        template's or a Store's, with the whitespace at either end taken off. `422 validation` for
        the field `name` as `renameFolder` in `openapi.yaml` answers it:
        `required`, also for a name of characters that show nothing, such as
        U+200B; `too-long`, over 255 characters; and `invalid`, for a `/`, a
        `\`, a control character, one that changes the text's direction, any
        HTML tag, or a character reference such as `&amp;`.
    FolderRename:
      type: object
      description: A folder's, a template's or a Store's new name
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
    NewWorkspaceFolder:
      type: object
      description: A new folder of a workspace
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
    FolderMove:
      type: object
      description: Where a workspace's folder moves
      additionalProperties: false
      required: [folderId]
      properties:
        folderId:
          type: integer
          format: int64
          description: The folder it moves into, of the same workspace
    Permission:
      type: string
      description: |
        One of LogicalDOC's 25 permissions, in its order, which **Show Every
        Permission** lists
      enum: [read, download, write, add, security, immutable, delete, rename, import, export, sign, archive, workflow,
        calendar, subscription, print, password, move, email, automation, store, readingreq, preview, customid,
        revision]
    AccessLevel:
      type: string
      description: |
        A row's permissions as a level, an exact match (Admin app spec
        section 8.4):

        - `read-only`: read, preview, download, print and email;
        - `read-write`: Read Only's, plus write, add, rename, move and
          delete;
        - `full-access`: all 25, what a matter's owner gets;
        - `can-see`: read alone, a Store's one level; the Workspace Editor
          shows it as Custom on a folder;
        - `custom`: anything else.
      enum: [read-only, read-write, full-access, can-see, custom]
    AccessRow:
      type: object
      description: What a folder or Store grants a group or a person
      additionalProperties: false
      required: [groupId, name, person, userId, level, permissions, owner]
      properties:
        groupId:
          type: integer
          format: int64
          description: The group, or the person's own group
        name:
          type: string
          description: The group's name, or the person's first and last name (the username when both are blank)
        person:
          type: boolean
          description: True for a person's own group
        userId:
          type: [integer, 'null']
          format: int64
          description: The person, for a person's own group; null for a group
        level:
          $ref: '#/components/schemas/AccessLevel'
        permissions:
          type: array
          description: What it grants, at least one, in the order `Permission` lists them
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        owner:
          type: boolean
          description: |
            True for the matter's owner's own group, on any folder of the
            matter; false elsewhere, and on a Store
    FolderAccess:
      type: object
      description: Who can use a workspace's folder
      additionalProperties: false
      required: [folderId, ownPermissions, followsFolderId, rows, canApplyToSubfolders]
      properties:
        folderId:
          type: integer
          format: int64
        ownPermissions:
          type: boolean
          description: True when it has permissions of its own; false when it follows another folder's
        followsFolderId:
          type: [integer, 'null']
          format: int64
          description: |
            When it follows, the folder whose permissions it takes, which may
            be above its parent, or its Store; null with its own
        rows:
          type: array
          description: |
            What it grants, groups first, then people, each by name, ignoring
            case; a group or person it grants nothing isn't listed
          items:
            $ref: '#/components/schemas/AccessRow'
        canApplyToSubfolders:
          type: boolean
          description: |
            Whether **Apply to Subfolders** is offered: it has a live folder
            below it (one in the Trash doesn't count), and Healdan's rules
            allow it (`checkApplyToTree`)
    FolderAccessChange:
      type: object
      description: |
        A folder's new permissions: `rows`, its own; or `followParent: true`,
        its parent's. One of the two, never both.
      additionalProperties: false
      properties:
        followParent:
          type: boolean
          description: True to give up its own permissions and follow its parent's
        rows:
          type: array
          description: Its own permissions, each group or person once; one left out gets none here
          items:
            $ref: '#/components/schemas/AccessGrant'
    AccessGrant:
      type: object
      description: |
        What a folder grants a group, by `groupId`, or a person, by `userId`,
        whose own group gets it: one of the two. A person's own group may be
        named by its `groupId` too, as `AccessRow` gives it, so a row can be
        sent back as it came; naming a person by `userId` and by their own
        group's `groupId` names them twice (`duplicate`).
      additionalProperties: false
      required: [permissions]
      properties:
        groupId:
          type: integer
          format: int64
          description: A group, or a person's own group
        userId:
          type: integer
          format: int64
          description: A person, whose own group gets the row
        permissions:
          type: array
          description: Exactly what it grants, at least one; `AccessLevel` lists each level's
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
    FolderProperties:
      type: object
      description: The values a workspace's folder sets for what's filed below it
      additionalProperties: false
      required: [folderId, properties]
      properties:
        folderId:
          type: integer
          format: int64
        properties:
          type: array
          description: Each property that passes down from folders, in the profile's order
          items:
            $ref: '#/components/schemas/FolderProperty'
    FolderProperty:
      type: object
      description: One value a folder sets, or inherits
      additionalProperties: false
      required: [name, label, type, value, source, inheritedFrom, options]
      properties:
        name:
          type: string
          description: The property's name, as `values` names it
          examples: [docclass]
        label:
          type: string
          examples: [Class]
        type:
          type: string
          description: The type of the value
          enum: [string, integer, decimal, date, boolean, user, folder, document]
        value:
          description: |
            The folder's value: its own, or what it inherits; null when it
            has none. Text for a `string`, a number for an `integer` or a
            `decimal`, true or false for a `boolean`, an ISO 8601 timestamp
            for a `date`, a `PropertyUser` for a `user`, the folder's id for a
            `folder` and the doc # for a `document`, as `openapi.yaml`'s
            `ProfileField` gives them.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - $ref: '#/components/schemas/PropertyUser'
            - type: 'null'
        source:
          type: [string, 'null']
          description: |
            `local`: set on this folder, which passes it down. `inherited`:
            from the folder `inheritedFrom` names. `default`: the install's
            default Class. Null when there's no value.
          enum: [local, inherited, default, null]
        inheritedFrom:
          description: The folder an inherited value comes from, or null
          oneOf:
            - $ref: '#/components/schemas/FolderBrief'
            - type: 'null'
        options:
          type: [array, 'null']
          description: The values to pick from, in order; null when the property isn't picked from a list
          items:
            $ref: '#/components/schemas/PropertyOption'
    PropertyUser:
      type: object
      description: A person a `user` property names
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: [string, 'null']
    PropertyOption:
      type: object
      description: One value of a property picked from a list
      additionalProperties: false
      required: [value, label, class]
      properties:
        value:
          type: string
        label:
          type: string
        class:
          type: [string, 'null']
          description: For a Subclass, the Class it belongs to, so the list can narrow to the chosen Class; null otherwise
    FolderPropertiesChange:
      type: object
      description: A folder's values, the whole set
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: object
          description: |
            Each value the folder sets, by the property's name, as
            `FolderProperty.value` gives it (a `user` by its id, or the
            `{id, name}` given). A property that's null, empty text or left
            out inherits.
          additionalProperties:
            $ref: '#/components/schemas/FolderPropertyValue'
          examples:
            - docclass: Correspondence
              docsubclass: null
    FolderPropertyValue:
      description: |
        A value as a request sends it, in the form `FolderProperty.value`
        has. Text is at most 4,000 characters once cleaned of markup.
      oneOf:
        - type: string
          maxLength: 4000
        - type: number
        - type: boolean
        - type: object
          description: A user, by its `id`, as `PropertyUser` or alone
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: [string, 'null']
        - type: 'null'
    SearchFolderRule:
      type: object
      description: |
        Which documents a search folder lists: those of its matter changed
        within the window, that match the rest, which whoever opens it can
        read, newest change first. Sent back as `GET` gives it, every member
        given.
      additionalProperties: false
      required: [days, onlyMine, kind, docClass, docSubclass]
      properties:
        days:
          type: integer
          minimum: 1
          description: The window, documents changed in the last so many days, counted back from when it's opened
        onlyMine:
          type: boolean
          description: True when only the changes of whoever opens it count
        kind:
          type: string
          description: '`all` documents, `documents` only (not emails), or `emails` only (`.eml` and `.msg` files)'
          enum: [all, documents, emails]
        docClass:
          type: [string, 'null']
          description: |
            The Class the documents must have; null for any. The editor offers
            the `docclass` property's `options`, which
            `GET /v1/admin/folders/{id}/properties` gives for any folder of
            the workspace, the search folder's own being refused
        docSubclass:
          type: [string, 'null']
          description: |
            The Subclass the documents must have, only with a `docClass`; null
            for any. The editor offers the `docsubclass` property's `options`
            whose `class` is the chosen Class
    SearchFolder:
      type: object
      description: A search folder of a workspace, with its rule
      additionalProperties: false
      required: [id, name, rule]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        rule:
          $ref: '#/components/schemas/SearchFolderRule'
    NewSearchFolder:
      type: object
      description: A new search folder
      additionalProperties: false
      required: [name, rule]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        rule:
          $ref: '#/components/schemas/SearchFolderRule'
    SearchFolderChange:
      type: object
      description: |
        A search folder's new rule. Its name changes only through
        `PATCH /v1/admin/folders/{id}`, as a folder's does.
      additionalProperties: false
      required: [rule]
      properties:
        rule:
          $ref: '#/components/schemas/SearchFolderRule'
    TemplateInfo:
      type: object
      description: A workspace template
      additionalProperties: false
      required: [id, name, folders, matters]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Its id, which is its folder's: New Matter's `templateId`, and the
            `folderId` of `GET /v1/admin/workspaces/{folderId}/tree`
        name:
          type: string
        folders:
          type: integer
          format: int64
          minimum: 0
          description: The live folders and search folders in it, at every level, its own and any folder alias left out
        matters:
          type: integer
          format: int64
          minimum: 0
          description: The live matters made from it, not deleted or in the Trash
    NewTemplate:
      type: object
      description: A new workspace template
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        copyOf:
          type: [integer, 'null']
          format: int64
          description: The template to copy; null or left out for an empty one
    TemplateProblem:
      type: object
      description: Something New Matter would refuse in a matter made from the template
      additionalProperties: false
      required: [code, message, folderId, storeId, groupId, groupName]
      properties:
        code:
          type: string
          description: |
            `wider-than-parent`: a folder grants a group something its parent
            doesn't (P1). `store-unreadable`: a group that could read a matter
            made from it can't read a Store (P2).
          enum: [wider-than-parent, store-unreadable]
        message:
          type: string
          description: An English sentence that says what's wrong, which the app can show as it is
          examples: ["Privileged grants more than the folder it's in (group Partners: WRITE)."]
        folderId:
          type: [integer, 'null']
          format: int64
          description: The folder that grants more than its parent, for `wider-than-parent`; null otherwise
        storeId:
          type: [integer, 'null']
          format: int64
          description: The Store, for `store-unreadable`; null otherwise
        groupId:
          type: [integer, 'null']
          format: int64
          description: The group it's about, a person's own group for a person; null when it names none
        groupName:
          type: [string, 'null']
          description: |
            That group's name, or that person's first and last name (the
            username when both are blank), as `MatterProblem.groupName`; null
            with no `groupId`
    Store:
      type: object
      description: A Store, as its create answers it; `StoreInfo` has the rest
      additionalProperties: false
      required: [id, name, backendId]
      properties:
        id:
          type: integer
          format: int64
          description: Its id, which is its folder's
        name:
          type: string
        backendId:
          type: integer
          format: int64
          description: |
            The backend it keeps its files on: the one asked for, or Original,
            1, when none was asked for or it couldn't be given the one asked
            for
    NewStore:
      type: object
      description: A new Store, who can see it, and the storage backend it keeps its files on
      additionalProperties: false
      required: [name, groupIds]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        groupIds:
          type: array
          description: The groups, or people's own groups, that can see it, each given Read; empty for administrators alone
          uniqueItems: true
          items:
            type: integer
            format: int64
        backendId:
          type: [integer, 'null']
          format: int64
          description: |
            The storage backend it keeps its files on, one offered to Stores;
            null or left out for Original, the server's own folder, whose id
            is 1
    StoreAccess:
      type: object
      description: Who can see a Store
      additionalProperties: false
      required: [storeId, rows]
      properties:
        storeId:
          type: integer
          format: int64
        rows:
          type: array
          description: |
            Each group and person with permissions on it, groups first, then
            people, each by name, ignoring case; a row's `level` is
            `can-see` or `custom`, and its `owner` false
          items:
            $ref: '#/components/schemas/AccessRow'
    StoreAccessChange:
      type: object
      description: Who can see a Store from then on
      additionalProperties: false
      required: [groupIds]
      properties:
        groupIds:
          type: array
          description: |
            The groups, or people's own groups, that can see it, each given
            Read; every other group's row goes. Empty for administrators
            alone.
          uniqueItems: true
          items:
            type: integer
            format: int64
    StoreInfo:
      type: object
      description: A Store, as the Stores list and its page show it
      additionalProperties: false
      required: [id, name, matters, documents, bytes, figuresAt, readers, backend, pending]
      properties:
        id:
          type: integer
          format: int64
          description: Its id, which is its folder's
        name:
          type: string
        matters:
          type: integer
          format: int64
          minimum: 0
          description: How many live matters it holds, not deleted or in the Trash, counted at the request
        documents:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            Its matters' live documents, not shortcuts and not in the Trash,
            counted through the client and matter stamped on them, as the
            summary last counted them; null until the summary has been worked
            out since the server started
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: The size of those documents' files, the current version of each; null as `documents` is
        figuresAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the summary that gives `documents` and `bytes` was worked
            out; null until it has been since the server started
        readers:
          type: array
          description: |
            Who can see it: each group and person whose row on it grants
            Read, groups first, then people, each by name, ignoring case, as
            `GET /v1/admin/stores/{id}/access` lists them. Empty when only
            administrators can
          items:
            $ref: '#/components/schemas/StoreReader'
        backend:
          description: |
            The storage backend it keeps its files on, Original when it has no
            other; null while storage backends are off, and on a server
            without Healdan's storage module
          oneOf:
            - $ref: '#/components/schemas/StoreBackend'
            - type: 'null'
        pending:
          description: Its files that haven't reached its backend, and those the mover gave up on; null as `backend` is
          oneOf:
            - $ref: '#/components/schemas/PendingFiles'
            - type: 'null'
    StoreReader:
      type: object
      description: A group, or a person, that can see a Store
      additionalProperties: false
      required: [groupId, name, person]
      properties:
        groupId:
          type: integer
          format: int64
          description: The group, or the person's own group, as `AccessRow` gives it
        name:
          type: string
          description: The group's name, or the person's first and last name (the username when both are blank)
        person:
          type: boolean
          description: True for a person's own group
    DeletedStore:
      type: object
      description: A Store in the Trash
      additionalProperties: false
      required: [id, name, trashItemId, state, matters, deletedAt, deletedBy, removedAt, destroyAfter]
      properties:
        id:
          type: integer
          format: int64
          description: The Store's id, which is its folder's, as `POST /v1/admin/stores/{id}/restore` takes it
        name:
          type: string
          description: Its name, as it was deleted
        trashItemId:
          type: integer
          format: int64
          description: The Trash item that holds it, which its delete made
        state:
          type: string
          description: |
            `deleted`, in its Trash; `removed`, taken out of the Trash:
            what's in it is destroyed for good after `destroyAfter`, while
            the Store itself and its matters' own folders never are, so it
            stays listed and an administrator can still restore it, empty
          enum: [deleted, removed]
        matters:
          type: integer
          format: int64
          minimum: 0
          description: How many matters went to the Trash with it, and are in its item still
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          description: |
            Who deleted it; null when the server's data doesn't say, or that
            person's account has been deleted
          oneOf:
            - $ref: '#/components/schemas/PersonBrief'
            - type: 'null'
        removedAt:
          type: [string, 'null']
          format: date-time
          description: When it was removed from the Trash; null unless `removed`
        destroyAfter:
          type: [string, 'null']
          format: date-time
          description: |
            The night the server destroys what's in it for good, once it has
            been removed for the days the administrators set, never the Store
            itself; null unless `removed`
    StoreBackendChange:
      type: object
      description: The storage backend a Store keeps its files on from then on
      additionalProperties: false
      required: [backendId]
      properties:
        backendId:
          type: integer
          format: int64
          description: The backend, one offered to Stores; Original's id is 1
    StoreStorage:
      type: object
      description: The storage backend a Store keeps its files on, and its files
      additionalProperties: false
      required: [storeId, 'on', backend, files, bytes, pending, switchPreview]
      properties:
        storeId:
          type: integer
          format: int64
        'on':
          type: boolean
          description: Whether this server keeps its files through storage backends; false while they're off
        backend:
          description: Its backend, Original when it has no other; null while storage backends are off
          oneOf:
            - $ref: '#/components/schemas/StoreBackend'
            - type: 'null'
        files:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of its files are recorded, on whichever backend each is
            now; 0 while storage backends are off
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
        pending:
          $ref: '#/components/schemas/PendingFiles'
        switchPreview:
          description: |
            With `backendId`, what would move were the Store given that
            backend; null without it
          oneOf:
            - $ref: '#/components/schemas/SwitchPreview'
            - type: 'null'
    SwitchPreview:
      type: object
      description: How much would move, were a Store given another backend
      additionalProperties: false
      required: [backendId, files, bytes]
      properties:
        backendId:
          type: integer
          format: int64
          description: The backend asked about
        files:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many of the Store's files would move to it, those not on it
            now; none when nothing would, and the switch then takes effect at
            once
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
    PendingFiles:
      type: object
      description: Files that haven't reached their Store's backend yet, and those the mover gave up on
      additionalProperties: false
      required: [waiting, waitingBytes, stuck]
      properties:
        waiting:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many files wait to move to their Store's backend: after the
            Store was given another, a matter moved in from another Store, or
            saves still to be uploaded
        waitingBytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
        stuck:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many files the mover gave up on, after ten failed tries in a
            row: they stay where they are, and still open, until they're
            retried
    StuckFile:
      type: object
      description: A file the mover gave up on
      additionalProperties: false
      required: [docId, fileName, resource, attempts, lastError]
      properties:
        docId:
          type: integer
          format: int64
          description: "LogicalDOC's internal id of the document, not its doc #"
        fileName:
          type: [string, 'null']
          description: The document's file name; null when the document can't be found
        resource:
          type: string
          description: |
            Which of the document's files it is: a version's own file by its
            version, such as `1.2`, and a file made from it after that, such
            as `1.2-thumb.png` for its thumbnail or `1.2-conversion.pdf` for
            its preview
          examples: ['1.2', 1.2-thumb.png]
        attempts:
          type: integer
          minimum: 0
          description: How many times the mover has tried it
        lastError:
          type: [string, 'null']
          description: Why its last try failed, in English
    BackendOverview:
      type: object
      description: The storage backends, and the files with no Store
      additionalProperties: false
      required: ['on', backends, otherFiles]
      properties:
        'on':
          type: boolean
          description: |
            Whether this server keeps its files through storage backends;
            false when it keeps them in LogicalDOC's own store, and then
            nothing here can change
        backends:
          type: array
          description: Original first, then the others in the order they were added; none while storage backends are off
          items:
            $ref: '#/components/schemas/Backend'
        otherFiles:
          $ref: '#/components/schemas/PendingFiles'
          description: |
            The files with no Store, such as a document's saved before it had
            a folder, the Storage tab's Other Files, which have no backend to
            choose; all 0 while storage backends are off
    Backend:
      type: object
      description: |
        A storage backend, as its page and its Edit window show it. Its S3
        secret is never answered, only whether one is stored, nor its
        recovery key.
      additionalProperties: false
      required: [id, name, kind, original, path, endpoint, region, bucket, prefix, pathStyle, accessKey, hasSecret,
        encrypted, keyConfirmed, offered, inUse, files, bytes, status, error, since, keyLastShown, keyLastShownBy,
        stores, storesInTrash]
      properties:
        id:
          type: integer
          format: int64
          description: Its id; Original's is 1
        name:
          type: string
          description: Its own name, at most 100 characters, which no other backend has in any case
        kind:
          type: string
          description: '`local`, a folder, or `s3`, a bucket at an S3 service'
          enum: [local, s3]
        original:
          type: boolean
          description: |
            True for Original, the folder the server has always kept files in,
            which every Store keeps its files on until it's given another
        path:
          type: [string, 'null']
          description: |
            A folder's whole path in the server's container, such as
            `/mnt/archive`; Original's comes from the server's configuration
            and can't change here. Null for S3
          examples: [/mnt/archive]
        endpoint:
          type: [string, 'null']
          description: |
            S3's endpoint, its scheme, host and port only; null for a folder,
            and for an S3 endpoint stored that can't be read as an address
            with a host
          examples: ['https://s3.eu-west-1.wasabisys.com']
        region:
          type: [string, 'null']
          description: S3's region; null for a folder
          examples: [eu-west-1]
        bucket:
          type: [string, 'null']
          description: S3's bucket; null for a folder
        prefix:
          type: [string, 'null']
          description: S3's folder in the bucket, as kept, ending in `/`, or empty for none; null for a folder
          examples: [healdan/]
        pathStyle:
          type: boolean
          description: |
            S3's path-style addressing, the bucket in the address's path
            rather than its host name; false for a folder
        accessKey:
          type: [string, 'null']
          description: S3's access key ID, as the Storage tab shows it; null for a folder. The secret is never answered
        hasSecret:
          type: boolean
          description: |
            True when an S3 secret is stored that the server can read; false
            for a folder, and when the stored one can't be read, as after a
            new secret key, so it's typed again
        encrypted:
          type: boolean
          description: Whether its files are encrypted, as its add chose; it never changes, and Original never is
        keyConfirmed:
          type: boolean
          description: |
            For an encrypted backend, whether its recovery key's last group
            was typed back, which shows it was saved; false otherwise
        offered:
          type: boolean
          description: |
            Whether a Store can be given it: true but for an encrypted backend
            whose recovery key isn't confirmed
        inUse:
          type: boolean
          description: |
            True while a file is recorded or a copy held on it: its bucket,
            prefix or path can't change then
        files:
          type: integer
          format: int64
          minimum: 0
          description: How many files are recorded on it
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Their size
        status:
          $ref: '#/components/schemas/BackendStatus'
        error:
          type: [string, 'null']
          description: |
            Why it's failing, in English, naming it as "this backend"; null
            unless `status` is `unreachable` or `failing`
        since:
          type: [string, 'null']
          format: date-time
          description: When it entered its status, such as since when it has been failing; null while `unchecked`
        keyLastShown:
          type: [string, 'null']
          format: date-time
          description: |
            When its recovery key was last shown, at its add or since; null if
            never, and for one not encrypted
        keyLastShownBy:
          type: [string, 'null']
          description: The username of whom it was last shown to; null as `keyLastShown` is
        stores:
          type: array
          description: |
            The names of the Stores that keep their files on it, by name,
            ignoring case: for Original, every Store with no other backend.
            The Templates Store isn't among them
          items:
            type: string
        storesInTrash:
          type: array
          description: |
            The names of the Stores in the Trash, deleted or removed and not
            destroyed yet, that keep their files on it, by name, ignoring
            case: for Original, every such Store with no other backend. Their
            files stay on it while they're in the Trash, as a restore brings
            them back, so it can't be removed, nor its bucket, prefix or path
            changed, until each is restored, given another backend and deleted
            again. The Templates Store is never among them
          items:
            type: string
    BackendStatus:
      type: string
      description: |
        A backend's status, from its last use, Test or check:

        - `unchecked`: not checked since the server started, which checks
          every backend as it starts;
        - `ok`: its last check passed;
        - `unreachable`: failing because it can't be reached, an outage,
          whose moves pause until it's back;
        - `failing`: failing for another reason, such as its marker missing
          or its credentials refused.
      enum: [unchecked, ok, unreachable, failing]
    NewBackend:
      type: object
      description: |
        A new backend: a folder's `path`, or an S3 bucket's settings. Members
        of the other kind are left out or null.
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          description: |
            `local`, a folder, or `s3`, a bucket at an S3 service; any other
            value is `422 validation` (`invalid`), not `400`
          enum: [local, s3]
        name:
          type: string
          description: Its own name, at most 100 characters
        path:
          type: [string, 'null']
          description: A folder's whole path in the server's container, from `/`
          examples: [/mnt/archive]
        endpoint:
          type: [string, 'null']
          description: |
            S3: the service's address for the bucket's region, `https://`, or
            `http://` only for an S3 server whose every address is on a
            private network, with path style
          examples: ['https://s3.eu-west-1.wasabisys.com']
        region:
          type: [string, 'null']
        bucket:
          type: [string, 'null']
        prefix:
          type: [string, 'null']
          description: |
            S3, optional, a folder in the bucket, to which Healdan adds a `/`;
            null, blank or left out for none
        pathStyle:
          type: [boolean, 'null']
          description: S3, the bucket in the address's path rather than its host name; false when null or left out
        accessKey:
          type: [string, 'null']
        secret:
          type: [string, 'null']
          description: S3's secret, never answered or shown again
        encrypted:
          type: [boolean, 'null']
          description: |
            Whether its files are encrypted, chosen now and never changed;
            null or left out for the kind's own choice, true for S3 and false
            for a folder
        newKey:
          type: [boolean, 'null']
          description: |
            True to make Healdan's secret key file anew, after
            `secret-key-missing`, which leaves the values sealed with the
            missing one to be entered again; false, null or left out otherwise
    BackendTrial:
      type: object
      description: |
        Settings to test, as the add or the edit window holds them, any member
        left out or null. With `id`, they're that backend's, being edited.
      additionalProperties: false
      properties:
        id:
          type: [integer, 'null']
          format: int64
          description: The backend being edited; null or left out for one being added
        kind:
          type: [string, 'null']
          description: As `NewBackend.kind`; another value, or none, is one of the test's problems
          enum: [local, s3, null]
        name:
          type: [string, 'null']
        path:
          type: [string, 'null']
        endpoint:
          type: [string, 'null']
        region:
          type: [string, 'null']
        bucket:
          type: [string, 'null']
        prefix:
          type: [string, 'null']
        pathStyle:
          type: [boolean, 'null']
        accessKey:
          type: [string, 'null']
        secret:
          type: [string, 'null']
          description: As typed; with `id`, null or blank for the stored one
        encrypted:
          type: [boolean, 'null']
    BackendChange:
      type: object
      description: |
        A backend's new settings, each member left out staying as it is. Its
        kind and whether it's encrypted never change: those members are
        `422 validation` (`not-editable`), as is every member but `name` for
        Original.
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
          description: At most 100 characters; null or blank is `422 validation` (`required`)
        path:
          type: [string, 'null']
          description: |
            A folder's new path, only while it's not `inUse` and no Store keeps
            its files there, a Store in the Trash included. On a folder, null
            or blank is `422 validation` (`required`); on S3 or Original, null
            counts as left out
        endpoint:
          type: [string, 'null']
          description: |
            S3's new endpoint. On S3, null or blank is `422 validation`
            (`required`); on a folder or Original, null counts as left out
        region:
          type: [string, 'null']
          description: |
            S3's new region. On S3, null or blank is `422 validation`
            (`required`); on a folder or Original, null counts as left out
        bucket:
          type: [string, 'null']
          description: |
            A new bucket, only while it's not `inUse` and no Store keeps its
            files there, a Store in the Trash included. On S3, null or blank
            is `422 validation` (`required`); on a folder or Original, null
            counts as left out
        prefix:
          type: [string, 'null']
          description: |
            A new prefix, only while it's not `inUse` and no Store keeps its
            files there, a Store in the Trash included; null or blank for none
        pathStyle:
          type: [boolean, 'null']
          description: S3's path-style addressing; null or left out keeps it as it is
        accessKey:
          type: [string, 'null']
          description: |
            S3's new access key ID. On S3, null or blank is `422 validation`
            (`required`); on a folder or Original, null counts as left out
        secret:
          type: [string, 'null']
          description: A new S3 secret; null, blank or left out keeps the stored one
        newKey:
          type: [boolean, 'null']
          description: |
            As `NewBackend.newKey`, with a new `secret`; nothing without one,
            and false when null or left out
    AddedBackend:
      type: object
      description: A backend just added, and an encrypted one's recovery key
      additionalProperties: false
      required: [backend, recoveryKey]
      properties:
        backend:
          $ref: '#/components/schemas/Backend'
        recoveryKey:
          description: |
            An encrypted backend's recovery key, shown now and recorded as
            shown; null for one not encrypted
          oneOf:
            - $ref: '#/components/schemas/RecoveryKeyText'
            - type: 'null'
    RecoveryKeyText:
      type: string
      description: |
        An encrypted backend's key written out: 52 characters in 13 groups of
        four, with a space between, using no I, L, O or U. Lose both it and
        the backend's key file, and the backend's files can't be read
      pattern: '^[0-9A-HJKMNP-TV-Z]{4}( [0-9A-HJKMNP-TV-Z]{4}){12}$'
    RecoveryKey:
      type: object
      description: An encrypted backend's recovery key, as Show Recovery Key answers it
      additionalProperties: false
      required: [recoveryKey]
      properties:
        recoveryKey:
          $ref: '#/components/schemas/RecoveryKeyText'
    RecoveryKeyConfirmation:
      type: object
      description: A recovery key's last group, typed back
      additionalProperties: false
      required: [lastGroup]
      properties:
        lastGroup:
          type: string
          description: Its last four characters, as typed; any case, spaces and hyphens ignored
    RecoveryKeyEntry:
      type: object
      description: A recovery key, as typed, to put a backend's key file back
      additionalProperties: false
      required: [recoveryKey]
      properties:
        recoveryKey:
          type: string
          description: As typed or pasted; any case, spaces and hyphens ignored
    BackendTestResult:
      type: object
      description: What a test found
      additionalProperties: false
      required: [problems]
      properties:
        problems:
          type: array
          description: Each problem it found, a sentence in English the app shows as it is; empty when it passed
          items:
            type: string
    KeyEvent:
      type: object
      description: A showing or an entering of a backend's recovery key
      additionalProperties: false
      required: [event, at, userId, username]
      properties:
        event:
          type: string
          description: '`shown`, shown to an administrator; `entered`, typed in to put its key file back'
          enum: [shown, entered]
        at:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
          description: The administrator's user id
        username:
          type: string
          description: The administrator's username then
    StorageSettings:
      type: object
      description: The storage settings, and each one's limits
      additionalProperties: false
      required: ['on', holdDays, cacheGb, transfers, limits]
      properties:
        'on':
          type: boolean
          description: Whether this server keeps its files through storage backends; false while they're off
        holdDays:
          type: integer
          minimum: 1
          description: |
            The holding period, how many days an old copy is held after a move
            or a delete before the purge deletes it
        cacheGb:
          type: integer
          minimum: 1
          description: The read cache's size, in GB, for copies of S3 backends' files on the server
        transfers:
          type: integer
          minimum: 1
          description: Parallel transfers, how many files move between backends at once
        limits:
          $ref: '#/components/schemas/StorageLimits'
    StorageLimits:
      type: object
      description: Each storage setting's limits, as the server holds them
      additionalProperties: false
      required: [holdDays, cacheGb, transfers]
      properties:
        holdDays:
          $ref: '#/components/schemas/SettingRange'
        cacheGb:
          $ref: '#/components/schemas/SettingRange'
        transfers:
          $ref: '#/components/schemas/SettingRange'
    SettingRange:
      type: object
      description: The lowest and highest values a setting takes, both included
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 1
          description: Always 1
        max:
          type: integer
          minimum: 1
    StorageSettingsChange:
      type: object
      description: All three storage settings
      additionalProperties: false
      required: [holdDays, cacheGb, transfers]
      properties:
        holdDays:
          type: integer
          description: Days, from 1 to `limits.holdDays.max`
        cacheGb:
          type: integer
          description: GB, from 1 to `limits.cacheGb.max`
        transfers:
          type: integer
          description: From 1 to `limits.transfers.max`
    Group:
      type: object
      description: A group, not a person's own
      additionalProperties: false
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: [string, 'null']
          description: Its description; null for none, an empty one included
    GroupList:
      description: A page of groups
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Group'
      unevaluatedProperties: false
