  /v1/admin/templates/{id}/problems:
    get:
      operationId: adminTemplateProblems
      summary: What New Matter would refuse in a template
      description: |
        Nothing checks a template's permissions as they're edited, so the
        template's page lists, as warnings, what New Matter would refuse in
        a matter made from it, with the same rules (`AclMath` and
        `PermissionRules`); saving the template still works (Admin app spec
        section 8.4). Empty for a clean template.

        - `wider-than-parent`, once for each folder or search folder that
          grants a group something the folder it's in doesn't (P1), in the
          tree's order: one with permissions of its own, or one that still
          follows a folder above the folder it's in, as a folder made while
          the folder it's in followed that folder does once the folder it's
          in has permissions of its own (LogicalDOC's way).
        - `store-unreadable`, for each Store, once for each group that could
          read a matter made from the template but can't read that Store
          (P2), by Store name and then group name. The matter's owner, not
          known yet, is left aside: New Matter's check names the owner when
          one is chosen.

        Anything but a template is `404 not-found`.
      tags: [Matters]
      parameters:
        - $ref: '#/components/parameters/TemplatePath'
      responses:
        '200':
          description: The problems found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateProblem'
