name: Clients

# Builds and tests the desktop clients in clients/: the helper (.NET) on Ubuntu and macOS, and the LibreOffice extension's
# Python tests on Ubuntu. Packaging for helper-v* tags comes in a later task.
#
# No paths filter: the Clients check should be required, so every pull request runs the workflow and the test jobs skip
# themselves when code-changed.sh says nothing under clients/ changed. The Clients job, the check, then passes at once.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# A new push to a pull request cancels its outdated run. Pushes get a group per commit, as in build-logicaldoc.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      clients: ${{ steps.changes.outputs.clients }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          # A pull request's merge commit and its base, so code-changed.sh can list the files it changes.
          fetch-depth: 2

      - name: Check for client changes
        id: changes
        run: bash .github/scripts/code-changed.sh

  helper:
    name: Helper (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, macos-15 ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: clients/helper/global.json

      - name: Build and test the helper
        run: dotnet test clients/helper/Healdan.Helper.sln --configuration Release

  extension:
    name: LibreOffice extension (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # The runner's python3 is enough: the extension uses only the standard library, and its UNO-free logic is tested.
      - name: Test the extension
        run: python3 -m unittest discover -s clients/libreoffice/tests -v

  # The check to require in master's ruleset. It passes when the test jobs passed, or when they were skipped because
  # nothing under clients/ changed. It runs even when the run is cancelled, and then fails, so a cancelled run can't
  # count as a pass.
  clients:
    name: Clients
    needs: [ changes, helper, extension ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check the jobs' results
        env:
          CHANGES: ${{ needs.changes.result }}
          HELPER: ${{ needs.helper.result }}
          EXTENSION: ${{ needs.extension.result }}
          CLIENTS: ${{ needs.changes.outputs.clients }}
        run: |
          echo "changes: $CHANGES, helper: $HELPER, extension: $EXTENSION, clients changed: $CLIENTS"
          if [ "$CHANGES" = success ]; then
            if [ "$HELPER" = success ] && [ "$EXTENSION" = success ]; then
              exit 0
            fi
            if [ "$HELPER" = skipped ] && [ "$EXTENSION" = skipped ] && [ "$CLIENTS" = false ]; then
              exit 0
            fi
          fi
          echo "::error::The client checks didn't pass"
          exit 1
