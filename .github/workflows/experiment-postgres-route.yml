name: Experiment (PostgreSQL's route)

# EXPERIMENT, not for merging: this file leaves the branch before the pull request is ready.
#
# What a test's connections and statements cost on a runner, by the route to the PostgreSQL service container and by
# the iterations its password was hashed with. Each job has two servers, one as the Tests jobs run theirs (one SCRAM
# iteration) and one with PostgreSQL's 4,096, and times pgbench against each, at 127.0.0.1 (Docker's proxy for the
# published port, which the tests use) and at the container's own address (no proxy): a `select 1` per round trip on one
# connection, and a new connection for each. pgbench runs in the host's network, so it takes the routes a test does.
# Six jobs, as runners differ.

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  bench:
    name: Bench (${{ matrix.n }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [ 1, 2, 3, 4, 5, 6 ]
    services:
      scram1:
        image: postgres:18
        env:
          POSTGRES_USER: healdan
          POSTGRES_PASSWORD: healdan-test
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300 -c scram_iterations=1
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U healdan" --health-interval 5s --health-timeout 5s --health-retries 20
      scram4096:
        image: postgres:18
        env:
          POSTGRES_USER: healdan
          POSTGRES_PASSWORD: healdan-test
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -h 127.0.0.1 -U healdan" --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Bench
        env:
          SCRAM1: ${{ job.services.scram1.id }}
          SCRAM4096: ${{ job.services.scram4096.id }}
        run: |
          set -euo pipefail
          address() {
            docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"
          }
          one=$(address "$SCRAM1")
          many=$(address "$SCRAM4096")
          test -n "$one" && test -n "$many"
          printf 'select 1;\n' > "$RUNNER_TEMP/select1.sql"

          # bench <label> <host> <port> [pgbench options]: one client for 8 seconds, as pgjdbc sends a statement
          bench() {
            local label=$1 host=$2 port=$3
            shift 3
            docker run --rm --network host -e PGPASSWORD=healdan-test \
              -v "$RUNNER_TEMP/select1.sql:/select1.sql:ro" postgres:18 \
              pgbench -n -h "$host" -p "$port" -U healdan -f /select1.sql -M extended -c 1 -T 8 "$@" healdan 2>&1 |
              grep -E 'latency average|average connection time|^tps' | sed "s/^/RESULT $label: /"
          }

          lscpu | grep -E 'Model name|^CPU\(s\)' | sed 's/^/RESULT cpu: /'
          for round in 1 2; do
            bench "round $round, statement, proxy" 127.0.0.1 5432
            bench "round $round, statement, direct" "$one" 5432
            bench "round $round, connection, 1 iteration, proxy" 127.0.0.1 5432 -C
            bench "round $round, connection, 1 iteration, direct" "$one" 5432 -C
            bench "round $round, connection, 4096 iterations, proxy" 127.0.0.1 5433 -C
            bench "round $round, connection, 4096 iterations, direct" "$many" 5432 -C
          done
