name: Docker image

# Builds the Docker image (Dockerfile) natively on amd64 and arm64 runners; no QEMU, so the GWT compile runs at
# full speed on both. Hosted runners give it 16 GB of memory, enough for the Maven build's two GWT workers.
#
# - Every pull request, and every push that changes more than docs: per architecture, the init tool's unit tests
#   (target "tools"), then the image, then docker/smoke-test.sh against that image through compose.yaml.
# - Pushes to master and v* tags, once publishing is switched on: rebuilds each architecture from the test job's
#   cache, pushes it by digest, and joins both into one multi-arch image at ghcr.io/coffeemuse/logicaldoc-community.
#   Tags: the branch or tag name, sha-<short sha>, and latest from master.
#
# Publishing is off until the repository variable GHCR_PUBLISH is set to true (Settings → Secrets and variables →
# Actions → Variables). It authenticates with the workflow's GITHUB_TOKEN, so no secret is needed. GHCR creates the
# package on the first push; if it shows as private, make it public in the package settings so anyone can pull it.

on:
  # No paths filter: master's ruleset requires Test (amd64) and Test (arm64), and a PR the workflow skips would never
  # report them, so it could never merge.
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    # Docs-only pushes don't change the image, so they aren't rebuilt or republished.
    paths-ignore: [ 'docs/**', '**/*.md' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/coffeemuse/logicaldoc-community
  # docker/metadata-action tag rules, shared by every job. The VERSION build arg comes from them, and the publish
  # job only reuses the test job's cache when its build args are the same.
  TAG_RULES: |
    type=ref,event=branch
    type=ref,event=tag
    type=ref,event=pr
    type=sha
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAG_RULES }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Runs the Maven build too (tools builds on it). The image build below reuses it from the builder's cache.
      - name: Init tool unit tests (docker build --target tools)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: tools
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: logicaldoc-community:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          # mode=max also caches the Maven stage, so changes only under docker/ skip the Maven build.
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max,ignore-error=true

      - name: Smoke test
        env:
          LOGICALDOC_IMAGE: logicaldoc-community:ci
          SMOKE_BUILD: '0'
        run: bash docker/smoke-test.sh

  publish:
    name: Publish (${{ matrix.arch }})
    needs: test
    if: github.event_name == 'push' && vars.GHCR_PUBLISH == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAG_RULES }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Same inputs as the test job's image build, so this is a cache hit rather than a second Maven build.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAG_RULES }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR shows the index annotations on the package page (the per-architecture labels sit one level down).
      - name: Create and push the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          args+=(
            --annotation "index:org.opencontainers.image.title=LogicalDOC Community (coffeemuse fork)"
            --annotation "index:org.opencontainers.image.description=LogicalDOC Community document management on Tomcat 11"
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --annotation "index:org.opencontainers.image.version=$VERSION"
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --annotation "index:org.opencontainers.image.licenses=LGPL-3.0-only"
          )
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
