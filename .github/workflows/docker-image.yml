name: Docker image

# Builds the Docker image (Dockerfile) natively on amd64 and arm64 runners; no QEMU, so the GWT compile runs at
# full speed on both. Hosted runners give it 16 GB of memory, enough for the Maven build's two GWT workers.
#
# - Every pull request and push that changes more than docs: per architecture, the init tool's unit tests and
#   WarParsersTest (target "tools"), then the image, then docker/smoke-test.sh against that image through
#   compose.yaml. Its step 5d runs the helper's stack tests (clients/helper) against the smoke stack, with the .NET SDK
#   set up beforehand.
#   A docs-only pull request runs the test job with those steps skipped, so it still reports the required checks.
#   The Maven build gets its dependencies from an actions/cache copy instead of downloading them each time.
# - Pushes to master and v* tags, once publishing is switched on: rebuilds each architecture from the test job's
#   cache, pushes it by digest, and joins both into one multi-arch image at ghcr.io/healdan-project/healdan.
#   Tags: the branch or tag name, sha-<short sha>, and latest from master.
#
# Publishing is off until the repository variable GHCR_PUBLISH is set to true (Settings → Secrets and variables →
# Actions → Variables). It authenticates with the workflow's GITHUB_TOKEN, so no secret is needed. GHCR creates the
# package on the first push; if it shows as private, make it public in the package settings so anyone can pull it.

on:
  # No paths filter: master's ruleset requires Test (amd64) and Test (arm64), and a PR the workflow skips would never
  # report them, so it could never merge. Docs-only pull requests skip the test job's steps instead.
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    # Docs-only pushes don't change the image, so they aren't rebuilt or republished. That includes the docs site (site/).
    paths-ignore: [ 'docs/**', 'site/**', '**/*.md' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/healdan-project/healdan
  # docker/metadata-action tag rules, shared by every job. The VERSION build arg comes from them, and the publish
  # job only reuses the test job's cache when its build args are the same.
  TAG_RULES: |
    type=ref,event=branch
    type=ref,event=tag
    type=ref,event=pr
    type=sha
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Whether this job saves the Maven repository and npm caches (see "Maven repository cache").
      SAVE_M2: ${{ github.ref == 'refs/heads/master' && matrix.arch == 'amd64' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          # A pull request's merge commit and its base, so code-changed.sh can list the files it changes.
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: bash .github/scripts/code-changed.sh

      # The amd64 runner starts with 14 to 20 GB free, depending on its image's version, and the build, the image,
      # the smoke stack's Keycloak and the .NET SDK use most of it: on 2026-11-02 a run on an older image ran out of
      # disk in the smoke test. No step uses the SDKs and tool caches deleted here. The arm64 runner hasn't run short.
      - name: Free disk space (amd64)
        if: steps.changes.outputs.code == 'true' && matrix.arch == 'amd64'
        run: |
          df -h /
          start=$SECONDS
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          echo "Deleted in $((SECONDS - start)) s"
          df -h /

      - name: Image metadata
        id: meta
        if: steps.changes.outputs.code == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAG_RULES }}

      - name: Set up Buildx
        id: buildx
        if: steps.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@v4

      # The Dockerfile's Maven build keeps its dependencies in a BuildKit cache mount, which the gha cache doesn't
      # save, so without the next three steps every run downloads all 3,100 files again (about 1.5 minutes).
      # actions/cache keeps them between runs, keyed on the POMs, and buildkit-cache-dance copies them into the
      # builder's cache mount before the build. Both architectures download the same artifacts and share one copy,
      # which only master's amd64 job saves: pull requests and tags restore master's copy and download whatever
      # their POMs add. Everything stays outside the workspace, which is the build context.
      - name: Maven repository cache
        id: m2
        if: steps.changes.outputs.code == 'true' && env.SAVE_M2 == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/m2-repository
          key: docker-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: docker-m2-

      - name: Maven repository cache (restore only)
        if: steps.changes.outputs.code == 'true' && env.SAVE_M2 != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/m2-repository
          key: docker-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: docker-m2-

      # The User app's npm packages, which the Maven build's npm ci installs, in their own cache mount: the same way,
      # keyed on its lockfile.
      - name: npm cache
        id: npm
        if: steps.changes.outputs.code == 'true' && env.SAVE_M2 == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/npm-cache
          key: docker-npm-${{ hashFiles('healdan-web/web/package-lock.json') }}
          restore-keys: docker-npm-

      - name: npm cache (restore only)
        if: steps.changes.outputs.code == 'true' && env.SAVE_M2 != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/npm-cache
          key: docker-npm-${{ hashFiles('healdan-web/web/package-lock.json') }}
          restore-keys: docker-npm-

      - name: Copy the Maven repository and npm's cache into the builder
        if: steps.changes.outputs.code == 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"${{ runner.temp }}/m2-repository": "/root/.m2/repository", "${{ runner.temp }}/npm-cache": "/root/.npm"}'
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          utility-image: ghcr.io/containerd/busybox:1.36@sha256:7b3ccabffc97de872a30dfd234fd972a66d247c8cfc69b0550f276481852627c
          # The post step copies the mounts back out for actions/cache to save, which only happens when a saving cache
          # step above found no exact match: a master push whose POMs or the User app's lockfile changed.
          skip-extraction: ${{ env.SAVE_M2 != 'true' || steps.m2.outputs.cache-hit == 'true' && steps.npm.outputs.cache-hit == 'true' }}

      # Runs the Maven build too (tools builds on it). The image build below reuses it from the builder's cache.
      - name: Init tool and WAR parser tests (docker build --target tools)
        if: steps.changes.outputs.code == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: tools
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Build image
        if: steps.changes.outputs.code == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: logicaldoc-community:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          # mode=min keeps only the final image's layers. mode=max kept the Maven stage too, about 2.5 GB more per
          # architecture: each master push wrote about 5 GB and spent 5 to 13 more minutes exporting it, and on
          # 2026-11-12 two pushes in a row filled the repository's 10 GB of Actions caches, so GitHub evicted the
          # caches used least recently, the Java build's Maven repository (m2-) among them. The cost: a pull request
          # that leaves the Maven build's inputs alone (only docker/, the Dockerfile or the workflows) runs the Maven
          # build again, about 3.5 minutes per architecture. Only pushes write the cache, and pull requests read
          # what master's pushes wrote: other pull requests can't read a pull request's cache anyway.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope={0},mode=min,ignore-error=true', matrix.arch) || '' }}

      # The smoke test's step 5d runs the helper's stack tests (clients/helper, StackCycleTests and
      # StackProviderSignInTests) against the smoke stack while it's up, as smoke-test.sh removes the stack when it
      # ends. Built first so a build failure shows on its own.
      - name: Set up .NET
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: clients/helper/global.json

      - name: Build the helper's tests
        if: steps.changes.outputs.code == 'true'
        env:
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet build clients/helper/Healdan.Helper.sln

      - name: Smoke test
        if: steps.changes.outputs.code == 'true'
        env:
          LOGICALDOC_IMAGE: logicaldoc-community:ci
          SMOKE_BUILD: '0'
          SMOKE_HELPER_TEST: '1'
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: bash docker/smoke-test.sh

  publish:
    name: Publish (${{ matrix.arch }})
    needs: test
    if: github.event_name == 'push' && vars.GHCR_PUBLISH == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAG_RULES }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Same inputs as the test job's image build, so this is a cache hit rather than a second Maven build, and it
      # needs no Maven repository. The test job's repository copy stays outside the build context, so it doesn't
      # change those inputs.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ env.TAG_RULES }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR shows the index annotations on the package page (the per-architecture labels sit one level down).
      - name: Create and push the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          args+=(
            --annotation "index:org.opencontainers.image.title=Healdan (LogicalDOC Community fork)"
            --annotation "index:org.opencontainers.image.description=LogicalDOC Community document management on Tomcat 11"
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --annotation "index:org.opencontainers.image.version=$VERSION"
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --annotation "index:org.opencontainers.image.licenses=LGPL-3.0-only"
          )
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
