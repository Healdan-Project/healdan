name: Build LogicalDOC (Maven)

# Compiles every module and runs the Healdan tests. It leaves the GWT compile and the WAR to the Docker image CI
# (docker-image.yml), which builds both on every pull request and whose Test checks master also requires.

on:
  push:
    branches: [ master, main ]
    # Docs-only pushes don't change any code.
    paths-ignore: [ 'docs/**', '**/*.md' ]
  # No paths filter: master's ruleset requires build, so a docs-only pull request runs it with the build steps skipped.
  pull_request:
    branches: [ master, main ]

# A new push to a pull request cancels its outdated run. Pushes get a group per commit: GitHub cancels a run still
# pending in its group when a newer one queues, which would leave some master commits without a build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Whether this job saves the Maven repository cache (see "Maven repository cache").
      SAVE_M2: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its base, so code-changed.sh can list the files it changes.
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: bash .github/scripts/code-changed.sh

      # The GUI bundles Font Awesome Free; upstream code targets Pro
      - name: Check GUI icons against Font Awesome Free
        run: python3 .github/scripts/check-fontawesome-icons.py

      # The Dockerfile's images name the JDK, so this build and the Docker image's run the same one.
      - name: JDK version (from the Dockerfile)
        id: jdk
        if: steps.changes.outputs.code == 'true'
        run: |
          build=$(sed -n 's/^ARG MAVEN_IMAGE=maven:.*-eclipse-temurin-\([0-9]*\)$/\1/p' Dockerfile)
          runtime=$(sed -n 's/^ARG TOMCAT_IMAGE=tomcat:.*-jre\([0-9]*\)-temurin$/\1/p' Dockerfile)
          if [ -z "$build" ] || [ "$build" != "$runtime" ]; then
            echo "::error file=Dockerfile::MAVEN_IMAGE and TOMCAT_IMAGE must name the same Temurin JDK (found '$build' and '$runtime')"
            exit 1
          fi
          echo "version=$build" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      # setup-java's own Maven cache had no fallback, so a pull request that edited a POM downloaded every dependency
      # again, and failed whenever logicaldoc.sourceforge.net refused one of them. These restore the newest copy and
      # download only what the POMs add. As in docker-image.yml, only master saves. The second restore key finds the
      # copies setup-java saved: the cache version hashes the path as written, so it stays absolute, like setup-java's.
      - name: Maven repository cache
        if: steps.changes.outputs.code == 'true' && env.SAVE_M2 == 'true'
        uses: actions/cache@v6
        with:
          path: /home/runner/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-
            setup-java-Linux-x64-maven-

      - name: Maven repository cache (restore only)
        if: steps.changes.outputs.code == 'true' && env.SAVE_M2 != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-
            setup-java-Linux-x64-maven-

      - name: Configure Maven settings (LogicalDOC & Terracotta repos)
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>with-extra-repos</id>
                <repositories>
                  <!-- Maven Central -->
                  <repository>
                    <id>central</id>
                    <url>https://repo1.maven.org/maven2</url>
                  </repository>

                  <!-- LogicalDOC repository (hosts the *-jakarta Jackrabbit artifacts, etc.) -->
                  <repository>
                    <id>logicaldoc</id>
                    <url>https://logicaldoc.sourceforge.net/maven/</url>
                  </repository>

                  <!-- Terracotta repo (for org.terracotta.internal:statistics, etc.) -->
                  <repository>
                    <id>terracotta</id>
                    <url>https://repo.terracotta.org/maven2</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>with-extra-repos</activeProfile>
            </activeProfiles>
          </settings>
          EOF
      # Every module but the WAR, and the GUI's Java without its GWT compile (healdan-core needs the GUI's classes).
      # The Docker image CI runs both, and they're most of a full build's time. The antrun skip goes with the GWT one:
      # the GUI's package step edits files the GWT compile writes, and the other modules' antrun steps only finish
      # the plugin zips the WAR unpacks.
      - name: Maven install (all modules but the WAR, without the GWT compile)
        if: steps.changes.outputs.code == 'true'
        run: mvn -B -ntp -DskipTests -Dgwt.skipCompilation=true -Dmaven.antrun.skip=true -pl '!logicaldoc-webapp' install

      - name: Test Healdan
        if: steps.changes.outputs.code == 'true'
        run: |
          touch ~/logicaldoc-dev.properties
          mvn -B -ntp -pl healdan-core test

      - name: Test Healdan hooks in upstream modules
        if: steps.changes.outputs.code == 'true'
        run: mvn -B -ntp -pl logicaldoc-core,logicaldoc-webservice,logicaldoc-webapp test -Dmaven.antrun.skip=true -Dsurefire.failIfNoSpecifiedTests=false -Dtest='HealdanHooksTest,DocumentAclEqualityTest,HibernateFolderDAOTest#testMerge,StatsCollectorTest,FolderServiceImplTest,SecurityServiceImplTest#testDeleteGroupRefusedKeepsTheMembers,DocumentServiceImplTest,SearchServiceImplTest,DocumentOnlyGrantTest,BookmarksDataServletTest,RpcPermissionTest,RpcPermissionGapsTest,SoapPermissionGapsTest,DocumentsDataServletTest,ConvertPdfTest,HealdanDocNumberSortTest,InitializeReadOnlyTest,SessionManagerThrottleTest'
