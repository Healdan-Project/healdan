name: Build LogicalDOC (Maven)

# Compiles every module and runs the Healdan tests. It leaves the GWT compile and the WAR to the Docker image CI
# (docker-image.yml), which builds both on every pull request and whose Test checks master also requires.
#
# The checks job runs the quick checks and plans the test shards. Each shard is a job that compiles the modules and runs
# its share of the tests, side by side with the others. The build job, the check master's ruleset requires, passes when
# they all did.

on:
  push:
    branches: [ master, main ]
    # Docs-only pushes don't change any code. The docs site (site/) has its own workflow, docs-site.yml.
    paths-ignore: [ 'docs/**', 'site/**', '**/*.md' ]
  # No paths filter: master's ruleset requires build, so a docs-only pull request runs it with the tests skipped.
  pull_request:
    branches: [ master, main ]

# A new push to a pull request cancels its outdated run. Pushes get a group per commit: GitHub cancels a run still
# pending in its group when a newer one queues, which would leave some master commits without a build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      jdk: ${{ steps.jdk.outputs.version }}
      shards: ${{ steps.plan.outputs.shards }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its base, so code-changed.sh can list the files it changes.
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: bash .github/scripts/code-changed.sh

      # The GUI bundles Font Awesome Free; upstream code targets Pro
      - name: Check GUI icons against Font Awesome Free
        run: python3 .github/scripts/check-fontawesome-icons.py

      # Healdan's docs are docs.healdan.com; an upstream sync can bring LogicalDOC's doc links back
      - name: Check for links to LogicalDOC's docs
        run: python3 .github/scripts/check-logicaldoc-doc-links.py

      # Healdan never contacts LogicalDOC; an upstream sync can bring a call to one of its servers back
      - name: Check for LogicalDOC's servers
        run: python3 .github/scripts/check-logicaldoc-hosts.py

      # Builds get the artifacts only LogicalDOC's Maven repository has from Healdan's copies; a sync can bring
      # another of LogicalDOC's repositories in
      - name: Check Maven repositories
        run: python3 .github/scripts/check-maven-repositories.py

      # The Dockerfile's images name the JDK, so this build and the Docker image's run the same one.
      - name: JDK version (from the Dockerfile)
        id: jdk
        if: steps.changes.outputs.code == 'true'
        run: |
          build=$(sed -n 's/^ARG MAVEN_IMAGE=maven:.*-eclipse-temurin-\([0-9]*\)$/\1/p' Dockerfile)
          runtime=$(sed -n 's/^ARG TOMCAT_IMAGE=tomcat:.*-jre\([0-9]*\)-temurin$/\1/p' Dockerfile)
          if [ -z "$build" ] || [ "$build" != "$runtime" ]; then
            echo "::error file=Dockerfile::MAVEN_IMAGE and TOMCAT_IMAGE must name the same Temurin JDK (found '$build' and '$runtime')"
            exit 1
          fi
          echo "version=$build" >> "$GITHUB_OUTPUT"

      # How long each test class took in the newest run that saved its times (the test-times job): this pull request's
      # own, or else master's. The key never matches, so the restore key finds the newest.
      - name: Restore test times
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@v6
        with:
          path: test-times.txt
          key: test-times-${{ github.run_id }}
          restore-keys: test-times-

      # Every test class in a healdan-* module, plus these upstream tests, split into shards of about five minutes.
      # A class without a recorded time is estimated from its @Test count.
      - name: Plan the test shards
        id: plan
        env:
          # The upstream tests that cover Healdan's edits to upstream code, one per line: a class, or Class#method.
          UPSTREAM_TESTS: |
            HealdanHooksTest
            DocumentAclEqualityTest
            HibernateFolderDAOTest#testMerge
            StatsCollectorTest
            SettingServiceImplTest
            FolderServiceImplTest
            SecurityServiceImplTest#testDeleteGroupRefusedKeepsTheMembers
            DocumentServiceImplTest
            SearchServiceImplTest
            DocumentOnlyGrantTest
            BookmarksDataServletTest
            RpcPermissionTest
            RpcPermissionGapsTest
            SoapPermissionGapsTest
            DocumentsDataServletTest
            ConvertPdfTest
            HealdanDocNumberSortTest
            InitializeReadOnlyTest
            EventEndpointTest
            EventEndpointPermissionTest
            SessionManagerThrottleTest
            NotesDataServletTest
            LockedDocsDataServletTest
        run: python3 .github/scripts/test-shards.py plan --times test-times.txt --minutes 5 --max-shards 8 "$UPSTREAM_TESTS"

  tests:
    name: Tests (${{ matrix.shard }} of ${{ matrix.of }})
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A failing shard leaves the others running, so one run shows every failing test.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.checks.outputs.shards) }}
    env:
      # Whether this job saves the Maven repository cache (see "Maven repository cache"): one shard, and only on master.
      SAVE_M2: ${{ github.ref == 'refs/heads/master' && matrix.saves_m2 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.checks.outputs.jdk }}

      # setup-java's own Maven cache had no fallback, so a pull request that edited a POM downloaded every dependency
      # again, and failed whenever logicaldoc.sourceforge.net refused one of them. These restore the newest copy and
      # download only what the POMs add. As in docker-image.yml, only master saves, from the shard the plan picks
      # (the first that tests logicaldoc-webapp, so the cache holds its dependencies too). The second restore key finds
      # the copies setup-java saved: the cache version hashes the path as written, so it stays absolute, like
      # setup-java's.
      - name: Maven repository cache
        if: env.SAVE_M2 == 'true'
        uses: actions/cache@v6
        with:
          path: /home/runner/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-
            setup-java-Linux-x64-maven-

      - name: Maven repository cache (restore only)
        if: env.SAVE_M2 != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-
            setup-java-Linux-x64-maven-

      # Maven uses a cached file only when its _remote.repositories names one of this build's repositories, in the form
      # the running Maven writes: 3.9 the repository's id, 3.10 its id and a hash of its URL. ubuntu-latest's images
      # ship both, and 3.9 matched nothing in a copy 3.10 saved, so every run downloaded every file again and failed
      # whenever logicaldoc.sourceforge.net refused. Without those files Maven takes every cached file as installed
      # here, whichever Maven saved it, and downloads only what's missing. Only master's runs write the copy.
      - name: Trust the cached Maven repository
        run: if [ -d ~/.m2/repository ]; then find ~/.m2/repository -name _remote.repositories -delete; fi

      # Healdan's copies of the artifacts only LogicalDOC's repository has (a mirror of it), and Terracotta's
      # repository, which have dependencies Maven Central doesn't. The Docker build uses the same file.
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp docker/maven-settings.xml ~/.m2/settings.xml

      # Every module but the WAR, and the GUI's Java without its GWT compile (healdan-core needs the GUI's classes).
      # The Docker image CI runs both, and they're most of a full build's time. The antrun skip goes with the GWT one:
      # the GUI's package step edits files the GWT compile writes, and the other modules' antrun steps only finish
      # the plugin zips the WAR unpacks. The tests need neither the javadoc jars nor the plugin zips, which the Docker
      # image CI also builds.
      - name: Maven install (all modules but the WAR, without the GWT compile)
        run: >-
          mvn -B -ntp -DskipTests -Dgwt.skipCompilation=true -Dmaven.antrun.skip=true -Dmaven.javadoc.skip=true
          -Dassembly.skipAssembly=true -Dmaven.source.skip=true -pl '!logicaldoc-webapp' install

      # Each module gets the whole -Dtest list and runs the classes it has. -fae runs every module's tests even when
      # one module's fail.
      - name: Test
        env:
          MODULES: ${{ matrix.modules }}
          TESTS: ${{ matrix.tests }}
        run: |
          touch ~/logicaldoc-dev.properties
          mvn -B -ntp -fae -pl "$MODULES" test -Dmaven.antrun.skip=true -Dsurefire.failIfNoSpecifiedTests=false -Dtest="$TESTS"

      - name: Record test times
        run: python3 .github/scripts/test-shards.py times ./*/target/surefire-reports > test-times-${{ matrix.shard }}.txt

      - name: Upload test times
        uses: actions/upload-artifact@v7
        with:
          name: test-times-${{ matrix.shard }}
          path: test-times-${{ matrix.shard }}.txt
          retention-days: 1

  # Saves the times every shard recorded, for the next run's plan. Skipped when a shard failed. It isn't part of build.
  test-times:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Download test times
        uses: actions/download-artifact@v8
        with:
          pattern: test-times-*
          merge-multiple: true
          path: shards

      - name: Merge test times
        run: cat shards/*.txt > test-times.txt

      - name: Save test times
        uses: actions/cache/save@v6
        with:
          path: test-times.txt
          key: test-times-${{ github.run_id }}-${{ github.run_attempt }}

  # The check master's ruleset requires. It passes when the checks and every shard passed, or when a docs-only pull
  # request skipped the shards. It runs even when the run is cancelled, and then fails, so a cancelled run can't count
  # as a pass.
  build:
    needs: [ checks, tests ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs' results
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          CODE: ${{ needs.checks.outputs.code }}
        run: |
          echo "checks: $CHECKS, tests: $TESTS, code changed: $CODE"
          if [ "$CHECKS" = success ] && { [ "$TESTS" = success ] || { [ "$TESTS" = skipped ] && [ "$CODE" = false ]; }; }; then
            exit 0
          fi
          echo "::error::The checks or a test shard didn't pass"
          exit 1
