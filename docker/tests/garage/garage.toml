# Smoke test only (docker/tests/compose.storage.yaml): a one-node Garage, with fixed test values.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "5370ce0000000000000000000000000000000000000000000000000000000001"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
# docker/tests/garage/setup.sh sends it
admin_token = "smoke-admin-token-0123456789abcdef"
